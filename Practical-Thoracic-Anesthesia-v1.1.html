d to these vessels. {e}"}, {"t": "h", "x": "What raises PVR in theatre", "dont": false}, {"t": "ul", "items": ["Hypoxia, hypercapnia and acidosis.", "Hypothermia and high haematocrit.", "High airway pressure.", "Pulmonary embolism, pulmonary hypertension and left-heart disease.", "One-lung ventilation and pulmonary artery clamping."]}, {"t": "h", "x": "What lung resection does", "dont": false}, {"t": "ul", "items": ["Right ventricular ejection fraction falls by 15–25% after lung resection. Patients with a larger fall have more complications. {g}", "The main mechanism is a rise in PVR with a fall in lung compliance. Intraoperative rises in PVR usually return to baseline within 24 hours. {g}", "Pneumonectomy produces higher pulmonary artery pressure and PVR, more RV dilatation, more arrhythmia and a greater fall in RVEF than lobectomy. {g}", "VATS patients have better right-heart systolic function than thoracotomy patients. {g}"]}, {"t": "h", "x": "Thoracic epidural and the heart", "dont": false}, {"t": "p", "x": "A thoracic epidural covering T1–T5 blocks cardiac sympathetic fibres. It reduces preload and load-independent contractility of both ventricles, and can trigger bradycardia and hypotension (Bezold–Jarisch reflex). It improves myocardial oxygen balance in ischaemic heart disease. In pulmonary hypertension it may limit the RV's ability to adapt to a rise in afterload. {g}"}, {"t": "say", "x": "Protect the right ventricle: avoid hypoxia, hypercapnia, acidosis, cold and high airway pressure, and keep systemic pressure up so the RV stays perfused."}]}, {"id": "p7", "code": "P7", "title": "Gas exchange at the bedside", "blocks": [{"t": "p", "x": "Three bedside numbers describe gas exchange: the alveolar–arterial (A–a) oxygen gradient, the PaO₂/FiO₂ ratio, and the dead-space fraction. {e}"}, {"t": "ul", "items": ["**Alveolar gas equation.** PAO₂ = FiO₂ × (P<sub>B<\/sub> − 47) − PaCO₂ / 0.8. The A–a gradient is PAO₂ − PaO₂. A widened gradient means shunt, V/Q mismatch or diffusion limitation. {e}", "**Arterial–end-tidal CO₂ ratio.** (PaCO₂ − EtCO₂) / PaCO₂ is an end-tidal surrogate for dead space, not the physiological dead-space fraction. The Enghoff equation, V<sub>D<\/sub>/V<sub>T<\/sub> = (PaCO₂ − P<sub>Ē<\/sub>CO₂) / PaCO₂, uses mixed-expired CO₂. The end-tidal version is also altered by shunt and by the shape of the capnogram. Use its trend, not its absolute value: a rising ratio suggests reduced perfusion of ventilated lung (low cardiac output, embolism, overdistension). {e}", "**Control of breathing.** PaCO₂ drives ventilation through medullary chemoreceptors. Carotid bodies stimulate ventilation when PaO₂ falls to about 50–60 mmHg. Lowering PaCO₂ by 5–10 mmHg below normal usually reaches the apnoeic threshold, which delays spontaneous breathing at emergence. {e}"]}, {"t": "calc", "name": "gas"}]}, {"id": "p8", "code": "P8", "title": "Pathophysiology that changes the anaesthetic", "blocks": [{"t": "table", "head": ["Condition", "Pathophysiology", "Anaesthetic consequence"], "rows": [["COPD and emphysema", "Airflow limitation, high compliance, gas trapping; bullae.", "Intrinsic PEEP and hypotension with positive pressure; extrinsic PEEP less predictable; a giant bulla can rupture, so it is an indication for lung isolation. Resecting emphysematous lung may improve V/Q (lung volume reduction effect). {e}"], ["Obesity and restrictive disease", "Reduced FRC from chest-wall load and diaphragm displacement.", "Rapid desaturation at induction; 25° head-up before and after preoxygenation improves PaO₂. {e}"], ["Pulmonary arterial hypertension", "Remodelled, stiff pulmonary arteries; pressure rises steeply with flow.", "Hypoxia and RV failure worsen quickly under anaesthesia. Worsened by COPD, embolism, hypoxia, hypercarbia, acidosis and inflammatory mediators. Continue pulmonary vasodilator therapy. {e}"], ["Anterior mediastinal mass", "Extrinsic compression of trachea, bronchi, heart, pulmonary artery or SVC.", "Collapse can occur at induction, with position change, or after an unplanned relaxant. The classical mechanism (loss of tone, positive pressure, paralysis) has limited direct evidence. In a single-centre, non-randomised, prospective observational study (17 adults, intubated awake, staged induction, semi-sitting), blinded bronchoscopic patency scores did not change after induction with spontaneous ventilation (P = 0.953) and increased with positive pressure (P = 0.024) and neuromuscular block (P < 0.001). Because the airway was secured before anaesthesia, it gives no conclusive evidence on the safety of paralysis and positive pressure before the airway is secured. {o} Flow–volume loop shows variable intrathoracic obstruction (flattened expiratory limb). {e} Positive pressure may widen the compressed segment on inspiration while expiration stays flow-limited, so gas trapping, not airway closure, may explain collapse during assisted ventilation; a long expiratory time avoids it (Sarkiss 2023, narrative review). {o}"], ["Bronchopleural fistula", "Communication between bronchus and pleural space.", "Positive pressure escapes through the fistula, tidal volume is lost, contaminated fluid can spill into the healthy lung; absolute indication for lung separation. {e}"], ["After lung resection", "Loss of lung volume, pain-limited cough, atelectasis, raised PVR, capillary leak after pneumonectomy.", "Reduce tidal volume (about 10–15% for a lobectomy); restrict fluid; prioritise analgesia; watch for AF and post-pneumonectomy oedema. {g}"]]}, {"t": "h", "x": "Flow–volume loops at a glance", "dont": false}, {"t": "table", "head": ["Pattern", "Inspiratory limb", "Expiratory limb", "Example"], "rows": [["Fixed obstruction", "Flattened", "Flattened", "Tracheal stenosis"], ["Variable extrathoracic", "Flattened", "Normal", "Vocal cord palsy, extrathoracic tracheal lesion"], ["Variable intrathoracic", "Normal", "Flattened", "Mediastinal mass compressing the lower trachea"], ["Obstructive (small airway)", "Near normal", "Scooped (concave)", "COPD, asthma"]]}, {"t": "p", "x": "Flow–volume loop interpretation is standard pulmonary physiology; the pack illustrates the patterns without a table. {d}"}]}], "preIntro": "Assessment decides who can safely undergo resection, how much lung can be removed, and what to improve before surgery. Tap the calculators to work through a patient.", "preop": [{"id": "r1", "code": "R1", "title": "The assessment pathway", "blocks": [{"t": "p", "x": "Preoperative assessment for lung resection answers three questions in order. Is the heart safe? Will enough lung function remain? Is the patient fit enough for the stress of surgery? The American College of Chest Physicians (ACCP, 2013) algorithm, summarised in the textbook, puts cardiac risk first. {g}"}, {"t": "ol", "items": ["History and examination.", "Cardiac risk: Thoracic Revised Cardiac Risk Index (R2).", "Lung function: ppoFEV₁ and ppoDLCO (R3).", "Exercise testing when indicated: stair climb, shuttle walk, then CPET (R3).", "Airway, lung isolation and special risks (R4, R5).", "Optimisation and prehabilitation (R6, R7)."]}, {"t": "h", "x": "History", "dont": false}, {"t": "ul", "items": ["Degree of dyspnoea and exercise tolerance. Severe exertional dyspnoea correlates with reduced FEV₁.", "Cough: a significant productive cough may mean infection needing treatment first.", "Smoking status.", "Comorbidities that change the anaesthetic plan."]}, {"t": "h", "x": "Examination", "dont": false}, {"t": "ul", "items": ["Cyanosis and clubbing (chronic hypoxaemia).", "Wheeze: poorly controlled COPD versus acute exacerbation or infection.", "Reduced breath sounds: effusion.", "Tracheal deviation and asymmetric diaphragmatic movement: warrant further imaging."]}, {"t": "h", "x": "The four Ms of lung cancer", "dont": false}, {"t": "table", "head": ["M", "Look for"], "rows": [["Mass effects", "Obstructive pneumonia, abscess, SVC syndrome, tracheobronchial distortion, Pancoast syndrome, recurrent laryngeal or phrenic nerve palsy, chest-wall or mediastinal extension."], ["Metabolic effects", "Lambert–Eaton syndrome, hypercalcaemia, hyponatraemia, Cushing's syndrome."], ["Metastases", "Brain, bone, liver, adrenal glands."], ["Medications", "Bleomycin (pulmonary toxicity, worse with high FiO₂), doxorubicin (cardiac), cisplatin (renal)."]]}, {"t": "h", "x": "Blood gases", "dont": false}, {"t": "p", "x": "Room-air PaO₂ <60 mmHg or PaCO₂ >45 mmHg was once used to exclude resection. These values no longer exclude a patient, because they do not predict postoperative outcome reliably. They remain useful as a baseline. {g}"}]}, {"id": "r2", "code": "R2", "title": "Cardiac risk: Thoracic RCRI", "blocks": [{"t": "p", "x": "Major cardiac morbidity after lung resection (arrhythmia, arrest, ischaemia, cardiac death) occurs in 2–3%. The Thoracic Revised Cardiac Risk Index (ThRCRI) recalibrates the RCRI for lung resection, and the ACCP recommends it in place of the RCRI. {g}"}, {"t": "calc", "name": "thrcri"}, {"t": "h", "x": "Refer for cardiology evaluation if any of these apply", "dont": false}, {"t": "ul", "items": ["ThRCRI ≥2.", "Any cardiac condition requiring medication.", "A newly suspected cardiac condition.", "Inability to climb two flights of stairs."]}, {"t": "p", "x": "The textbook-reproduced ACCP algorithm suggests postponing resection for at least 6 weeks after coronary intervention. That interval is older and insufficient for current stent practice. {o} Otherwise continue cardiac care, start any needed therapy, and proceed to pulmonary function and exercise testing. {g}"}, {"t": "h", "x": "Timing after coronary intervention (2024 AHA/ACC)", "dont": false}, {"t": "table", "head": ["Previous intervention", "Timing for elective surgery that needs antiplatelet interruption"], "rows": [["Balloon angioplasty, no stent", "Delay at least 14 days (class 1)."], ["Bare-metal stent", "Delay at least 30 days (class 1)."], ["Drug-eluting stent for acute coronary syndrome", "Ideally delay 12 months (class 1)."], ["Drug-eluting stent for chronic coronary disease", "Reasonable to delay 6 months (class 2a)."], ["Drug-eluting stent, time-sensitive surgery (for example cancer resection)", "May be considered from 3 months if the risk of delay outweighs the risk of MACE (class 2b). Within 30 days of any stent, surgery requiring antiplatelet interruption is potentially harmful."]]}, {"t": "p", "x": "Decide timing, antiplatelet management and the risk of delaying cancer surgery together with cardiology and the thoracic surgeon for each patient. If antiplatelet therapy must be interrupted, continue aspirin where possible. {g}"}]}, {"id": "r3", "code": "R3", "title": "Lung function and exercise capacity", "blocks": [{"t": "p", "x": "Postoperative pulmonary complications (atelectasis, pneumonia, bronchospasm, oedema, ARDS, respiratory failure) account for most perioperative morbidity. Risk is assessed on three legs: respiratory mechanics (FEV₁), parenchymal function (DLCO) and cardiopulmonary reserve (exercise testing). {g}"}, {"t": "h", "x": "Predicted postoperative values", "dont": false}, {"t": "p", "x": "ppoFEV₁% = preoperative FEV₁% × (1 − subsegments removed / 42). The same formula gives ppoDLCO%. The lungs contain 42 subsegments: right upper lobe 6, middle lobe 4, right lower lobe 12, left upper lobe 10, left lower lobe 10. ppoDLCO predicts complications and mortality independently of ppoFEV₁. {g}"}, {"t": "calc", "name": "ppo"}, {"t": "h", "x": "Thresholds differ between sources", "dont": false}, {"t": "p", "x": "The ACCP 2013 pathway uses 60% and 30%. An older rule treats ppoFEV₁ and ppoDLCO below 40% as high risk, and absolute FEV₁ below 0.8 L as a contraindication (above 1.5 L adequate). Know which pathway your thoracic team uses. {o}"}, {"t": "h", "x": "When the formula misleads", "dont": false}, {"t": "ul", "items": ["In severe COPD, resecting emphysematous lung can improve V/Q, so the true postoperative function is better than predicted. Regional function studies are more accurate; V/Q scanning is the reference standard, especially before pneumonectomy. {g}", "Subsegments already obstructed by tumour contribute no function; excluding them from the calculation is common practice. {d}"]}]}, {"id": "r4", "code": "R4", "title": "Airway, lung isolation and the mediastinum", "blocks": [{"t": "p", "x": "Assess the airway for isolation, not only for intubation. A single-lumen tube may pass easily where a double-lumen tube cannot. {e}"}, {"t": "ul", "items": ["Use a validated airway score (the Airway Risk Index) with predictors of difficult isolation: COPD, endobronchial tumour, tracheal pathology. {g}", "Read the CT yourself at the carina and both main bronchi. 3-D reconstruction and virtual bronchoscopy help choose the device. {g}", "Decide the isolation device and state a plan B before induction. Absolute indications for lung isolation: massive haemorrhage, abscess, bronchopleural fistula, giant bulla, sleeve pneumonectomy, lung transplantation. {e} A DLT is usually preferred where contamination must be prevented or suction and CPAP are needed; a blocker or intentional mainstem intubation is the alternative when a DLT cannot be placed. {g}", "Ultrasound of tracheal width can guide DLT size and correlates with CT. {g}"]}, {"t": "h", "x": "Anterior mediastinal mass", "dont": false}, {"t": "table", "head": ["Risk", "Features"], "rows": [["Low", "Asymptomatic or mild symptoms; no postural symptoms; no radiological compression."], ["Intermediate", "Mild to moderate postural symptoms; tracheal compression <50%."], ["High", "Severe postural symptoms, stridor, cyanosis; tracheal compression >50%, or with bronchial compression, pericardial effusion or SVC syndrome."]]}, {"t": "ul", "items": ["Investigations: CT, flow–volume loops (upright and supine), echocardiography for cardiac, pulmonary artery or SVC compression. {e}", "Plan with surgery, anaesthesia and critical care (textbook): awake fibreoptic intubation, passing a reinforced tube beyond the obstruction where the distal airway allows; sedation that preserves spontaneous ventilation (dexmedetomidine or ketamine); heliox; an agreed rescue position; rigid bronchoscope and operator; lower-limb access; ECMO standby for high risk. {e} Hartigan 2022 (a single-centre, non-randomised, prospective observational study; 17 adults intubated awake, staged induction, semi-sitting) found no loss of central airway patency with positive pressure or neuromuscular block (no airway collapse; patency scores unchanged after induction and increased with both). It challenges the practice of maintaining spontaneous breathing, but does not provide conclusive evidence that general anaesthesia with neuromuscular block and positive-pressure ventilation is safe before the airway is secured in patients with central airway compression. {o}", "If positive-pressure ventilation is used: match tidal volume, rate and I:E ratio to the patient's own breathing, keep the expiratory time long and the rate low, and avoid hyperventilation in chronic hypercapnia. Look for cardiac or great-vessel compression, for which ECMO is the review's suggested support. These are expert recommendations from a narrative review, not outcome-tested. {o}"]}, {"t": "p", "x": "Even asymptomatic patients can obstruct completely at induction. {e}"}]}, {"id": "r5", "code": "R5", "title": "Comorbidities to optimise or plan around", "blocks": [{"t": "table", "head": ["Condition", "Action before surgery"], "rows": [["COPD", "Postpone for acute exacerbation or infection and treat first. Optimise bronchodilators (long-acting β-agonist, inhaled steroid, anticholinergic) in patients who often need a rescue inhaler. Low preoperative SpO₂ independently predicts pulmonary complications. {g}"], ["Pulmonary hypertension", "Echocardiography; continue pulmonary vasodilators; plan invasive monitoring. A pulmonary artery catheter is reserved for severe known PAH and lung transplantation (EACTAIC). TOE for severe cardiac comorbidity. {g}"], ["Ischaemic heart disease", "ThRCRI pathway (R2); extended monitoring for cardiorespiratory comorbidity (EACTAIC 84%). {g}"], ["Anaemia", "Iron studies; intravenous iron if surgery is within 6 weeks (see R6). {g}"], ["Myasthenia gravis", "Quantitative neuromuscular monitoring even when no relaxant is given (EACTAIC 87%). {g}"], ["Previous chemotherapy", "Bleomycin: keep FiO₂ as low as safe. Doxorubicin: assess cardiac function. Cisplatin: assess renal function. {e}"], ["SVC obstruction", "Venous access in the lower limbs. {e}"], ["Elderly or cognitively vulnerable", "Avoid benzodiazepine premedication (ERAS/ESTS strong recommendation, moderate evidence); plan depth-of-anaesthesia monitoring. {g}"]]}, {"t": "h", "x": "Choosing the level of postoperative care", "dont": false}, {"t": "p", "x": "Preoperative tests help decide the level of postoperative care for high-risk patients, and sometimes suggest surgery is inappropriate. Indications for planned postoperative ventilation include inadequate pulmonary reserve, compromised myocardial function, large expected fluid shifts, ongoing bleeding and oesophagectomy with aspiration risk. {g}"}]}, {"id": "r6", "code": "R6", "title": "Optimisation: smoking, anaemia, nutrition, fasting", "blocks": [{"t": "h", "x": "Smoking cessation", "dont": false}, {"t": "table", "head": ["Time after stopping", "Physiological effect"], "rows": [["12–24 hours", "Carbon monoxide and nicotine levels fall."], ["48–72 hours", "Carboxyhaemoglobin normalises; oxyhaemoglobin curve shifts right."], ["2–4 weeks", "Less sputum; lower airway reactivity."], ["4–8 weeks", "Better lung function tests; fewer wound and respiratory complications."], ["8–12 weeks", "Lower overall postoperative morbidity and mortality."]]}, {"t": "ul", "items": ["Stopping for less than 8 weeks does not increase complications; the old fear of a harmful short cessation is not supported. {g}", "Large database studies show risk falling steadily with longer cessation, with benefit continuing beyond a year. Delaying cancer surgery to reach that benefit is not reasonable. {g}", "Counsel at the first visit. Offer behavioural support, nicotine replacement, varenicline or bupropion. Surgery is a moment when patients are motivated to stop permanently. {g}"]}, {"t": "h", "x": "Anaemia", "dont": false}, {"t": "ul", "items": ["Preoperative anaemia increases morbidity and mortality after lung resection. {g}", "Check iron studies to identify iron deficiency. Target normal haemoglobin before surgery. {g}", "Use intravenous iron when surgery is within 6 weeks. Ideally 4 weeks elapse between the first dose and surgery, but haemoglobin can rise significantly by 2 weeks. {g}", "Trial evidence that IV iron reduces transfusion is mixed. {o}"]}, {"t": "h", "x": "Nutrition", "dont": false}, {"t": "ul", "items": ["At risk: BMI ≤18.5, weight loss >10% (or >5% in 3 months), or BMI ≥30. {g}", "Severe malnutrition (weight loss 10–15%, BMI <18.5, albumin <30 g/L without liver or renal disease): 7–10 days of enteral supplementation before surgery (ESPEN). {g}", "Keep fasting to the minimum; consider nutritional counselling and immunonutrition. {g}"]}, {"t": "h", "x": "Fasting and carbohydrate loading", "dont": false}, {"t": "ul", "items": ["\"Nil by mouth from midnight\" is no longer recommended. Clear fluids up to 2 hours before surgery are safe and beneficial. {g}", "Exceptions: delayed gastric or oesophageal emptying, such as type 1 diabetes, oesophageal cancer and achalasia. {g}", "Carbohydrate loading reduces insulin resistance, catabolism and hyperglycaemia and improves comfort. Evidence for fewer complications or shorter stay is conflicting. {o}"]}]}, {"id": "r7", "code": "R7", "title": "Prehabilitation", "blocks": [{"t": "p", "x": "Prehabilitation is structured preparation that raises physiological reserve before surgery, so the patient withstands surgery better and returns to baseline sooner. Low exercise capacity on CPET predicts postoperative cardiac and pulmonary morbidity and poorer long-term survival. {g}"}, {"t": "h", "x": "Components", "dont": false}, {"t": "ul", "items": ["Aerobic exercise training.", "Resistance training.", "Respiratory and inspiratory muscle training.", "Dietary intervention guided by a nutritionist.", "Stress reduction and psychological support.", "Smoking-cessation support."]}, {"t": "h", "x": "Dose and evidence", "dont": false}, {"t": "ul", "items": ["A typical programme lasts 4–6 weeks, supervised or at home. {g}", "Programmes of 30 days improve the 6-minute walk distance and the anaerobic threshold on CPET. Referral as soon as surgery is planned avoids delay. {g}", "In lung resection, a Cochrane review and a meta-analysis report shorter hospital stay, shorter chest-drain duration and fewer complications; most programmes lasted 4 weeks or less. {g}", "In oesophagectomy results are mixed, but studies that included inspiratory muscle training showed fewer pulmonary complications. {g}", "The ACCP recommends pre- or postoperative rehabilitation for patients at increased risk (grade 1C). Study quality is low and the optimal length and content are not known. {o}"]}, {"t": "calc", "name": "prehab"}]}, {"id": "r8", "code": "R8", "title": "Pre-anaesthetic checklist", "blocks": [{"t": "p", "x": "Tick each item during the pre-anaesthetic review. Ticks are stored only on this device; no patient details are recorded. Reset before the next patient."}, {"t": "calc", "name": "checklist"}]}], "lessonsIntro": "Each lesson follows one common error from scenario to mechanism, then shows the catch that makes the obvious explanation wrong, and ends with a take-home action. Swipe or use the buttons to move through the four parts.", "lessons": [{"id": "c0", "related": "Related: Crisis cards", "beats": [{"label": "Principle", "blocks": [{"t": "p", "x": "Thoracic anaesthesia asks the anaesthetist to do something no other speciality asks. It asks for a working lung to be switched off, on purpose, while the patient is asleep. The surgeon needs a still, collapsed lung to see the hilum. The patient needs that same lung, or its partner, to stay alive."}, {"t": "p", "x": "These two needs conflict every minute of the case. Most of the time, the conflict is managed quietly. When it is not, the anaesthetist has seconds, not minutes."}, {"t": "say", "x": "In a genuine crisis, do the easiest thing that takes the least time. That thing keeps the patient alive long enough to do the right thing."}, {"t": "p", "x": "In a thoracic theatre, the easiest things are three. Turn the oxygen to 100%. Tell the surgeon. Put the second lung back to work. Each takes less than ten seconds. Everything else in this companion comes after those three."}, {"t": "p", "x": "The bronchoscope, the algorithm and the evidence tables come next, and they matter. They matter to a patient who is still oxygenated."}]}], "title": "Principle · The shortest route to oxygen"}, {"id": "c1", "related": "Related: Core skills A3–A4 · Crisis B1–B2", "beats": [{"label": "Scenario", "blocks": [{"t": "p", "x": "A resident places a left double-lumen tube. The tracheal lumen is clamped; breath sounds are heard only on the left. The bronchial lumen is clamped; breath sounds are heard only on the right. The resident says, \"Perfect.\" The patient is turned onto the side. Twenty minutes later, the surgeon says the lung is not collapsing, and the saturation starts to fall."}]}, {"label": "Mechanism", "blocks": [{"t": "p", "x": "A double-lumen tube is two tubes joined side by side. The tracheal lumen ends above the carina. The bronchial lumen ends in the left main bronchus. A small cuff on the bronchial lumen seals that bronchus."}, {"t": "p", "x": "The left main bronchus is long, so the left tube has room to move. The right upper lobe bronchus leaves the right main bronchus about two centimetres below the carina, so a right tube has a margin of 4 to 8 millimetres. Turning the patient onto the side flexes the neck and pulls the tube. Traction on the lung moves the bronchus. A tube that was correct when the patient was supine can be wrong once the patient is lateral."}, {"t": "p", "x": "Breath sounds travel across the chest. A stethoscope hears air moving. It cannot tell whether the bronchial cuff has slipped up to straddle the carina, or whether the tube has slid into a lobar bronchus and is ventilating only one lobe."}]}, {"label": "The catch", "blocks": [{"t": "p", "x": "The tube did not fail after the turn. The confirmation failed before it. The stethoscope confirmed that gas moves. It never confirmed where the tube sits."}, {"t": "say", "x": "Auscultation tells you that gas moves. The bronchoscope tells you where the tube sits."}, {"t": "p", "x": "The bronchoscope answers with four views. Through the tracheal lumen: the carina, and the upper edge of the blue cuff just below it in the left bronchus. Through the bronchial lumen: the division of the left upper and lower lobes. On the right side, one landmark settles every argument: the right upper lobe bronchus, which divides into three openings almost at once. If three openings are seen, the scope is on the right."}]}, {"label": "Take-home", "blocks": [{"t": "say", "x": "Look supine. Look lateral. Look again whenever the numbers change. Name the view out loud."}, {"t": "p", "x": "At every check, say what you see: \"rings anterior, carina, blue cuff edge below.\" Naming the view proves you have found the tube."}, {"t": "note", "x": "Record a case where auscultation reassured you and the bronchoscope did not.", "key": "c1"}]}], "title": "Lesson 1 · The tube that sounds right"}, {"id": "c2", "related": "Related: Core skills A5 · Crisis B12", "beats": [{"label": "Scenario", "blocks": [{"t": "p", "x": "A patient with a tracheostomy needs a right middle and lower lobectomy. A double-lumen tube is not possible. The resident places a bronchial blocker in the right main bronchus under direct vision. The position is perfect. At the end of the case, the blocker will not come out."}]}, {"label": "Mechanism", "blocks": [{"t": "p", "x": "A bronchial blocker is a catheter with a balloon at its tip. It passes through an ordinary single-lumen tube. Inflated in a main bronchus, the balloon stops gas reaching that lung."}, {"t": "p", "x": "The balloon is soft and holds low pressure, so it is gentle on the airway. For the same reason, it moves more. In pooled trials, the blocker isolated the lung as well as the double-lumen tube, caused fewer injuries and fewer sore throats, and moved out of place more often: 32% against 25%."}, {"t": "p", "x": "On the right, the balloon sits near the carina and covers the upper lobe opening. The catheter tip lies beyond the balloon, down the bronchus intermedius. The bronchus intermedius is the short airway, about 2.5 cm long, that carries air to the middle and lower lobes."}]}, {"label": "The catch", "blocks": [{"t": "p", "x": "The blocker was not misplaced. It was placed correctly, in the one spot the surgeon was about to staple. The stapler closed across the bronchus intermedius, and across the blocker tip inside it. Correct position is defined by the operation, not by the anatomy alone."}, {"t": "p", "x": "A second trap sits on the same side. If the balloon slips back after the surgeon has divided the upper lobe vein but before the artery, the lobe re-inflates with blood flowing in and no way out. The engorged lobe fills the camera view, and the surgeon may have to open the chest."}]}, {"label": "Take-home", "blocks": [{"t": "say", "x": "Before the bronchus is clamped, ask: is anything of mine in that bronchus?"}, {"t": "p", "x": "For a right middle and lower lobectomy, withdraw the blocker into the trachea before the bronchus intermedius is clamped. Raise it at the team brief so the surgeon expects the question."}]}], "title": "Lesson 2 · The narrow landing zone"}, {"id": "c3", "related": "Related: Core skills A6 · Crisis B3", "beats": [{"label": "Scenario", "blocks": [{"t": "p", "x": "Every trainee learns a small ritual. One-lung ventilation starts, and someone opens the cap on the operative side of the tube, \"to let the air out.\" It looks sensible. Air leaves a balloon when the balloon is opened."}]}, {"label": "Mechanism", "blocks": [{"t": "p", "x": "A lung collapses by two routes. Gas leaves through the airway, and gas is absorbed into the blood. Oxygen is absorbed quickly. Nitrogen is absorbed slowly. A lung filled with 100% oxygen before isolation therefore collapses quickly, because almost all its gas can be absorbed."}, {"t": "p", "x": "After isolation, while the chest is still closed, absorption continues. The isolated lung develops a negative pressure."}]}, {"label": "The catch", "blocks": [{"t": "p", "x": "The open cap does not let air out. It lets room air in. The negative pressure draws room air, and its nitrogen, back into the lung. The nitrogen cannot be absorbed quickly, so the lung stays inflated."}, {"t": "p", "x": "A two-group study with double-lumen tubes measured this. With the port closed, the median time to lung collapse was 24 minutes. With the port open, it was 54 minutes. The ritual cost half an hour."}]}, {"label": "Take-home", "blocks": [{"t": "say", "x": "Fill the lung with oxygen, isolate it, and keep the port closed until the pleura is open."}, {"t": "p", "x": "For a blocker, add one step: disconnect the circuit at the end of expiration, let the lung empty, then inflate the balloon."}]}], "title": "Lesson 3 · The lung that will not collapse"}, {"id": "c4", "related": "Related: Physiology P2–P3 · Crisis B1", "beats": [{"label": "Scenario", "blocks": [{"t": "p", "x": "The pulse oximeter tone drops a note. 94. Then another. 90. The surgeon is dissecting the pulmonary artery and does not look up. 86."}]}, {"label": "Mechanism", "blocks": [{"t": "p", "x": "During one-lung ventilation, blood still flows through the collapsed lung. That blood meets no oxygen and returns to the left heart unoxygenated. This is shunt. The body reduces shunt by constricting vessels in the collapsed, oxygen-poor lung; this reflex is hypoxic pulmonary vasoconstriction. Shunt is larger when the right lung is collapsed, because the right lung is bigger and receives about 10% more blood."}, {"t": "p", "x": "The saturation falls for one of four reasons. The tube or blocker has moved, so the ventilated lung is partly blocked. The ventilated lung has collapsed in places; this is atelectasis. Secretions or blood block the airway. Or cardiac output has changed. The first reason is the commonest."}]}, {"label": "The catch", "blocks": [{"t": "p", "x": "Two beliefs are wrong. The first belief is that the algorithm starts with PEEP and ends with two-lung ventilation. For a patient whose saturation is falling fast, two-lung ventilation is the first definitive step, not the last. It is the easiest action and the quickest."}, {"t": "p", "x": "The second belief is that PEEP on the ventilated lung is dangerous. Textbooks taught this until about 2003: PEEP was said to push blood into the collapsed lung and worsen shunt. The effect exists, but it is smaller than feared. Too little PEEP lets the ventilated lung collapse. Too much increases shunt. The answer is not \"no PEEP\"; the answer is PEEP titrated to the lung in front of you, at the lowest driving pressure."}]}, {"label": "Take-home", "blocks": [{"t": "say", "x": "Oxygen, tell the surgeon, two lungs. Then find the cause."}, {"t": "p", "x": "Once the saturation recovers, work in order: bronchoscope for position, suction, recruitment and PEEP on the ventilated lung, then oxygen or CPAP to the collapsed lung. **Two-lung ventilation is not failure. It is time bought.**"}, {"t": "note", "x": "Record the first time you saw saturation fall during one-lung ventilation, and what you did first.", "key": "c4"}]}], "title": "Lesson 4 · The falling saturation"}, {"id": "c5", "related": "Related: Preop R4 · Crisis B5", "beats": [{"label": "Scenario", "blocks": [{"t": "p", "x": "A young man with a large anterior mediastinal mass needs a biopsy. He sleeps propped on three pillows but says he has no breathing problem. Induction goes smoothly. Thirty minutes later, he moves, and a dose of rocuronium is given. Breath sounds vanish on the right. Peak airway pressure climbs into the 40s and 50s."}]}, {"label": "Mechanism", "blocks": [{"t": "p", "x": "The classical teaching says an awake patient holds a compressed airway open with four forces: sitting up keeps the mass off the trachea, bronchial muscle tone stiffens the wall, spontaneous breathing creates negative pressure around the airway, and the diaphragm keeps lung volume high."}, {"t": "p", "x": "On this view, anaesthesia removes the forces one at a time: lying flat, drug-induced loss of tone, positive pressure, and finally paralysis, which lets the diaphragm rise and lung volume fall by up to 1.5 litres."}]}, {"label": "The catch", "blocks": [{"t": "p", "x": "The four-force explanation is the textbook teaching, but direct evidence for it is limited."}, {"t": "p", "x": "In a single-centre, non-randomised, prospective observational study, 17 adults with large mediastinal masses were intubated awake. Their compressed airway was recorded by continuous video bronchoscopy during a staged induction in a semi-sitting position, and seven bronchoscopists scored airway diameter against the awake baseline without knowing which phase they were viewing. Induction with spontaneous ventilation made no significant difference. Patency scores rose with positive-pressure ventilation and rose further with neuromuscular block. No patient had airway collapse or difficult ventilation."}, {"t": "p", "x": "The authors conclude that the prevailing assumptions need reassessment, but that a conventional (non-staged) induction is not proven safe. The study challenges the practice of maintaining spontaneous breathing. It had no comparison group, and every patient was already intubated before positive pressure or relaxant was given, so it does not provide conclusive evidence that general anaesthesia with paralysis and positive-pressure ventilation is safe before the airway is secured."}, {"t": "p", "x": "A 2023 narrative review reads these data more strongly, arguing that intravenous induction with relaxant need not be feared. It also proposes a second danger that the classical story overlooks: during positive-pressure ventilation the narrowed airway lets gas in more easily than out, so trapped gas can cause haemodynamic collapse unless expiration is long. Both points are expert interpretation, not tested outcomes."}, {"t": "say", "x": "The mechanism is uncertain. The textbook rescue plan still applies."}]}, {"label": "Take-home", "blocks": [{"t": "p", "x": "Before induction, agree the rescue position for this patient: sitting, lateral or prone. Write it on the theatre board."}, {"t": "p", "x": "Consider awake fibreoptic intubation, with a reinforced tube passed beyond the obstruction where the distal airway allows. Have the rigid bronchoscope and its operator in the room, and venous access in the legs."}, {"t": "p", "x": "If ventilation becomes difficult: wake the patient if possible, move to the rescue position, and proceed to rigid bronchoscopy."}]}], "title": "Lesson 5 · The patient who could breathe until he slept"}, {"id": "c6", "related": "Related: Core skills A9 · Crisis B13–B14", "beats": [{"label": "Scenario", "blocks": [{"t": "p", "x": "A patient returns to the ward after a right pneumonectomy. The case went well. At two in the morning, the nurse turns the patient to change the sheet. The blood pressure falls to 60 and the neck veins swell."}]}, {"label": "Mechanism", "blocks": [{"t": "p", "x": "After pneumonectomy, one side of the chest is empty. The heart sits in its pericardial sac, which the surgeon may have opened and partly closed. Pressure differs between the two sides of the chest. If the pericardial repair is incomplete or gives way, the heart can slip through the opening into the empty side. This is cardiac herniation."}, {"t": "p", "x": "After a right pneumonectomy, the heart rotates and kinks the great veins: pressure falls and neck veins swell. After a left pneumonectomy, the edge of the opening squeezes the ventricle: ischaemia and arrhythmia follow. Mortality exceeds 50%."}]}, {"label": "The catch", "blocks": [{"t": "p", "x": "The instinct is to lie the patient flat and resuscitate. Flat is the wrong position. The heart fell because of gravity and pressure. **Operated side up** lets it fall back."}, {"t": "p", "x": "The same night hides a second trap. The remaining lung is fragile; its capillaries leak. Fluid given to \"help the blood pressure\" goes into that lung. Post-pneumonectomy pulmonary oedema occurs in 2–5% and kills up to half. The fluid ceiling is low: less than 3 litres of crystalloid in the first 24 hours, and no chasing of urine output."}]}, {"label": "Take-home", "blocks": [{"t": "say", "x": "After pneumonectomy: turn with care, no suction on the drain, operated side up in collapse, and a written fluid ceiling on the chart."}, {"t": "note", "x": "Record a postoperative call where the correct first action was a position, not a drug.", "key": "c6"}]}], "title": "Lesson 6 · The quiet night after pneumonectomy"}, {"id": "c7", "related": "Related: Crisis B11", "beats": [{"label": "Scenario", "blocks": [{"t": "p", "x": "Fire in an operating theatre is associated with head and neck surgery, nasal cannulae and lasers. Chest surgery rarely comes to mind."}]}, {"label": "Mechanism", "blocks": [{"t": "p", "x": "Fire needs three elements: oxygen, a spark and fuel. Diathermy is the spark. Gauze, drapes and the tube are fuel. During one-lung ventilation, the anaesthetist often gives 100% oxygen, and sometimes CPAP with 100% oxygen to the collapsed lung."}]}, {"label": "The catch", "blocks": [{"t": "p", "x": "The oxygen source is not only the circuit. It is the patient's lung. A lung that leaks, a giant bulla filled with oxygen, or an open bronchial stump releases oxygen directly into the surgical field, beside the diathermy. Cases include a bulla that ignited when opened and a flame from a bronchial stump that charred the tube."}]}, {"label": "Take-home", "blocks": [{"t": "say", "x": "Wet swabs near the airway, scissors for bullae, and room air when the surgeon asks to inflate the lung."}]}], "title": "Lesson 7 · Oxygen, spark, sponge"}], "refs": ["El Tahan MR, Tschernko E, Végh T, et al. Monitoring in thoracic anesthesia: EACTAIC consensus document. J Cardiothorac Vasc Anesth 2026;40:985–993.", "Granell Gil M, Martínez Plumed R. Airway management in thoracic anesthesia in the light of the guidelines of EACTAIC-thoracic group: what is next? Curr Opin Anesthesiol 2026;39:66–70.", "Cohen E. Current practice issues in thoracic anesthesia. Anesth Analg 2021;133:1520–1531.", "Palaczynski P, Misiolek H, Szarpak L, et al. Systematic review and meta-analysis of efficiency and safety of double-lumen tube and bronchial blocker for one-lung ventilation. J Clin Med 2023;12:1877.", "Bussières JS, Marques E. Atelectasis in one lung ventilation: the good, the bad, and the ugly. Curr Chall Thorac Surg 2023;5:38.", "Kaye AD, Urman RD, eds. Thoracic Anesthesia Procedures. Oxford University Press; 2021 (chapters 1, 3, 5, 6, 10, 11, 12, 13, 15, 16, 18, 19).", "Anaesthesia for thoracic surgery. Anaesth Intensive Care Med 25(2):72 (published 2023).", "Morimoto Y. Recent advances in regional anesthesia for thoracic surgery. Anesth Res 2026;3:19.", "Clairoux A, Issa R, Bélanger MÈ, et al. Perioperative pain management for thoracic surgery: a narrative review. Curr Chall Thorac Surg 2023;5:36.", "González-Santos S, Mugabure B, Granell M, et al. Intrathecal morphine or intercostal levobupivacaine after VATS lung resection: RCT. J Clin Med 2024;13:1972.", "Couture EJ, Nabzdyk CG. Pulmonary hemodynamics and lung surgery: a narrative review. Curr Chall Thorac Surg 2023;5:39.", "Cohen JB, Smith BB, Teeter EG. Update on guidelines and recommendations for enhanced recovery after thoracic surgery. Curr Opin Anesthesiol 2024;37:58–63.", "Al-Abri A, Shafiepour DS. Prehabilitation and enhanced recovery after thoracic surgery: a narrative review. Curr Chall Thorac Surg 2023;5:37.", "Grandjean C, Casso G, Noirez L, et al. Innovations to improve lung isolation training for thoracic anesthesia. J Clin Med 2024;13:1848.", "Savoie-White FH, Menier CA, Vieira A, Ugalde PA. Uniportal VATS for lung cancer: a narrative review. Curr Chall Thorac Surg 2023;5:40.", "Shelley B, Licker M, Slinger P. Thoracic anaesthetic research: 90 years of sustained progress. Br J Anaesth 2023;130:e30–e33.", "American College of Chest Physicians. Brunelli A, Kim AW, Berger KI, Addrizzo-Harris DJ. Physiologic evaluation of the patient with lung cancer being considered for resectional surgery. Chest 2013;143(5 Suppl):e166S–e190S (as reproduced in Kaye & Urman, chapter 5).", "Thompson A, Fleischmann KE, Smilowitz NR, et al. 2024 AHA/ACC/ACS/ASNC/HRS/SCA/SCCT/SCMR/SVM Guideline for perioperative cardiovascular management for noncardiac surgery. Circulation 2024;150:e351–e442.", "Hartigan PM, Karamnov S, Gill RR, et al. Mediastinal masses, anesthetic interventions, and airway compression in adults: a prospective observational study. Anesthesiology 2022;136(1):104–114. doi:10.1097/ALN.0000000000004011. PMID: 34724550.", "Earnshaw C, Kamalanathan K. Thoracic surgery. In: Allman KG, Wilson IH, et al., eds. Oxford Handbook of Anaesthesia, 5th edn. Oxford University Press; 2022: chapter 20, pp. 529–555 (case-sheet format and procedural details summarised in original wording).", "Sahai C. History of thoracic surgery and anesthesia. In: Sood J, Sharma S (eds). Clinical Thoracic Anesthesia. Springer 2020, ch 1.", "Sood J, Sharma S (eds). Clinical Thoracic Anesthesia. Springer Nature Singapore; 2020.", "Sarkiss M, Jimenez CA. The evolution of anesthesia management of patients with anterior mediastinal mass. Mediastinum 2023;7:16. doi:10.21037/med-22-37."], "cases": [{"id": "c1", "code": "C1", "title": "Rigid bronchoscopy, stent and foreign body", "sub": "10–20 min (longer for stents) · Pain +", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Inspection of the tracheobronchial tree with biopsy, debulking, stent insertion or foreign-body removal"], ["Time", "10–20 min (longer for stents)"], ["Pain", "+"], ["Position", "Supine, head and neck extended"], ["Blood loss", "Usually minimal; rarely life-threatening bleeding after biopsy"], ["Practical techniques", "TIVA (propofol, remifentanil or alfentanil), neuromuscular block, low-frequency jet ventilation through the bronchoscope, or apnoeic oxygenation with high-flow nasal oxygen"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Look for central airway obstruction: stridor, positional dyspnoea, tracheal tumour on CT.", "Ask about reflux: the airway is unprotected during the procedure.", "Often combined with mediastinoscopy or EBUS for staging.", "Warn about cough, sore throat and blood-streaked sputum."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Preoxygenate fully and test the jet injector before induction.", "Induce in theatre with the surgeon scrubbed and the bronchoscope ready.", "Ventilate in step with the surgeon: stop jetting when asked.", "Sanders injector entrains room air, so tracheal FiO₂ is about 0.8. Watch chest rise and fall to avoid barotrauma.", "Dexamethasone reduces airway oedema."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Sit up as soon as awake.", "A retained clot can obstruct a lower airway: be ready to reintubate, suction and re-bronchoscope."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Intensely stimulating: expect marked hypertension and tachycardia, then rapid offset.", "Profound relaxation is needed intraoperatively, with fast return of reflexes at the end.", "Stent placement may involve periods without airway control.", "TIVA prevents theatre pollution from the leak around the bronchoscope."]}, {"t": "rel", "x": "Related: Devices D7 · Crisis B6"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 p. 540; Kaye & Urman ch 10"}]}, {"id": "c2", "code": "C2", "title": "Flexible bronchoscopy and endobronchial ultrasound (EBUS)", "sub": "Variable, usually short · Pain +", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Airway inspection with transbronchial needle aspiration of mediastinal and hilar nodes for staging"], ["Time", "Variable, usually short"], ["Pain", "+"], ["Position", "Supine"], ["Blood loss", "Minimal"], ["Practical techniques", "Local anaesthetic topicalisation ± sedation, or GA (TIVA) via laryngeal mask or single-lumen tube"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Check for airway compression by nodes or mass.", "Clarify sedation versus GA with the operator.", "Review anticoagulants before needle biopsy."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["The scope occupies much of the airway lumen: expect high resistance and leak.", "Use a large laryngeal mask or tube, a bronchoscopy swivel adapter and high fresh-gas flow; hand-ventilate if needed.", "Coughing displaces the needle: keep an adequate depth or topicalise well."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Day-case discharge in suitable patients.", "Observe for pneumothorax and bleeding."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Flexible bronchoscopy reaches peripheral airways and does not need neck extension.", "Loss of the airway view from bleeding needs rapid suction and a plan to isolate."]}, {"t": "rel", "x": "Related: Devices D6"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 p. 541; Kaye & Urman ch 10"}]}, {"id": "c3", "code": "C3", "title": "Cervical mediastinoscopy", "sub": "20–30 min · Pain +", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Inspection and biopsy of paratracheal and subcarinal nodes through a suprasternal incision"], ["Time", "20–30 min"], ["Pain", "+"], ["Position", "Supine, slight head-up, shoulder bolster, head ring"], ["Blood loss", "Usually minimal, but sudden massive haemorrhage from great vessels is possible; group and save"], ["Practical techniques", "GA, single-lumen tube, IPPV"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Check for SVC obstruction and tracheal compression.", "Often combined with rigid bronchoscopy."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["The head is under drapes: secure the tube well.", "Place a pulse oximeter or arterial line on the right hand: loss of the trace means innominate artery compression. {d}", "Insert a large-bore cannula in a lower-limb vein after induction when SVC injury or obstruction is possible.", "Watch tidal volume and airway pressure for surgical compression of the trachea."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Simple analgesia; day-case precautions."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Great-vessel injury may need immediate sternotomy.", "Other complications: pneumothorax, recurrent laryngeal nerve injury, venous air embolism in the head-up position."]}, {"t": "rel", "x": "Related: Crisis B7, B10"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 p. 541; Kaye & Urman ch 10"}]}, {"id": "c4", "code": "C4", "title": "VATS wedge resection, segmentectomy and lobectomy", "sub": "2–4 h (wedge resection shorter) · Pain +++ to +++++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Thoracoscopic resection through one or more ports"], ["Time", "2–4 h (wedge resection shorter)"], ["Pain", "+++ to +++++"], ["Position", "Lateral decubitus, table broken, arms forward"], ["Blood loss", "100–500 mL; conversion to thoracotomy can bring major bleeding; group and save"], ["Practical techniques", "GA, OLV via left DLT or blocker, arterial line for most cases, paravertebral or erector spinae block, multimodal analgesia"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Full risk assessment: ThRCRI, ppoFEV₁ and ppoDLCO, exercise testing if indicated.", "Read the CT for isolation difficulty; choose the device and plan B.", "ERAS: education, carbohydrate drink, no benzodiazepine premedication."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Confirm tube position bronchoscopically after turning.", "FiO₂ 1.0 at the start of OLV; keep the isolated lumen closed until the pleura is open.", "Tidal volume 4–6 mL/kg IBW; titrate PEEP to the lowest driving pressure.", "Opposite-side DLT to the operation avoids tube trauma to the resected bronchus. For right middle and lower resection, pull a blocker back before the bronchus intermedius is stapled.", "Suction the collapsed lung before reinflation; the stump is leak-tested at about 20–30 cmH₂O."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Extubate awake, sitting up.", "Humidified oxygen, chest X-ray, early mobilisation.", "Paravertebral or ESP analgesia; avoid excess fluid."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["PROSPECT recommends paravertebral or erector spinae block for VATS rather than epidural first.", "Conversion to open surgery: be ready for rapid blood loss and a larger analgesic need."]}, {"t": "rel", "x": "Related: Core skills A2–A6 · Preop R2–R3"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 pp. 542–3; Kaye & Urman ch 12; PROSPECT (Morimoto 2026)"}]}, {"id": "c5", "code": "C5", "title": "Open thoracotomy: lobectomy and sleeve resection", "sub": "2–4 h · Pain +++++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Anatomical lobar resection through a posterolateral thoracotomy; sleeve resection removes a bronchial segment with the lobe and re-anastomoses the airway"], ["Time", "2–4 h"], ["Pain", "+++++"], ["Position", "Lateral decubitus, table broken"], ["Blood loss", "100–500 mL, occasionally much more; group and save or cross-match"], ["Practical techniques", "GA, OLV via DLT (contralateral for sleeve resection), arterial line, thoracic epidural or paravertebral catheter"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["As for VATS resection, with a stronger case for epidural analgesia.", "Sleeve resection: plan a DLT on the side opposite the anastomosis."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Hilar manipulation compresses the heart and great veins: hypotension and arrhythmia are common.", "Keep the tube clear of the bronchial anastomosis; confirm with the bronchoscope before closure.", "Heparin may be needed if a vascular sleeve is performed.", "Treat epidural hypotension with a vasoconstrictor, not fluid, once adequately resuscitated."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Extubate at the end where possible; avoid high airway pressure on the anastomosis.", "Watch for AF, sputum retention and air leak."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Chronic post-thoracotomy pain affects 25–60%: severe acute pain is the strongest risk factor."]}, {"t": "rel", "x": "Related: Core skills A8 · Crisis B17, B20"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 pp. 542–3; Kaye & Urman ch 12; Clairoux 2023"}]}, {"id": "c6", "code": "C6", "title": "Pneumonectomy", "sub": "2–4 h · Pain +++++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Removal of an entire lung"], ["Time", "2–4 h"], ["Pain", "+++++"], ["Position", "Lateral decubitus"], ["Blood loss", "100–500 mL, occasionally much more; cross-match"], ["Practical techniques", "GA, left DLT for right pneumonectomy (right DLT or blocker for left), arterial line, central line on the operative side, epidural or paravertebral catheter"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["ppoFEV₁ and ppoDLCO with the full pathway; V/Q scan where regional function is uncertain.", "Echocardiography when pulmonary hypertension is suspected.", "Agree the postoperative care level (HDU or ICU)."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Pulmonary artery clamp test: watch for RV failure (rising CVP, falling pressure).", "Fluid ceiling: positive balance <20 mL/kg and crystalloid <3 L in 24 h; no third-space replacement.", "Withdraw the DLT bronchial lumen before the main bronchus is stapled.", "After closure, the pneumonectomy drain is handled only as the surgeon instructs: never routine suction."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Extubate early; turn carefully.", "Monitor for cardiac herniation, post-pneumonectomy oedema and bronchopleural fistula."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Perioperative mortality is 5–13% in the handbook series; acute lung injury occurs in about 4% of resections, with 30–50% mortality.", "Right pneumonectomy carries more risk of fistula and oedema than left."]}, {"t": "rel", "x": "Related: Core skills A9 · Crisis B13–B15 · Physiology P6"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 pp. 542–3; Kaye & Urman chs 13, 15"}]}, {"id": "c7", "code": "C7", "title": "Lung volume reduction, bullectomy and endobronchial valves", "sub": "Surgery 2–5 h; valves shorter · Pain +++ to +++++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Resection or bronchoscopic occlusion of hyperinflated, poorly functioning emphysematous lung"], ["Time", "Surgery 2–5 h; valves shorter"], ["Pain", "+++ to +++++"], ["Position", "Lateral for VATS or thoracotomy; supine for sternotomy"], ["Blood loss", "100–500 mL; group and save"], ["Practical techniques", "GA, OLV with deliberate low minute ventilation, arterial line, paravertebral catheter; valves under sedation or GA"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Highly selected, very high-risk patients (surgical mortality about 5–10%).", "Treat bronchospasm and infection first; review CT for bullae."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Preoxygenate thoroughly: desaturation is rapid.", "Avoid N₂O; positive pressure can rupture bullae and cause tension pneumothorax.", "Limit gas trapping: V<sub>T<\/sub> about 5–6 mL/kg, rate 10–12, I:E 1:4, peak pressure <30 cmH₂O, permissive hypercapnia (pH >7.2).", "Operative lung collapse is slow: surgical compression and bronchial suction help.", "Restrict fluid unless bleeding."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Aim to extubate at the end; HDU or ICU.", "Watch air leaks closely; excellent analgesia and physiotherapy."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Prolonged air leak (>7 days) is the commonest complication.", "Endobronchial valves fail when collateral ventilation crosses the fissures.", "A young patient with a single congenital bulla needs the same ventilation care but is usually much fitter."]}, {"t": "rel", "x": "Related: Physiology P5, P8 · Crisis B2"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 pp. 544–5"}]}, {"id": "c8", "code": "C8", "title": "Empyema drainage and decortication", "sub": "Drainage 20–40 min; decortication 2–3 h · Pain +++ to +++++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Removal of pleural pus and the organised fibrous peel from the lung surface"], ["Time", "Drainage 20–40 min; decortication 2–3 h"], ["Pain", "+++ to +++++"], ["Position", "Lateral decubitus"], ["Blood loss", "Drainage minimal; decortication 500–2000 mL; cross-match 2 units"], ["Practical techniques", "GA, DLT for decortication (air leak), arterial line, CVC if septic and needing vasopressors"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Often septic with limited respiratory reserve.", "Look for a bronchopleural fistula before induction."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Expect major bleeding from the decorticated surface and conversion to thoracotomy.", "Reinflate the lung with room air rather than oxygen near diathermy (fire risk)."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Serratus anterior or erector spinae catheter; paravertebral catheters are unsuitable once the pleura is stripped.", "HDU for frail or septic patients."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Air leak after visceral decortication is common and sometimes needs lobectomy."]}, {"t": "rel", "x": "Related: Crisis B11, B15"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 p. 546; Cohen 2021 (fire)"}]}, {"id": "c9", "code": "C9", "title": "Repair of bronchopleural fistula", "sub": "2–3 h · Pain ++++ to +++++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Surgical closure of a communication between bronchus and pleural space"], ["Time", "2–3 h"], ["Pain", "++++ to +++++"], ["Position", "Sitting up, tilted towards the affected side until the good lung is isolated; then lateral"], ["Blood loss", "300–800 mL; group and save, cross-match if anaemic"], ["Practical techniques", "Modified RSI; DLT placed under fibreoptic guidance into the healthy side; arterial line before induction"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Resuscitate, and ensure a working unclamped chest drain before induction.", "Check previous anaesthetic charts and CT for distorted anatomy."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Isolate the healthy lung before positive-pressure ventilation or turning.", "Positive pressure escapes through the fistula and can spill infected fluid into the healthy lung.", "Confirm isolation bronchoscopically before repositioning."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Extubate early if possible; if ventilation is needed, keep airway pressure low to protect the stump."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Most fistulae follow pneumonectomy or lobectomy; some follow pneumonia, abscess or empyema.", "Should be managed by an experienced thoracic anaesthetist."]}, {"t": "rel", "x": "Related: Crisis B15 · Core skills A2"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 pp. 547–8; Kaye & Urman ch 15"}]}, {"id": "c10", "code": "C10", "title": "Pleurectomy and pleurodesis", "sub": "Pleurectomy 1–2 h; pleurodesis 20–40 min · Pain +++ to ++++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Stripping of parietal pleura, or chemical or mechanical creation of pleural adhesions"], ["Time", "Pleurectomy 1–2 h; pleurodesis 20–40 min"], ["Pain", "+++ to ++++"], ["Position", "Lateral decubitus (VATS or open)"], ["Blood loss", "Oozing from stripped pleura; group and save"], ["Practical techniques", "GA, OLV, intercostal blocks at the start, multimodal analgesia"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Two groups: young patients with recurrent pneumothorax (ask about asthma), and older patients with COPD or malignant effusion.", "Insert a chest drain before induction if a pneumothorax is present.", "Drain a massive effusion partly at least 12 h before surgery to reduce re-expansion oedema."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Use the lowest airway pressure that ventilates adequately: under IPPV a pneumothorax on either side, including the non-operative side, can tension rapidly despite a drain.", "Avoid N₂O.", "A large effusion turned side-up can cause circulatory collapse: return supine and drain.", "Aim for full lung expansion at the end."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Chest X-ray for expansion; pleural abrasion is very painful.", "Avoid NSAIDs if pleurodesis is the goal (anti-inflammatory effect)."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Paravertebral catheters are usually unsuitable after pleurectomy."]}, {"t": "rel", "x": "Related: Crisis B2, B19"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 pp. 549–50"}]}, {"id": "c11", "code": "C11", "title": "Anterior mediastinal mass: biopsy and thymectomy", "sub": "Thymectomy 2–3 h; biopsy shorter · Pain ++ to +++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Biopsy or resection of anterior mediastinal tumour; thymectomy for thymoma or myasthenia gravis"], ["Time", "Thymectomy 2–3 h; biopsy shorter"], ["Pain", "++ to +++"], ["Position", "Supine (sternotomy) or semi-lateral (VATS)"], ["Blood loss", "Biopsy minimal; thymectomy moderate, cross-match 2 units"], ["Practical techniques", "Risk-stratified plan: awake fibreoptic intubation with a reinforced tube beyond the obstruction where possible, sedation preserving spontaneous ventilation, rigid bronchoscope and ECMO standby for high risk; DLT for VATS thymectomy"]]}, {"t": "h", "x": "Preoperative", "dont": false}, {"t": "ul", "items": ["Stratify risk: postural symptoms, stridor, tracheal compression >50%, bronchial compression, pericardial effusion, SVC syndrome.", "CT, flow–volume loops, echocardiography.", "Agree a rescue position, and consider local-anaesthetic biopsy as an alternative.", "Myasthenia: continue pyridostigmine and immunosuppression; check thyroid and other autoimmune disease."]}, {"t": "h", "x": "Perioperative", "dont": false}, {"t": "ul", "items": ["Lower-limb venous access if the SVC is compressed.", "If ventilating with positive pressure: long expiratory time, low rate, tidal volume and I:E matched to spontaneous breathing; avoid hyperventilation if chronically hypercapnic (narrative review opinion). {o}", "If ventilation becomes difficult: wake the patient if possible, move to the rescue position, rigid bronchoscopy.", "Myasthenia: quantitative neuromuscular monitoring; small doses of rocuronium with sugammadex, or no relaxant."]}, {"t": "h", "x": "Postoperative", "dont": false}, {"t": "ul", "items": ["Myasthenia: HDU; watch for respiratory weakness and cholinergic or myasthenic crisis."]}, {"t": "h", "x": "Special considerations", "dont": false}, {"t": "ul", "items": ["Direct evidence on the mechanism of airway collapse is limited. Hartigan 2022, a single-centre, non-randomised, prospective observational study of 17 adults intubated awake with a staged induction in a semi-sitting position, found no change in blinded bronchoscopic patency scores after induction (P = 0.953), higher scores with positive pressure (P = 0.024) and neuromuscular block (P < 0.001), and no airway collapse. It challenges the practice of maintaining spontaneous breathing, but does not provide conclusive evidence that general anaesthesia with neuromuscular block and positive-pressure ventilation is safe before the airway is secured in patients with central airway compression. {o}"]}, {"t": "rel", "x": "Related: Crisis B5 · Preop R4 · Lesson 5"}, {"t": "src", "x": "Sources: Oxford Handbook of Anaesthesia 5th edn, ch 20 pp. 533–4 (thymectomy); Kaye & Urman ch 11; Hartigan 2022; Sarkiss & Jimenez 2023"}]}, {"id": "c12", "code": "C12", "title": "Oesophagectomy", "sub": "3–6 h · Pain +++++", "blocks": [{"t": "casehdr", "rows": [["Procedure", "Total or partial oesophageal resection with gastric pull-up (Ivor Lewis, McKeown three-stage, transhiatal, thoracoabdominal, minimally invasive)"], ["Time", "3–6 h"], ["Pain", "+++++"], ["Position", "Supine and lateral, sometimes prone; repositioning during surgery"], [ , "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Size from sex and height, then check against CT or ultrasound tracheal width.", "Withdraw the stylet once the bronchial cuff is past the cords; rotate 90° left and advance.", "Confirm with the bronchoscope supine, after turning, and whenever pressures or saturation change."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["Large, long and stiff: more airway injury than blockers (bronchus or carina injury 23.2% vs 8.4%) and more sore throat (40.3% vs 23.3%). {g}", "Moves with positioning and surgical traction; malposition is common, although less frequent than with blockers (25.3% vs 31.9%). {g}", "Must usually be exchanged for a single-lumen tube if postoperative ventilation is needed.", "Not available for small children."]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 6 and ch 7.", "Cohen E. Anesth Analg 2021;133:1520–31.", "Palaczynski P, et al. J Clin Med 2023;12:1877.", "Granell Gil M, Martínez Plumed R. Curr Opin Anesthesiol 2026;39:66–70."]}]}, {"id": "d2", "code": "D2", "title": "Right double-lumen tube", "sub": "Lung isolation", "blocks": [{"t": "meta", "x": "Lung isolation"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Isolation when the left main bronchus cannot take a tube: left pneumonectomy, left sleeve resection, surgery on or distortion of the left main bronchus."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Place under bronchoscopic guidance; confirm the slot faces the right upper lobe orifice.", "Re-check after every position change."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["The right upper lobe bronchus arises about 19 ± 6 mm (men) from the carina, leaving a 4–8 mm margin for alignment; some patients have a carinal take-off. {g}", "Small movements occlude the upper lobe and cause hypoxaemia."]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Cohen E. Anesth Analg 2021;133:1520–31.", "Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 7."]}]}, {"id": "d3", "code": "D3", "title": "Video double-lumen tube", "sub": "Lung isolation", "blocks": [{"t": "meta", "x": "Lung isolation"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Placement and position monitoring without a separate bronchoscope; early warning of displacement during surgery."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Connect the monitor before intubation; advance under live view into the left main bronchus.", "Use the flush channel when secretions obscure the lens."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["Same size, stiffness and trauma profile as a standard DLT. {e}", "Secretions or blood can obscure the camera.", "Higher cost than a standard DLT. {d}"]}, {"t": "h", "x": "Evidence", "dont": false}, {"t": "ul", "items": ["A bronchoscope was not needed in about 95% of placements in the studies summarised by the 2026 EACTAIC review. {g}"]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 7.", "Granell Gil M, Martínez Plumed R. Curr Opin Anesthesiol 2026;39:66–70."]}]}, {"id": "d4", "code": "D4", "title": "Single-balloon bronchial blockers", "sub": "Lung isolation", "blocks": [{"t": "meta", "x": "Lung isolation"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Isolation through an ordinary single-lumen tube: difficult airway, tracheostomy, nasal intubation, a tube already in place, planned postoperative ventilation, small patients, previous contralateral pneumonectomy, selective lobar blockade."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Wire-guided type (Arndt): the guide loop couples the blocker to the bronchoscope, which carries it into the bronchus.", "Rotating-tip types (for example Uniblocker): steered by twisting under bronchoscopic view.", "Lock the blocker in the multiport adaptor; use apnoea-disconnection before inflation.", "Deflecting-tip type (Cohen blocker): a proximal wheel angles the soft tip into the chosen bronchus under bronchoscopic view."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["Displaces more often than a DLT (malposition 31.9% vs 25.3%); a proximal slip into the trachea obstructs both lungs. {g}", "Slow collapse of the right upper lobe; narrow channel limits suction and CPAP.", "Seals less reliably against blood or pus.", "Can be stapled into the bronchus intermedius during right middle and lower resection."]}, {"t": "h", "x": "Evidence", "dont": false}, {"t": "ul", "items": ["Lung collapse was equivalent to a DLT (excellent collapse 73.4% vs 72.4%); hypoxaemia and airway injury were less frequent. {g}"]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 6 and ch 7.", "Palaczynski P, et al. J Clin Med 2023;12:1877.", "Cohen E. Anesth Analg 2021;133:1520–31.", "Sahai C. History of thoracic surgery and anesthesia. In: Sood J, Sharma S (eds). Clinical Thoracic Anesthesia. Springer 2020, ch 1."]}]}, {"id": "d5", "code": "D5", "title": "Bifurcated (Y-shaped) bronchial blocker", "sub": "Lung isolation", "blocks": [{"t": "meta", "x": "Lung isolation"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Isolation of either lung through a single-lumen tube without steering into a chosen bronchus; switching sides without repositioning."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["One size fits most adults, which avoids DLT size selection. {g}", "Single-lumen tube of at least 7.0 mm; tube tip at least 4 cm above the carina so both limbs can open.", "Inflate only the required cuff, with no more than the manufacturer maximum (15 mL per the textbook).", "Confirm with the bronchoscope; re-check after positioning.", "Through a smaller tube in tracheal stenosis, the 7 Fr device can be inserted blindly and positioned by auscultation, then confirmed as soon as possible. {g}"]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["Only one adult size; not for children. {e}", "If the tube tip is too close to the carina, both limbs enter one bronchus.", "Same dislodgement and stapling risks as other blockers."]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 6 and ch 7.", "Cohen E. Anesth Analg 2021;133:1520–31.", "Sahai C. History of thoracic surgery and anesthesia. In: Sood J, Sharma S (eds). Clinical Thoracic Anesthesia. Springer 2020, ch 1."]}]}, {"id": "d6", "code": "D6", "title": "Flexible bronchoscope", "sub": "Airway visualisation", "blocks": [{"t": "meta", "x": "Airway visualisation"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Confirms DLT and blocker position, guides blockers and intentional mainstem intubation, clears secretions and blood, and allows awake intubation."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Orientate on the anterior cartilage rings and posterior longitudinal muscle before judging left and right.", "Identify the right upper lobe by its three segmental openings.", "Choose a scope that fits the lumen: a 2.2 mm scope is needed for a 32 Fr DLT."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["The scope occupies much of the tube lumen: resistance rises and tidal volume falls during inspection.", "Blood obscures the view; losing orientation after rotation causes misidentification of the carina."]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 6 and ch 10.", "Granell Gil M, Martínez Plumed R. Curr Opin Anesthesiol 2026;39:66–70."]}]}, {"id": "d7", "code": "D7", "title": "Rigid bronchoscope with jet ventilation", "sub": "Airway visualisation", "blocks": [{"t": "meta", "x": "Airway visualisation"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Therapeutic airway work: stent insertion, tumour debulking, foreign-body removal, massive bleeding control; rescue of central airway obstruction, including mediastinal mass collapse."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["TIVA with neuromuscular block.", "With the lens attached, ventilate through the side arm with high fresh-gas flow; with the lens removed, use low-frequency jet (Sanders injector) starting at about 30 psi, up to 50 psi.", "Watch chest rise and fall with every breath."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["No cuff: large leak and an unprotected airway (aspiration risk). {e}", "Venturi entrainment lowers tracheal FiO₂ to about 0.8. {e}", "Barotrauma and pneumothorax if exhalation is obstructed. {e}", "Intensely stimulating, with rapid offset at the end."]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 10.", "Oxford Handbook of Anaesthesia 5th edn, ch 20, p. 540."]}]}, {"id": "d8", "code": "D8", "title": "Videolaryngoscope for DLT insertion", "sub": "Laryngoscopy", "blocks": [{"t": "meta", "x": "Laryngoscopy"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Improves the glottic view for DLT insertion and reduces laryngeal trauma."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Shape the DLT stylet to the blade curve, or use a dedicated DLT stylet.", "Expect a longer intubation time and the need for external laryngeal manipulation."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["The DLT curve does not match angulated blades; the tip strikes the anterior tracheal wall. {g}", "Effect on malposition is contested: Cohen (2021) reports more malposition; the 2026 EACTAIC review reports fewer. {o}"]}, {"t": "h", "x": "Evidence", "dont": false}, {"t": "ul", "items": ["Sore throat and vocal cord injury are consistently lower with videolaryngoscopy. {g}"]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Cohen E. Anesth Analg 2021;133:1520–31.", "Granell Gil M, Martínez Plumed R. Curr Opin Anesthesiol 2026;39:66–70."]}]}, {"id": "d9", "code": "D9", "title": "Single-lumen tube for intentional mainstem intubation", "sub": "Lung isolation (rescue)", "blocks": [{"t": "meta", "x": "Lung isolation (rescue)"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Fastest rescue isolation of a healthy lung with a tube already in place (for example, massive haemoptysis); preferred isolation method in infants."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Left-sided bleeding: advancing the tube may enter the right bronchus unaided.", "Right-sided bleeding: guide the tube into the left bronchus with a bronchoscope.", "Confirm position as soon as possible."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["A blindly advanced tube favours the right bronchus. {e}", "Right upper lobe occlusion. {e}", "No suction or CPAP to the isolated lung; considered an inferior method in adults. {e}"]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 6 and ch 7."]}]}, {"id": "d10", "code": "D10", "title": "Laryngeal mask with bronchial blocker", "sub": "Lung isolation (difficult airway)", "blocks": [{"t": "meta", "x": "Lung isolation (difficult airway)"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Isolation when intubation fails but a laryngeal mask ventilates, or when a supraglottic technique is chosen."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Pass the 9:66–70."]}]}, {"id": "d12", "code": "D12", "title": "CPAP or oxygen insufflation to the non-ventilated lung", "sub": "Oxygenation", "blocks": [{"t": "meta", "x": "Oxygenation"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Treatment of hypoxaemia during one-lung ventilation after the ventilated lung is optimised."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Oxygen insufflation 1–2 L/min first; then CPAP 2–5 cmH₂O (up to 10 in some protocols).", "Needs a DLT (or blocker with a usable channel)."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["Interferes with surgical exposure, especially in VATS. {e}", "Oxygen-enriched lung near diathermy is a fire hazard; use room air when reinflating near cautery. {g}"]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Kaye AD, Urman RD (eds). Thoracic Anesthesia Procedures. OUP 2021, ch 7.", "Anaesthesia for thoracic surgery. Anaesth Intensive Care Med 25(2) (2023).", "Cohen E. Anesth Analg 2021;133:1520–31.", "Bussières JS, Marques E. Curr Chall Thorac Surg 2023;5:38."]}]}, {"id": "d13", "code": "D13", "title": "Tubes with an integral or guided blocker: Univent and Papworth BiVent", "sub": "Lung isolation", "blocks": [{"t": "meta", "x": "Lung isolation"}, {"t": "h", "x": "Purpose", "dont": false}, {"t": "ul", "items": ["Univent: a single-lumen silicone tube with a channel in its anterior wall carrying a torque-controlled blocker, so the blocker cannot be lost from the tube.", "Papworth BiVent: a double-lumen tube whose flanges seat on the carina, designed to direct a standard blocker into either main bronchus without bronchoscopic steering."]}, {"t": "h", "x": "Practical use", "dont": false}, {"t": "ul", "items": ["Univent: after intubation, rotate the tube 90° towards the side to be blocked and advance the blocker about 8 cm beyond the tip; adjust under bronchoscopy.", "BiVent: seat the flanges on the carina, then pass the blocker through the lumen on the side to be isolated."]}, {"t": "h", "x": "Drawbacks", "dont": false}, {"t": "ul", "items": ["Both were designed to solve the difficulty of placing free blockers; neither removes the need to confirm position. {e}", "Fewer comparative data and more limited availability than DLTs and free blockers. {d}"]}, {"t": "h", "x": "Sources", "dont": false}, {"t": "ol", "items": ["Sahai C. History of thoracic surgery and anesthesia. In: Sood J, Sharma S (eds). Clinical Thoracic Anesthesia. Springer 2020, ch 1."]}]}], "devicesIntro": "Devices used for lung isolation, airway access and oxygenation during thoracic anaesthesia. Each card gives the purpose, practical use, drawbacks and sources."};

/* routing */
var MORE_TABS = ['cases','devices','lessons','drill','guide','search','more'];
function go(hash){ if (location.hash !== hash) location.hash = hash; else route(); }
window.addEventListener('hashchange', route);
function parse(){
  var h = location.hash.replace(/^#\/?/, '');
  var qi = h.indexOf('?'), query = {};
  if (qi > -1){ h.slice(qi+1).split('&').forEach(function(p){ var kv=p.split('='); query[kv[0]]=decodeURIComponent(kv[1]||''); }); h = h.slice(0, qi); }

}
function setTitle(t, back){

$('#backBtn').addEventListener('click', function(){

});
$('#searchBtn').addEventListener('click', function(){ go('#/search'); });
$$('.tab').forEach(function(t){ t.addEventListener('click', function(){ go('#/' + t.dataset.tab); }); });

var cleanup = null;
function route(){
  if (cleanup) { cleanup(); cleanup = null; }
  var r = parse();
  var wide = matchMedia('(min-width:900px)').matches;
  $$('.tab').forEach(function(t){
    var on = t.dataset.tab === r.tab || (t.dataset.tab === 'more' && MORE_TABS.indexOf(r.tab) > -1);
    t.setAttribute('aria-current', on ? 'page' : 'false');
