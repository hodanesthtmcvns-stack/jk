  var fn = { crisis: vCrisis, skills: vSection, physiology: vSection, preop: vSection, cases: vSection, devices: vSection, lessons: vLessons, drill: vDrill, guide: vGuide, search: vSearch, more: vMore }[r.tab] || vCrisis;

function fmt(ms){ var s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function wireClock(id){
  var key='clock:'+id, st = store.get(key, null), el=$('#clk'), btn=$('#clkBtn'), lbl=$('#clkl');

  }
  function parseField(v, lo, hi, integer){

    if (CU.bad) errs.push('Subsegments removed must be a whole number from 1 to 42.');

      var high = (!V.empty && V.val<10) || (!VP.empty && VP.val<35);
      var low  = !high && ((V.empty || V.val>20) && (VP.empty || VP.val>75));
      if (high){ cls='result high'; lvl='High risk (CPET)'; step='VO₂max <10 mL/kg/min or <35% predicted. Perioperative mortality may exceed 10%. ACCP: counsel on sublobar resection, minimally invasive surgery or non-operative treatment; offer rehabilitation.'; }
      else if (low){ cls='result low'; lvl='Low risk (CPET)'; step='VO₂max >20 mL/kg/min or >75% predicted. Mortality expected below 1%.'; }
      else { cls='result mod'; lvl='Moderate risk (CPET)'; step='VO₂max 10–20 mL/kg/min or 35–75% predicted. Risk depends on lung function, exercise tolerance and extent of resection. Consider prehabilitation.'; }
      if (screen==='low' && !low) note='Screening values alone would have suggested low risk, but the CPET result is abnormal and takes precedence. Review with the thoracic team.';
    } else if (screen==='low'){
      cls='result low'; lvl='Low risk';
      step = (pf>60 && pd>60 && !s.card) ? 'Both ppo values >60%. No further exercise testing needed. Mortality expected below 1%.' : 'ppo 30–60% with stair climb >22 m or shuttle walk >400 m.';
    } else if (screen==='cpet'){
      cls='result mod'; lvl='Next: CPET';
      step = s.card ? 'High-risk cardiac evaluation: proceed to CPET.' : (lo<30 ? 'ppoFEV₁ or ppoDLCO <30%: proceed directly to CPET.' : 'Low-technology test below threshold (stair climb ≤22 m or shuttle walk ≤400 m): proceed to CPET.');
      step += ' Enter VO₂max to classify.';
    } else {
      cls='result mod'; lvl='Next: stair climb or shuttle walk'; step='ppoFEV₁ or ppoDLCO between 30% and 60%. Perform a stair-climb or shuttle-walk test.';
    }
    r.className = cls; r.innerHTML = h + '<div class="lvl" style="margin-top:8px">'+lvl+'</div><div>'+step+'</div>'+(note?'<div class="lvl" style="margin-top:6px;color:var(--warn)">'+note+'</div>':'')+'<div class="muted" style="font-size:.82rem;margin-top:6px">ACCP 2013 thresholds. Older rules use 40% as the high-risk cut-off.</div>';
  }
  $$('[data-lobe]',el).forEach(function(b){ b.onclick=function(){ var k=b.dataset.lobe, i=s.lobes.indexOf(k); if(i>-1) s.lobes.splice(i,1); else s.lobes.push(k); $('#p-custom',el).value=''; paintLobes(); upd(); }; });
  $$('input',el).forEach(function(i){ i.oninput=function(){ if(i.id==='p-custom' && i.value!==''){ s.lobes=[]; paintLobes(); } upd(); }; });
  $('[data-sw="card"]',el).onclick=function(){ s.card=!s.card; this.setAttribute('aria-checked',s.card); upd(); };
  $('#p-reset',el).onclick=function(){ s={fev:'',dlco:'',lobes:[],custom:'',card:false,sct:'',swt:'',vo2:'',vo2p:''}; store.set('c:ppo',s); CALCS.ppo(el); };
  paintLobes(); upd();
};

CALCS.prehab = function(el){
  var F=[['walk','6-minute walk distance <400 m'],['dasi','Duke Activity Status Index <34'],['accp','Reduced ppoFEV₁/ppoDLCO or VO₂max <10 mL/kg/min (<35%)'],['smoke','Current smoker'],['anaemia','Anaemia'],['nutr','At nutritional risk (BMI ≤18.5, weight loss >10% or >5% in 3 months)'],['oeso','Planned oesophagectomy']];
  var s = store.get('c:prehab', {});
  el.innerHTML='<h4>Prehabilitation triage</h4><p class="muted" style="margin-top:0">Screening cut-offs (6MWT 400 m, DASI 34) are those used by one published programme; the ACCP criterion is from the 2013 guideline.</p>'+F.map(function(f){return sw(f[0],f[1],s[f[0]]);}).join('')+'<div class="result" id="ph-r"></div>';
  function upd(){
    store.set('c:prehab', s);
    var refer = s.walk||s.dasi||s.accp, comp=[];
    if (refer) comp.push('Refer to a multimodal prehabilitation programme now: aerobic and resistance training for about 4–6 weeks.');
    if (s.accp) comp.push('ACCP: offer pre- or postoperative rehabilitation (grade 1C).');
    if (s.smoke) comp.push('Smoking cessation support at this visit: counselling plus nicotine replacement, varenicline or bupropion.');
    if (s.anaemia) comp.push('Iron studies; IV iron if surgery is within 6 weeks.');
    if (s.nutr) comp.push('Dietitian review; supplementation for 7–10 days if severely malnourished.');
    if (s.oeso) comp.push('Include inspiratory muscle training.');
    var r=$('#ph-r',el);
    if (!comp.length){ r.className='result low'; r.innerHTML='No triage flags selected. Standard advice: stay active, stop smoking, eat well, and keep the fasting period short.'; return; }
    r.className='result '+(refer?'high':'mod');
    r.innerHTML='<div class="lvl">'+(refer?'Prehabilitation recommended':'Targeted optimisation')+'</div><ul style="margin:6px 0 0;padding-left:20px">'+comp.map(function(c){return '<li>'+c+'</li>';}).join('')+'</ul>';
  }
  $$('[data-sw]',el).forEach(function(b){ b.onclick=function(){ var k=b.dataset.sw; s[k]=!s[k]; b.setAttribute('aria-checked',s[k]); upd(); }; });
  upd();
};

CALCS.checklist = function(el){
  var G = [
    ['Risk', [['History and examination, including the four Ms','R1'],['ThRCRI calculated; cardiology if indicated','R2'],['PFTs with ppoFEV₁ and ppoDLCO','R3'],['Exercise testing if the pathway requires it','R3']]],
    ['Airway and isolation', [['CT read at carina and main bronchi','R4'],['Isolation device chosen and plan B stated','A2'],['Mediastinal mass risk assessed; rescue plan agreed','R4']]],
    ['Optimisation', [['Smoking cessation addressed','R6'],['Anaemia investigated and treated','R6'],['Nutritional risk screened','R6'],['COPD optimised; no active exacerbation or infection','R5'],['Prehabilitation considered','R7']]],
    ['Plan', [['Monitoring and lines planned (arterial line contralateral, CVC ipsilateral if needed)','A7'],['Analgesia plan matched to incision; anticoagulant timing checked','A8'],['Fluid strategy and ceiling stated for major resection','A9'],['Clear fluids to 2 h; no benzodiazepine premedication','R6'],['Postoperative care level agreed (ward, HDU or ICU)','R5']]]
  ];
  var s = store.get('c:chk', {}), total = G.reduce(function(a,g){return a+g[1].length;},0);
  function codeA(c){ return '<a href="'+codeLink(c)+'" class="chip g" style="text-decoration:none">'+c+'</a>'; }
  el.innerHTML = '<h4>Pre-anaesthetic checklist</h4><div class="progress"><span id="ck-p"></span></div><p class="muted" id="ck-t" style="margin:2px 0 8px;font-size:.85rem"></p>'+
    G.map(function(g,gi){ return '<h4 style="margin:14px 0 2px">'+g[0]+'</h4>'+g[1].map(function(it,ii){ var k=gi+'-'+ii; return '<div style="display:flex;align-items:center;gap:6px"><button class="chk" role="checkbox" aria-checked="'+(!!s[k])+'" data-ck="'+k+'"><span class="box">'+(s[k]?'✓':'')+'</span><span class="ct">'+esc(it[0])+'</span></button>'+codeA(it[1])+'</div>'; }).join(''); }).join('')+
    '<button class="btn" style="width:100%;margin-top:14px" id="ck-reset">Reset for next patient</button>';
  function prog(){ var d=Object.keys(s).filter(function(k){return s[k];}).length; $('#ck-p',el).style.width=(d/total*100)+'%'; $('#ck-t',el).textContent=d+' of '+total+' complete'; }
  $$('[data-ck]',el).forEach(function(b){ b.onclick=function(){ var k=b.dataset.ck; s[k]=!s[k]; b.setAttribute('aria-checked',s[k]); b.querySelector('.box').textContent=s[k]?'✓':''; store.set('c:chk',s); prog(); }; });
  $('#ck-reset',el).onclick=function(){ s={}; store.set('c:chk',s); CALCS.checklist(el); toast('Checklist reset'); };
  prog();
};

function wireCalcs(root){ $$('[data-calc]', root).forEach(function(el){ var f = CALCS[el.dataset.calc]; if (f) f(el); }); }

/* delegated events */
document.addEventListener('click', function(e){
  var t;
  if ((t = e.target.closest('[data-ev]'))) { e.preventDefault(); e.stopPropagation(); evSheet(t.dataset.ev); return; }
  if ((t = e.target.closest('[data-go]'))) { go(t.dataset.go); return; }
  if ((t = e.target.closest('[data-cf]'))) { cfilter=t.dataset.cf; store.set('cfilter',cfilter); route(); return; }
  if ((t = e.target.closest('[data-mem]'))) {
    var cid=t.dataset.mem, i=+t.dataset.i, done=store.get('mem:'+cid,[]), k=done.indexOf(i);
    if(k>-1) done.splice(k,1); else done.push(i); store.set('mem:'+cid,done);
    var on=k<0; t.classList.toggle('done',on); t.setAttribute('aria-pressed',on); t.querySelector('.n').textContent=on?'✓':(i+1);
    if (on && navigator.vibrate) try{navigator.vibrate(15);}catch(_){}
    return;
  }
  if ((t = e.target.closest('[data-memreset]'))) { var id=t.dataset.memreset; store.set('mem:'+id,[]); $$('[data-mem="'+id+'"]').forEach(function(s){ s.classList.remove('done'); s.setAttribute('aria-pressed','false'); s.querySelector('.n').textContent=(+s.dataset.i+1); }); return; }
  if ((t = e.target.closest('[data-tf]'))) {
    var tb=document.getElementById(t.dataset.t), f=t.dataset.tf;
    t.parentNode.querySelectorAll('.seg').forEach(function(s){ s.setAttribute('aria-pressed', s===t); });
    tb.querySelectorAll('tbody tr').forEach(function(tr){ tr.hidden = f!=='all' && tr.dataset.tags.indexOf('{'+f+'}')<0; });
    return;
  }
});
var saveT=null;
document.addEventListener('input', function(e){
  var ta=e.target.closest('[data-note]'); if(!ta) return;
  clearTimeout(saveT); saveT=setTimeout(function(){ store.set('note:'+ta.dataset.note, ta.value); var s=ta.parentNode.querySelector('.saved'); if(s){ s.textContent='Saved on this device'; setTimeout(function(){s.textContent='';},1500);} }, 400);
});
matchMedia('(min-width:900px)').addEventListener && matchMedia('(min-width:900px)').addEventListener('change', function(){ if (parse().tab==='more') route(); });

/* sheet & toast */
var EVTXT = {
  e:['Established','Verifiable anatomy, physiology or settled practice. Stated plainly.'],
  g:['Graded','Rests on trials, meta-analyses or formal consensus. The magnitude or consensus score is given in the text.'],
  o:['Open','The evidence is conflicting or inconclusive.'],
  d:['† Outside the sources','Drawn from general anaesthetic practice, not from the source literature listed in the Guide. Verify against local protocol before relying on it.']
};
var lastFocus=null;
function evSheet(k){
  lastFocus=document.activeElement;
  $('#sheetBody').innerHTML='<h2 id="sheetTitle" class="v" style="font-size:1.2rem"><span class="chip '+k+'" style="font-size:.9rem">'+(k==='d'?'†':TAGS[k])+'</span> '+EVTXT[k][0]+'</h2><p>'+EVTXT[k][1]+'</p><button class="btn" style="width:100%" id="sheetClose">Close</button>';
  $('#scrim').classList.add('open'); $('#sheet').classList.add('open'); $('#sheetClose').focus();
  $('#sheetClose').onclick=closeSheet;
}
function closeSheet(){ $('#scrim').classList.remove('open'); $('#sheet').classList.remove('open'); if(lastFocus) try{lastFocus.focus();}catch(e){} }
$('#scrim').onclick=closeSheet;
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });
var toastT=null;
function toast(m){ var t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(function(){t.style.display='none';},1600); }

route();
})();


</script>
