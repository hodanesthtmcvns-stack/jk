<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2833">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="A resident's companion for thoracic anaesthesia: preop risk, physiology, core skills, crisis actions.">
<title>Practical Thoracic Anesthesia: Core Skills to Crisis Survival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F5; --panel:#FFFFFF; --ink:#1E2833; --muted:#57636E; --rule:#D3D9D8; --bar:#1E2833; --bar-ink:#F4F6F5;
  --warn:#A8261E; --warn-bg:#FBECEA; --caution:#98620F; --caution-bg:#FBF3E3;
  --o2:#2C6A4D; --o2-bg:#E6F1EA; --scope:#27587F; --scope-bg:#E6EEF6; --open:#6A4C93; --open-bg:#F0EBF7;
  --sans:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --script-size:19px;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12171B; --panel:#1B2227; --ink:#E5E9EB; --muted:#A1ADB6; --rule:#303B44; --bar:#0C1013; --bar-ink:#E5E9EB;
    --warn:#F2877D; --warn-bg:#3A2321; --caution:#E5B45F; --caution-bg:#342A19;
    --o2:#7FC8A2; --o2-bg:#1B3027; --scope:#8FBAE1; --scope-bg:#1B2936; --open:#C3A8E8; --open-bg:#292236;
  }
}
:root[data-theme="dark"]{
  --paper:#12171B; --panel:#1B2227; --ink:#E5E9EB; --muted:#A1ADB6; --rule:#303B44; --bar:#0C1013; --bar-ink:#E5E9EB;
  --warn:#F2877D; --warn-bg:#3A2321; --caution:#E5B45F; --caution-bg:#342A19;
  --o2:#7FC8A2; --o2-bg:#1B3027; --scope:#8FBAE1; --scope-bg:#1B2936; --open:#C3A8E8; --open-bg:#292236;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.5;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--scope);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* App shell */
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}
.appbar{grid-row:1}#scroller{grid-row:2}.tabbar{grid-row:3}
.appbar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;min-height:56px;position:relative;z-index:5}
.appbar h1{font-size:1.05rem;margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;min-width:44px;height:44px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:inherit}
.iconbtn:active{background:rgba(255,255,255,.12)}
.iconbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[hidden]{display:none}
#scroller{overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-flow:column;background:var(--panel);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tab{background:transparent;border:0;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.74rem;color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke:var(--warn)}

/* Two-pane on tablets */
.panes{display:block}
.pane-list,.pane-detail{min-width:0}
@media (min-width:900px){
  .app{grid-template-columns:88px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .appbar{grid-column:1 / 3}
  .tabbar{grid-row:2;grid-column:1;grid-template-columns:1fr;grid-auto-rows:76px;align-content:start;border-top:0;border-right:1px solid var(--rule);padding:8px 0}
  .tab{height:76px}
  #scroller{grid-row:2;grid-column:2;overflow:hidden}
  #view{height:100%}
  .panes.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;height:100%}
  .panes.split .pane-list{overflow:auto;border-right:1px solid var(--rule);height:100%}
  .panes.split .pane-detail{overflow:auto;height:100%}
  .panes.single{height:100%;overflow:auto}
  .back-only-mobile{display:none !important}
}
@media (max-width:899px){
  .panes.split.has-detail .pane-list{display:none}
  .panes.split:not(.has-detail) .pane-detail{display:none}
}
.wrap{padding:16px 16px 28px;max-width:860px;margin:0 auto}

/* Typography */
h2.v{font-size:1.45rem;line-height:1.2;margin:4px 0 10px}
h3.v{font-size:1.1rem;margin:22px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted)}
.lede{font-size:1.02rem}
.chip{display:inline-flex;align-items:center;min-height:24px;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:12px;border:0;margin:0 2px;vertical-align:1px;cursor:pointer}
.chip.e{background:var(--o2-bg);color:var(--o2)}
.chip.g{background:var(--scope-bg);color:var(--scope)}
.chip.o{background:var(--open-bg);color:var(--open)}
.chip.d{background:var(--caution-bg);color:var(--caution)}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:0;border-bottom:1px solid var(--rule);padding:12px 14px;min-height:64px;cursor:pointer}
.row:active{background:var(--paper)}
.row[aria-current="true"]{background:var(--scope-bg)}
.row .code{flex:none;width:46px;height:46px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--warn)}
.row .code.amber{background:var(--caution)}
.row .code.neutral{background:var(--scope)}
:root[data-theme="dark"] .row .code,.row .code{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row .code{color:#12171B}}
:root[data-theme="dark"] .row .code{color:#12171B}
.row .txt{flex:1;min-width:0}
.row .t1{font-weight:700;line-height:1.25}
.row .t2{font-size:.84rem;color:var(--muted)}
.row .chev{color:var(--muted);flex:none}
.segment{display:flex;gap:6px;padding:10px 14px;background:var(--paper);position:sticky;top:0;z-index:2;overflow-x:auto}
.seg{border:1px solid var(--rule);background:var(--panel);border-radius:20px;padding:0 14px;min-height:38px;white-space:nowrap;cursor:pointer;font-size:.9rem}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.listhead{padding:14px 14px 6px;font-size:.86rem;color:var(--muted);font-weight:700}

/* Crisis detail */
.chead{padding:16px;border-left:10px solid var(--warn);background:var(--panel);border-bottom:1px solid var(--rule)}
.chead.amber{border-left-color:var(--caution)}
.chead .sev{font-size:.82rem;font-weight:700;color:var(--warn)}
.chead.amber .sev{color:var(--caution)}
.chead h2{margin:2px 0 0;font-size:1.35rem;line-height:1.2}
.clock{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bar);color:var(--bar-ink)}
.clock .time{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700;min-width:84px}
.clock .lbl{flex:1;font-size:.82rem;opacity:.8}
.btn{border:0;border-radius:8px;min-height:44px;padding:0 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.warn{background:var(--warn);color:#fff}
.btn.o2{background:var(--o2);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.warn,:root:not([data-theme="light"]) .btn.o2{color:#12171B}}
:root[data-theme="dark"] .btn.warn,:root[data-theme="dark"] .btn.o2{color:#12171B}
.clock .btn{background:var(--bar-ink);color:var(--bar);min-height:40px}
.clock .btn.ghost{background:transparent;color:var(--bar-ink)}
.memory{margin:14px 0;border:2px solid var(--warn);border-radius:10px;background:var(--warn-bg);overflow:hidden}
.amberc .memory{border-color:var(--caution);background:var(--caution-bg)}
.memory .mh{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;font-weight:700}
.memory .mh button{background:transparent;border:0;color:var(--muted);min-height:36px;cursor:pointer;font-size:.85rem;text-decoration:underline}
.step{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:12px;min-height:56px;cursor:pointer;border-top:1px solid color-mix(in srgb,var(--warn) 25%,transparent);font-weight:700;font-size:1.05rem;line-height:1.35}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--warn);display:grid;place-items:center;font-size:.95rem;color:var(--warn)}
.amberc .step .n{border-color:var(--caution);color:var(--caution)}
.step.done{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.step.done .n{background:var(--o2);border-color:var(--o2);color:var(--panel)}
.dontbox{border-left:5px solid var(--warn);background:var(--panel);padding:8px 12px;margin:14px 0;border-radius:0 6px 6px 0}
.dontbox h4{color:var(--warn)}
.cbody h4{margin:16px 0 4px;font-size:.98rem}
.cbody ol,.cbody ul,.wrap ol,.wrap ul{padding-left:22px;margin:6px 0}
.cbody li,.wrap li{margin:5px 0}
.pager{display:flex;gap:10px;margin:22px 0 8px}
.pager .btn{flex:1}

/* Tables -> cards on narrow */
.tfilter{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
table.rt{border-collapse:collapse;width:100%;background:var(--panel);font-size:.93rem;margin:10px 0 18px}
table.rt th,table.rt td{border-bottom:1px solid var(--rule);padding:9px 10px;text-align:left;vertical-align:top}
table.rt th{background:var(--paper)}
table.rt td:first-child{font-weight:700}
@media (max-width:699px){
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt thead{display:none}
  table.rt{background:transparent}
  table.rt tr{background:var(--panel);border:1px solid var(--rule);border-radius:10px;margin:0 0 10px;padding:4px 0}
  table.rt td{border:0;padding:6px 12px}
  table.rt td:first-child{font-size:1.02rem;border-bottom:1px solid var(--rule);padding-bottom:8px}
  table.rt td:not(:first-child)::before{content:attr(data-label);display:block;font-size:.76rem;font-weight:700;color:var(--muted)}
}

.box{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;margin:12px 0}
.box .cap{font-size:.88rem;color:var(--muted);font-style:italic}

/* Lesson reader */
.pres{display:flex;flex-direction:column;min-height:100%}
.pbar{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--rule);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pbar .ptime{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.15rem;min-width:98px}
.pbar .ptime.over{color:var(--caution)}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:36px;height:8px;border-radius:4px;background:var(--rule);border:0;cursor:pointer;padding:0}
.dot.on{background:var(--warn)}
.dot.seen{background:color-mix(in srgb,var(--warn) 45%,var(--rule))}
.sizebtn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;min-width:44px;min-height:40px;cursor:pointer;font-weight:700}
.stage{flex:1;padding:18px 18px 110px;max-width:760px;margin:0 auto;width:100%;touch-action:pan-y}
.beatlabel{font-size:.86rem;font-weight:700;color:var(--muted);margin:0 0 6px}
.beattitle{font-size:1.6rem;line-height:1.15;margin:0 0 12px}
.serif{font-family:var(--serif);font-size:var(--script-size);line-height:1.65}
.serif p{margin:10px 0}
.say{font-weight:600;border-left:4px solid var(--warn);padding-left:12px}
.story{background:var(--caution-bg);border:1.5px dashed var(--caution);border-radius:8px;padding:10px 12px;margin:14px 0;font-family:var(--sans);font-size:.95rem}
.story textarea{width:100%;min-height:96px;margin-top:8px;border:1px solid var(--rule);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;font-family:var(--serif);font-size:1rem;padding:8px;resize:vertical}
.story .saved{font-size:.78rem;color:var(--o2);min-height:1em}
.pnav{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));display:flex;gap:10px;padding:10px 14px;background:linear-gradient(to top,var(--paper) 70%,transparent);z-index:4}
.pnav .btn{flex:1;min-height:52px;font-size:1.02rem}
@media (min-width:900px){.pnav{position:sticky;bottom:0;left:auto;right:auto}.stage{padding-bottom:30px}}
.beatslide{animation:none}
@media (prefers-reduced-motion:no-preference){
  .beatslide.fwd{animation:inR .22s ease-out}.beatslide.back{animation:inL .22s ease-out}
  @keyframes inR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes inL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
}

/* Drill */
.drillcard{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px;margin:12px 0}
.drillcard .q{font-size:1.25rem;font-weight:700;line-height:1.25;margin:4px 0 10px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade .btn{min-height:52px}
.stat{display:flex;gap:10px;margin:10px 0}
.stat div{flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem}
.mast{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--rule);flex:none}
.mast.g{background:var(--o2)}.mast.p{background:var(--caution)}.mast.m{background:var(--warn)}

/* Search */
.searchbox{position:sticky;top:0;z-index:3;background:var(--paper);padding:10px 14px;border-bottom:1px solid var(--rule)}
.searchbox input{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font:inherit;padding:0 14px}
mark{background:var(--caution-bg);color:inherit;padding:0 2px;border-radius:3px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));z-index:21;transform:translateY(110%);transition:transform .2s ease-out;max-width:640px;margin:0 auto;box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.sheet.open{transform:none}
.scrim.open{display:block}
.grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 10px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:20px;z-index:30;font-size:.9rem;display:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* nav visibility: phone shows 4 + More; tablet shows all but More */
.tab.wide{display:none}
@media (min-width:900px){ .tab.wide{display:flex} .tab.more{display:none} .tabbar{grid-auto-flow:row;grid-auto-rows:70px} .tab{height:70px;font-size:.7rem;text-align:center} }
.keypt{border-left:4px solid var(--o2);background:var(--o2-bg);padding:8px 12px;border-radius:0 8px 8px 0;margin:14px 0;font-weight:600}
.keypt::before{content:"Key point";display:block;font-size:.74rem;font-weight:700;color:var(--o2);margin-bottom:2px}
.related{font-size:.88rem;color:var(--muted);margin:4px 0 0}
.related a{font-weight:700;color:var(--scope);text-decoration:none;padding:4px 2px;display:inline-block}
.calc{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px;margin:16px 0}
.calc h4{margin:0 0 8px;font-size:1rem}
.calc .fld{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin:10px 0}
.calc label{font-size:.92rem}
.calc input[type=number]{width:110px;min-height:44px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;padding:0 10px;text-align:right}
.calc input[type=range]{grid-column:1 / 3;width:100%;accent-color:var(--warn);min-height:32px}
.calc .val{font-weight:700;font-variant-numeric:tabular-nums}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--rule);padding:12px 2px;min-height:52px;cursor:pointer;font-size:.95rem}
.sw .knob{flex:none;width:48px;height:28px;border-radius:14px;background:var(--rule);position:relative;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--panel);transition:left .15s}
.sw[aria-checked="true"] .knob{background:var(--o2)}
.sw[aria-checked="true"] .knob::after{left:23px}
@media (prefers-reduced-motion:reduce){.sw .knob,.sw .knob::after{transition:none}}
.result{border-radius:10px;padding:12px 14px;margin-top:12px;background:var(--scope-bg)}
.result.low{background:var(--o2-bg)} .result.mod{background:var(--caution-bg)} .result.high{background:var(--warn-bg)}
.result .big{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.result .lvl{font-weight:700}
.result.low .lvl{color:var(--o2)} .result.mod .lvl{color:var(--caution)} .result.high .lvl{color:var(--warn)}
.lobes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.lobe{min-height:52px;border-radius:10px;border:2px solid var(--rule);background:var(--paper);cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.lobe small{font-weight:400;color:var(--muted)}
.lobe[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-bg)}
.lobes .side{font-size:.8rem;font-weight:700;color:var(--muted);text-align:center}
.shuntbar{display:flex;height:28px;border-radius:6px;overflow:hidden;margin:10px 0 4px;border:1px solid var(--rule)}
.shuntbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.chk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;border-top:1px solid var(--rule);padding:12px 2px;min-height:52px;cursor:pointer;font-size:.95rem;line-height:1.35}
.chk .box{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;color:var(--panel)}
.chk[aria-checked="true"] .box{background:var(--o2);border-color:var(--o2)}
.chk[aria-checked="true"] .ct{color:var(--muted)}
.chk .ct small{display:block;color:var(--muted);font-size:.8rem}
.progress{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin:6px 0 2px}
.progress span{display:block;height:100%;background:var(--o2)}
.coverhero{border-left:8px solid var(--warn);padding:4px 0 4px 14px;margin:6px 0 14px}
.coverhero h2{margin:0;font-size:1.55rem;line-height:1.15}
.coverhero p{margin:4px 0 0;font-size:1.1rem;color:var(--muted)}

table.casehdr{border-collapse:collapse;width:100%;margin:6px 0 14px;background:var(--panel);border:2px solid var(--ink);font-size:.93rem}
table.casehdr th{width:32%;text-align:left;vertical-align:top;padding:7px 10px;background:var(--paper);border-bottom:1px solid var(--rule);font-weight:700}
table.casehdr td{vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--rule)}
.srcline{font-size:.82rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:8px;margin-top:14px}

<script>
window.PTA_DATA = {"app": {"title": "Practical Thoracic Anesthesia", "subtitle": "Core Skills to Crisis Survival"}, "intro": [{"t": "p", "x": "This companion is organised the way a thoracic case unfolds. **Preop** covers assessment, risk evaluation and prehabilitation. **Physiology** explains why one-lung ventilation behaves as it does. **Core skills** lists the pitfalls of each procedure. **Crisis** gives the actions for life-threatening, debilitating and unanticipated events. **Lessons** turn the most common errors into short clinical stories. **Drill** tests the memory items."}, {"t": "h", "x": "How evidence is marked", "dont": false}, {"t": "box", "items": ["{e} The statement is verifiable anatomy, physiology or settled practice. It is stated plainly.", "{g} The statement rests on trials, meta-analyses or formal consensus. The magnitude or consensus score is given.", "{o} The evidence is conflicting or inconclusive.", "{d} The point comes from general anaesthetic practice outside the source literature listed below. Verify it against local protocol before relying on it."], "cap": ""}, {"t": "h", "x": "The governing rule in a crisis", "dont": false}, {"t": "p", "x": "In a genuine life-and-death situation, take the action that is easiest and takes the least time, not the ideal one. That action keeps the patient alive and buys time for the ideal one. Every crisis card lists these actions first, inside a red box, as memory items. A memory item is an action performed without opening a book."}, {"t": "p", "x": "In thoracic anaesthesia the easiest, fastest action is usually one of three: 100% oxygen, return to two-lung ventilation, or telling the surgeon to stop. Each takes seconds. None requires a bronchoscope."}], "crisisIntro": "Each card has four parts. **Recognise** lists the cues. **Memory items** are the easiest, fastest actions that keep the patient alive. **Then** lists the definitive steps once time is bought. **Do not** lists the error most often made. Red cards are immediately life-threatening. Amber cards are serious but allow minutes.", "crises": [{"id": "B1", "name": "Hypoxaemia during one-lung ventilation", "sev": "Life-threatening", "amber": false, "group": "b-intra", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Hypoxaemia during thoracic surgery is SpO₂ below 85–90%, or PaO₂ below 60 mmHg on FiO₂ 1.0. It occurs in about 5–10% of OLV cases, is usually brief, and is tolerated by patients with normal lungs. It is dangerous when severe, prolonged, or in poor lung function. The commonest cause is a malpositioned DLT or blocker. {g}"}, {"t": "memory", "items": ["FiO₂ 1.0. Tell the surgeon the number.", "If saturation is falling fast or already low: warn the surgeon, then return to two-lung ventilation.", "Hand-ventilate for a few breaths. Feel compliance. Look at EtCO₂ and the pressure–volume loop.", "Pass a suction catheter down the ventilated lumen. It clears secretions or blood and proves the lumen is patent."]}, {"t": "h", "x": "Then, once saturation recovers", "dont": false}, {"t": "ol", "items": ["Confirm tube or blocker position with the bronchoscope.", "Check the circuit and machine for leaks; check muscle relaxation.", "Dependent (ventilated) lung: recruitment manoeuvre, PEEP titration, adjust minute ventilation.", "Circulation: restore a low cardiac output and correct anaemia. Avoid a supranormal output, which raises mixed venous oxygen, weakens hypoxic vasoconstriction and increases shunt. Lower the volatile concentration.", "Non-dependent (collapsed) lung: oxygen insufflation at 1–2 L/min, then CPAP 2–5 cmH₂O (up to 10 in some protocols), then intermittent re-inflation. Each step intrudes further on the surgical field. Warn about fire risk if cautery is near an oxygen-rich lung (card B11).", "Last resorts: surgical clamping of the pulmonary artery to the operative lung (raises right ventricular afterload), ECMO, or abandoning the procedure.", "Send a blood gas (SpO₂ <88% is a consensus trigger)."]}, {"t": "dont", "blocks": [{"t": "h", "x": "Do not", "dont": true}, {"t": "p", "x": "Do not work down a long algorithm while the saturation is in the seventies. Two-lung ventilation first, algorithm second. {e}"}]}]}, {"id": "B2", "name": "Sudden rise in airway pressure or loss of tidal volume", "sev": "Life-threatening", "amber": false, "group": "b-intra", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Peak pressure jumps, expired tidal volume falls, the capnograph changes shape, saturation and pressure may follow."}, {"t": "memory", "items": ["FiO₂ 1.0. Hand-ventilate to feel the lung.", "Pass a suction catheter down each lumen. If it will not pass, the lumen is kinked, bitten or obstructed.", "Disconnect briefly. If blood pressure and pressure recover, suspect gas trapping (auto-PEEP).", "If a blocker is in use and both lungs appear obstructed, deflate the blocker: it may have migrated into the trachea."]}, {"t": "h", "x": "Then: work through the differential with the bronchoscope", "dont": false}, {"t": "p", "x": "Tube advanced into a lobar bronchus; bronchial cuff herniated over the carina; secretions, blood or a clot; kink from positioning; bronchospasm; surgical compression of the lung or heart; tension pneumothorax in the dependent (closed) hemithorax. {e} {d} (differential list)"}, {"t": "p", "x": "A tension pneumothorax on the ventilated side presents with rising pressure, falling saturation and hypotension. The surgeon can decompress through the mediastinal pleura; otherwise decompress and drain. {d}"}, {"t": "dont", "blocks": [{"t": "h", "x": "Do not", "dont": true}, {"t": "p", "x": "Do not increase the ventilator pressure limit to push the tidal volume back. Find the obstruction."}]}]}, {"id": "B3", "name": "Poor lung collapse, poor surgical field", "sev": "Serious", "amber": true, "group": "b-intra", "blocks": [{"t": "memory", "items": ["Confirm the isolated lumen or blocker channel is closed to air during closed-chest OLV.", "Check with the bronchoscope that the cuff seals the correct bronchus."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "ol", "items": ["For a blocker: deflate, reconnect two-lung ventilation with FiO₂ 1.0, then disconnect at end-expiration and re-inflate the balloon (apnoea-disconnection).", "Apply gentle suction to the isolated lung only if a surgeon agrees; excessive suction can injure the airway. {d}", "Check for a leak through a small bronchial cuff (undersized tube) or incomplete fissures (surgical cause)."]}, {"t": "dont", "blocks": [{"t": "h", "x": "Do not", "dont": true}, {"t": "p", "x": "Do not leave the operative port open to the room \"to vent\" before the pleura is opened. That slows collapse by about 30 minutes in the median. {g}"}]}]}, {"id": "B4", "name": "Unanticipated difficult intubation with a DLT", "sev": "Life-threatening", "amber": false, "group": "b-intra", "blocks": [{"t": "memory", "items": ["Oxygenate first: face mask or supraglottic airway.", "Abandon the DLT. Secure the airway with a single-lumen tube by the method you are best at.", "Achieve isolation through that tube with a bronchial blocker."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "ol", "items": ["If intubation fails but a laryngeal mask ventilates, a blocker can be placed through the laryngeal mask. First-time success was 25/30 in one series; lung deflation was rated 8/10. {g}", "If a DLT is truly essential (for example, contamination risk), exchange over a tube exchanger under videolaryngoscopy, by an experienced operator, after the airway is stable. {d}"]}, {"t": "dont", "blocks": [{"t": "h", "x": "Do not", "dont": true}, {"t": "p", "x": "Do not make repeated attempts with a stiff, wide DLT in a difficult airway. Swelling from each attempt makes the next one harder."}]}]}, {"id": "B5", "name": "Airway or cardiovascular collapse with an anterior mediastinal mass", "sev": "Life-threatening", "amber": false, "group": "b-intra", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "EtCO₂ falls and peak pressure rises at induction, or later when a relaxant is given. Breath sounds disappear on one side. Hypotension or arrest follows compression of the heart, pulmonary artery or SVC."}, {"t": "p", "x": "The classical explanation lists four transitions: upright to supine (central blood volume rises; the mass may swell), awake to anaesthetised (bronchial tone falls), spontaneous to positive-pressure ventilation (loss of the negative-pressure gradient), and unparalysed to paralysed (diaphragm moves cephalad; lung volume falls by 500–1,500 mL). The textbook teaches this mechanism; direct evidence for it is limited. {o} Hartigan 2022 was a single-centre, non-randomised, prospective observational study testing whether, in adults with moderate to severe mass-related tracheobronchial compression, positive-pressure ventilation and neuromuscular block could be introduced without loss of central airway patency. 17 adults with large mediastinal masses were intubated awake; the compressed segment was then recorded by continuous video bronchoscopy during a staged induction in a semi-sitting position. Seven experienced bronchoscopists scored anterior–posterior diameter against the awake, spontaneous-breathing baseline (0 unchanged; ±1 for 25–50% and ±2 for >50% larger or smaller) in blinded, scrambled, side-by-side comparisons. Tidal volume, rate and I:E ratio were similar across phases. Induction with spontaneous ventilation produced no significant change (0 [95% CI 0 to 0]; P = 0.953). Patency scores increased with positive-pressure ventilation (0 [95% CI 0 to 1]; P = 0.024) and with neuromuscular block (1 [95% CI 0 to 1]; P < 0.001). No patient had airway collapse or difficult ventilation in any phase. There was no comparison group, PEEP was not used, and the effect of neuromuscular block could not be separated from the preceding positive-pressure phase. {g} The authors conclude that prevailing assumptions about positive pressure, paralysis and mass-related airway collapse need reassessment, but that the results do not prove conventional (non-staged) induction is safe. The study therefore challenges the practice of maintaining spontaneous breathing, but does not provide conclusive evidence that general anaesthesia with neuromuscular block and positive-pressure ventilation is safe before the airway is secured in patients with central airway compression. {o} Sarkiss and Jimenez 2023 (narrative review with single-centre experience) interpret the same data more strongly, stating that emerging evidence refutes the fear of intravenous induction with neuromuscular block. That is expert opinion; it goes beyond the primary authors' own conclusion. {o}"}, {"t": "p", "x": "The same review describes three non-airway causes of collapse after induction. First, air trapping: positive pressure widens the compressed airway on inspiration, but it narrows again on expiration, so gas is trapped, the lungs hyperinflate, venous return falls and blood pressure drops. Second, tumour compression of the heart or its inflow and outflow, which positive pressure and hypovolaemia worsen. Third, hyperventilation in a patient with compensated chronic hypercapnia, causing acute alkalosis and cardiovascular depression. A 1981 death on induction occurred without ventilation difficulty, consistent with a circulatory rather than an airway cause. {o}"}, {"t": "memory", "items": ["Move the patient to the pre-agreed rescue position: sitting up, lateral, or prone.", "Wake the patient if possible.", "Call for the rigid bronchoscope and its operator, who should already be in the room."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "ol", "items": ["Rigid bronchoscopy to pass the obstruction, or advance a reinforced tube beyond it if normal distal trachea exists.", "ECMO or cardiopulmonary bypass if planned as standby for the high-risk patient.", "Hypotension with rising airway pressure during positive-pressure ventilation: suspect air trapping. Lengthen expiratory time, lower the rate, and briefly disconnect to let trapped gas escape. {d}", "If a rigid bronchoscope cannot be passed, a flexible bronchoscope advanced beyond the obstruction with suction has relieved air trapping in one centre's experience. {o}", "Tumour compressing the heart or great vessels: ECMO support is the review's suggested strategy; plan it before induction. {o}"]}, {"t": "h", "x": "Prevention (the plan made before induction)", "dont": false}, {"t": "ol", "items": ["CT, flow–volume loops (variable intrathoracic obstruction), and echocardiography.", "Awake fibreoptic intubation beyond the stenosis where anatomy allows. Sedation with dexmedetomidine or ketamine to keep spontaneous ventilation. Heliox reduces turbulent flow.", "Avoid neuromuscular blockers until the airway is secured beyond the obstruction.", "Venous access in the lower limbs when the SVC is at risk.", "Write the rescue position on the board before induction."]}, {"t": "dont", "blocks": [{"t": "h", "x": "Do not", "dont": true}, {"t": "p", "x": "Do not give a neuromuscular blocker without an agreed plan and rescue options ready. In the textbook case, rocuronium given 30 minutes into surgery was followed by absent breath sounds on the right and peak pressures in the 40s–50s."}]}]}, {"id": "B6", "name": "Massive haemoptysis or blood flooding the airway", "sev": "Life-threatening", "amber": false, "group": "b-intra", "blocks": [{"t": "memory", "items": ["FiO₂ 1.0. Position the patient bleeding side down, so blood stays in the lung already lost. {d}", "Protect the good lung by the fastest method in your hands. With a single-lumen tube in place, intentional mainstem intubation of the _non-bleeding_ lung is a rescue option: a tube advanced blindly usually enters the **right** main bronchus. For left-sided bleeding, advancing blindly may suffice. For right-sided bleeding, guide the tube into the left bronchus with a bronchoscope.", "Suction continuously."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "ol", "items": ["Confirm the tube position with a bronchoscope or by unilateral breath sounds as soon as possible; a right mainstem tube can occlude the right upper lobe. Then convert to definitive isolation: a DLT gives the most reliable protection. A bifurcated (EZ-type) blocker is an alternative; it can be inserted blindly and positioned by auscultation, then confirmed when the view allows. {g}", "Interventional bronchoscopy, embolisation, or surgery for source control. {d}"]}, {"t": "dont", "blocks": [{"t": "h", "x": "Do not", "dont": true}, {"t": "p", "x": "Do not assume a blindly advanced tube has entered the intended side. Blind advancement favours the right bronchus, which is the wrong side when the right lung is bleeding."}]}]}, {"id": "B7", "name": "Major intraoperative haemorrhage", "sev": "Life-threatening", "amber": false, "group": "b-intra", "blocks": [{"t": "memory", "items": ["Tell the surgeon; the surgeon applies direct pressure. {d}", "Call for help and blood. Activate the massive transfusion protocol.", "FiO₂ 1.0. Use vasopressor to hold pressure while volume arrives."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "ol", "items": ["Large-bore access, rapid infuser, warming. Point-of-care coagulation where available. {d}", "Consider two-lung ventilation if the surgeon can work, to reduce hypoxaemia during resuscitation.", "Cerebral oximetry is recommended for severe life-threatening bleeding (EACTAIC). {g}"]}, {"t": "dont", "blocks": [{"t": "h", "x": "Do not", "dont": true}, {"t": "p", "x": "Do not rely on a single peripheral cannula in the dependent arm for a hilar dissection. Plan access before the drapes go on."}]}]}, {"id": "B8", "name": "Tracheobronchial injury from the tube", "sev": "Serious", "amber": true, "group": "b-intra", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Air leak despite correct cuff volumes, blood in the tube, subcutaneous or mediastinal emphysema, difficult ventilation. Risk factors: oversized tube, stylet not withdrawn. {e} (risk factors); {d} (signs)"}, {"t": "memory", "items": ["FiO₂ 1.0. Reduce airway pressure.", "Bronchoscope to find the tear.", "Position the cuff distal to the tear, or isolate the injured side."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "Inform the surgeon; repair may be needed. Avoid nitrous oxide and high pressures. {d}"}]}, {"id": "B9", "name": "Haemodynamic collapse during hilar surgery", "sev": "Life-threatening", "amber": false, "group": "b-intra", "blocks": [{"t": "memory", "items": ["Ask the surgeon to release retraction on the heart and great vessels. {d}", "FiO₂ 1.0; give vasopressor.", "Look at the ECG for arrhythmia and ischaemia."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "ol", "items": ["Exclude bleeding (card B7), tension pneumothorax (card B2) and auto-PEEP.", "After pulmonary artery clamping, right ventricular afterload rises. Right ventricular function falls after resection because vascular resistance rises and compliance falls; the effect scales with the extent of resection and is less after VATS than thoracotomy. {g}", "Transoesophageal echocardiography is recommended for unexplained instability not responding to treatment (86% consensus). {g}", "Right ventricular support: keep coronary perfusion pressure with noradrenaline or vasopressin; avoid hypoxia, hypercapnia, acidosis and high airway pressure; consider inhaled pulmonary vasodilator and an inotrope. {d}"]}]}, {"id": "B10", "name": "Mediastinoscopy hazards", "sev": "Serious", "amber": true, "group": "b-intra", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Loss of the right radial pulse trace during scope insertion means compression of the innominate artery. {d} Sudden fall in EtCO₂ with hypotension in a head-up position suggests venous air embolism. Hoarseness afterwards suggests recurrent laryngeal nerve injury. {e}"}, {"t": "memory", "items": ["Pulse oximeter or arterial line on the right hand; blood pressure cuff on the left. {d}", "Pulse loss: tell the surgeon to reposition the scope.", "Suspected air embolism: tell the surgeon to flood the field; lower the head; FiO₂ 1.0; support circulation. {d}"]}]}, {"id": "B11", "name": "Fire in the airway or chest", "sev": "Life-threatening", "amber": false, "group": "b-intra", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Fire needs three elements: oxygen, an ignition source (diathermy, laser) and fuel (drapes, gauze, alcohol prep, the tube). In the chest, the patient's own lung can leak oxygen into the field. Reported cases include a giant bulla filled with oxygen, an intrathoracic swab igniting during CPAP, and a flame from a bronchial stump during lung transplantation that charred the tube. {e}"}, {"t": "memory", "items": ["Surgeon stops diathermy. Anaesthetist stops oxygen flow to the airway.", "Remove burning material; flood the field with saline.", "If the airway tube is involved: remove it, then re-establish the airway and ventilate with air. {d}"]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "Bronchoscopy to assess airway burn. Treat as a sentinel event. {d}"}, {"t": "h", "x": "Prevention", "dont": false}, {"t": "p", "x": "Lowest oxygen concentration compatible with safe saturation; suction under the drapes; wet or remove dry sponges near the airway; remove bullae with scissors or scalpel, not diathermy; reinflate the operative lung with room air, from a second ventilator or a room-air CPAP device, during decortication; CO₂ flooding of the field. {g}"}]}, {"id": "B12", "name": "Blocker or tube caught in the resection line", "sev": "Serious", "amber": true, "group": "b-intra", "blocks": [{"t": "memory", "items": ["Before any bronchial stapler fires, ask: \"Is anything of mine in that bronchus?\"", "If a blocker will not withdraw after stapling, stop pulling and tell the surgeon."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "Open repair of the bronchus is often required. Prevention is withdrawal of the blocker into the trachea before the bronchus intermedius is clamped. {e}"}]}, {"id": "B13", "name": "Cardiac herniation after pneumonectomy", "sev": "Life-threatening", "amber": false, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Sudden hypotension, tachycardia, shock or arrest, usually within 24 hours, when the pericardial defect is incompletely closed or its closure breaks down. Mortality exceeds 50%. {g}"}, {"t": "p", "x": "After right pneumonectomy, the heart twists and obstructs venous return: high CVP and an acute SVC syndrome. After left pneumonectomy, the rim of the defect compresses the myocardium: ischaemia, arrhythmia, outflow obstruction. {e}"}, {"t": "p", "x": "Triggers include turning the patient, moving from lateral to supine, coughing, and suction on the pneumonectomy drain. {d} (except positional change)"}, {"t": "memory", "items": ["Turn the patient lateral with the operated side up.", "Stop any suction on the pneumonectomy drain. {d}", "Call the surgeon; go to theatre."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "Re-intubate with a single-lumen tube. Support circulation until surgical repositioning and pericardial repair."}, {"t": "dont", "blocks": [{"t": "h", "x": "Do not", "dont": true}, {"t": "p", "x": "Do not lie the patient supine or operated side down \"to examine\" or to resuscitate."}]}]}, {"id": "B14", "name": "Post-pneumonectomy pulmonary oedema", "sev": "Life-threatening", "amber": false, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Respiratory distress and hypoxaemia with bilateral or remaining-lung infiltrates. Incidence 2–5%, mortality up to 50%. Early form within 72 hours from leaky capillaries; late form after 72 hours, often from aspiration, fistula or surgical complication. Risk factors: pneumonectomy, right side, excess fluid, high urine output, high ventilatory pressure index, preoperative alcohol use. {g}"}, {"t": "memory", "items": ["Oxygen; sit the patient up.", "Stop maintenance fluid.", "Get a chest X-ray and blood gas; call senior help."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "Fluid restriction and diuretic; if ventilation is needed, low tidal volume and low pressures; measures to reduce pulmonary vascular resistance. Exclude fistula, aspiration and cardiac failure. {e}"}]}, {"id": "B15", "name": "Bronchopleural fistula", "sev": "Life-threatening", "amber": false, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "A bronchopleural fistula is a communication between a bronchus and the pleural space. After pneumonectomy, incidence is 2.9–20% and mortality 18–67%. Cues: cough (often productive of pleural fluid), a persistent air leak, a falling fluid level in the pneumonectomy space, a new air–fluid level on X-ray. Right pneumonectomy carries more risk: the right stump is exposed and has a single bronchial artery. {g}"}, {"t": "memory", "items": ["Sit the patient up, leaning towards the operated side, so pleural fluid does not spill into the remaining lung. {d}", "Oxygen; ensure a working, unclamped drain.", "Call the surgeon and senior anaesthetist."]}, {"t": "h", "x": "Then (if theatre is needed)", "dont": false}, {"t": "ol", "items": ["Keep spontaneous ventilation until the airway is isolated.", "Isolate the healthy lung fast: a fistula is an absolute indication for lung separation. Positive pressure to the stump worsens the leak and can cause tension pneumothorax.", "Treat sepsis and empyema. Negative pressure on the drain can increase flow through the fistula."]}]}, {"id": "B16", "name": "Postoperative intrathoracic haemorrhage", "sev": "Life-threatening", "amber": false, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Record each drain hourly. Inform the surgeon of sanguineous output >100 mL/h over 4 hours, or >200 mL in any single hour. A drain that suddenly stops draining in a shocked patient may be clotted. {g} (thresholds); {d} (clotted drain)"}, {"t": "memory", "items": ["Call the surgeon with the numbers.", "Resuscitate; cross-match; correct coagulopathy.", "Point-of-care ultrasound for haemothorax and tamponade, especially if the pericardium was opened."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "Chest X-ray, coagulation studies, serial haemoglobin. Ongoing bleeding, retained haemothorax and tamponade are indications to return to theatre. {e}"}]}, {"id": "B17", "name": "New atrial fibrillation", "sev": "Serious", "amber": true, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "AF is the commonest arrhythmia after lung resection, reaching up to 40% after pneumonectomy, with longer stay and higher mortality. Age is the strongest predictor. Modifiable factors include alcohol, red cell transfusion, open surgery and inotropes. After oesophagectomy, AF is associated with anastomotic leak and pulmonary complications. {g}"}, {"t": "memory", "items": ["If unstable: synchronised cardioversion. {d}", "If stable: check potassium, magnesium, oxygenation, pain, fluid status and bleeding."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "Rate or rhythm control per local protocol. Amiodarone, beta-blockers and statins are the agents studied for prevention. After oesophagectomy, treat new AF as a possible leak until proven otherwise. {e}"}]}, {"id": "B18", "name": "Lobar torsion", "sev": "Serious, time-critical", "amber": true, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "After lobectomy, the remaining lobe (classically the right middle lobe) rotates on its pedicle. Cues: rising oxygen requirement, haemoptysis, a dense lobe on X-ray, an abrupt stop of air leak. Bronchoscopy shows a narrowed \"fish-mouth\" bronchus. {d} (not covered in the pack)"}, {"t": "memory", "items": ["Tell the surgeon early; the lobe becomes gangrenous with delay.", "Arrange urgent bronchoscopy or CT and theatre. {d}"]}]}, {"id": "B19", "name": "Re-expansion pulmonary oedema", "sev": "Serious", "amber": true, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Sudden breathlessness after drainage of a large effusion or pneumothorax. Incidence below 1%. Risk rises with removal of more than 1.5 L and in trapped (non-expandable) lung. {g}"}, {"t": "memory", "items": ["Stop drainage. Oxygen. Sit up."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "Supportive care. Returning fluid to the pleural space has been associated with rapid resolution in reported cases. {g} (case reports)"}]}, {"id": "B20", "name": "Respiratory failure after extubation", "sev": "Serious", "amber": true, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Postoperative pulmonary complications occur in 7–49% of lung resections, with mortality 2–12%. Common drivers: sputum retention, atelectasis, pain that stops coughing, residual block, and laryngeal oedema after a DLT. {g}"}, {"t": "memory", "items": ["Sit up; oxygen; treat pain.", "Check train-of-four if relaxants were given in the last hours.", "Physiotherapy and suction for retained secretions; bronchoscopy for a plugged lobe."]}, {"t": "h", "x": "Then", "dont": false}, {"t": "p", "x": "If re-ventilation is needed: tidal volume 6–8 mL/kg with PEEP, peak pressure below 30 cmH₂O to protect the bronchial stump. Before re-extubation after a DLT, test for a cuff leak. Negative inspiratory force better than −20 cmH₂O and rapid shallow breathing index below 100 support extubation. {e}"}]}, {"id": "B21", "name": "Local anaesthetic systemic toxicity (LAST)", "sev": "Life-threatening", "amber": false, "group": "b-post", "blocks": [{"t": "h", "x": "Recognise", "dont": false}, {"t": "p", "x": "Perioral numbness, agitation, seizures, arrhythmia, cardiovascular collapse. Risk rises with cumulative infusions for multiple continuous blocks. {e}"}, {"t": "memory", "items": ["Stop the infusion. Call for help.", "Airway, 100% oxygen; treat seizures.", "Give 20% lipid emulsion per the local LAST protocol. {d}"]}]}], "debil": {"t": "table", "head": ["Complication", "What it costs the patient", "What prevents it"], "rows": [["Chronic post-surgical pain", "Pain beyond 3 months in 25–60%; emotional suffering and disability. {g}", "Early aggressive multimodal analgesia; the strongest risk factor is severe acute pain."], ["Airway trauma: sore throat, hoarseness, vocal cord injury", "Sore throat 40% and hoarseness 25% with DLTs in the meta-analysis. {g}", "Correct size; stylet out early; no force; consider a blocker; VL reduces cord trauma."], ["Recurrent laryngeal nerve injury", "Hoarseness, weak cough, aspiration (mediastinoscopy, oesophagectomy). {e}", "Recognise hoarseness; evaluate the cords before feeding. {d}"], ["Positioning injury", "Brachial plexus stretch, dependent eye and ear pressure, compressed dependent arm. {d}", "Axillary support, neutral neck, check pressure points after every turn."], ["Venous thromboembolism", "Calf thrombosis 20–40%, pulmonary embolism 2–4% in high-risk thoracic patients. {g}", "Pneumatic compression on ICU arrival, heparin from day 1, walking from the morning of day 1."], ["Residual neuromuscular block", "Weak cough, re-intubation. {g}", "Quantitative monitoring; TOF ratio ≥0.9 before extubation."], ["Postoperative delirium and cognitive dysfunction", "Longer stay, poorer recovery. {g}", "Depth-of-anaesthesia monitoring may reduce it (83% consensus)."]]}, "skillsIntro": "Each table states the pitfall, the mechanism that produces it, and the prevention. Read the middle column first: knowing why a tube moves is what makes you look for the movement.", "skills": [{"id": "a1", "title": "A1. Preoperative assessment and planning", "blocks": [{"t": "table", "head": ["Pitfall", "Why it happens", "Prevention"], "rows": [["Choosing the isolation device before reading the CT", "Tumour, extrinsic compression or tracheal distortion changes the bronchial anatomy the device must seat in. A report that says \"mass\" does not state the airway calibre.", "Read the axial CT at the carina and both main bronchi yourself. EACTAIC reviewers advise CT, 3-D reconstruction or virtual bronchoscopy to predict difficult isolation and choose the device. {g} expert review"], ["Assessing the airway for intubation but not for isolation", "A patient can be easy to intubate with a single-lumen tube and impossible to isolate. The double-lumen tube is longer, wider and stiffer.", "Use a validated airway score (the Airway Risk Index is cited) together with predictors of difficult isolation: COPD, endobronchial tumour, tracheal pathology. {g}"], ["Treating an asymptomatic anterior mediastinal mass as low risk", "Total airway obstruction can occur at induction even in patients without symptoms. Lying supine, loss of muscle tone, paralysis and positive pressure each narrow the compressed airway.", "Stratify risk (Blank and de Souza): high risk means severe postural symptoms, stridor, cyanosis, tracheal compression >50%, bronchial compression, pericardial effusion or SVC syndrome. See crisis card B5. {e}"], ["No stated plan B for isolation", "The failure happens after induction, when time is shortest.", "Say the fallback aloud at the team brief: \"If the DLT fails, single-lumen tube and blocker.\" {d}"]]}]}, {"id": "a2", "title": "A2. Double-lumen tube (DLT) selection", "blocks": [{"t": "p", "x": "A double-lumen tube is two tubes bonded side by side. The tracheal lumen ends above the carina. The bronchial lumen enters one main bronchus. Each lung can then be ventilated or collapsed independently."}, {"t": "table", "head": ["Pitfall", "Why it happens", "Prevention"], "rows": [["Oversizing", "A large tube herniates the bronchial cuff and injures the trachea or bronchus.", "The correct tube passes into the bronchus with minimal resistance and seals with the bronchial cuff inflated. {e}"], ["Undersizing", "A small tube needs more cuff volume to seal, dislodges more easily, and raises the risk of auto-PEEP and hyperinflation because resistance to expiration is higher.", "Start from a simple rule, then adjust to CT. {g}"], ["Relying on the formula alone", "No consensus method exists. Tube dimensions differ between manufacturers.", "Height and sex rule: women <160 cm 35 Fr, ≥160 cm 37 Fr; men <170 cm 39 Fr, ≥170 cm 41 Fr. This achieved >90% successful positioning and separation. Left main bronchus width ≈ 0.68 × tracheal width on imaging. Ultrasound of tracheal width is a validated alternative. {g}"], ["Choosing a right DLT by default for right-sided surgery", "The right upper lobe bronchus arises 19 ± 6 mm (men) from the carina. The margin for aligning the ventilation slot is 4–8 mm. Some patients have a take-off at the carina.", "A left DLT serves most right and left resections. Reserve a right DLT for left pneumonectomy, distorted or compressed left main bronchus, surgery on the left main bronchus, or left sleeve resection. {e}"], ["Choosing a blocker when contamination protection matters most", "Blocker cuffs are low-pressure, high-volume and seal less reliably against pus or blood.", "These are absolute indications for **lung isolation**: massive haemorrhage, lung abscess, bronchopleural fistula, unilateral giant bulla, sleeve pneumonectomy, lung transplantation. {e} A DLT is usually preferred when the healthy lung must be protected from pus or blood, when suction or CPAP to either lung is needed, or when rapid switching between lungs is expected; blockers and intentional mainstem intubation remain alternative techniques when a DLT cannot be placed. {g} The 2026 EACTAIC airway review reserves the term \"lung separation\" for the DLT in these indications, whereas the textbook presents them as indications for isolation by any suitable technique. {o}"]]}]}, {"id": "a3", "title": "A3. DLT insertion", "blocks": [{"t": "table", "head": ["Pitfall", "Why it happens", "Prevention"], "rows": [["Leaving the stylet in after the bronchial cuff passes the cords", "The stiff tip drives into the membranous posterior wall of the trachea or main bronchus. Lacerations are linked to stylet retention and to oversizing.", "Withdraw the stylet once the bronchial cuff is past the cords. Then rotate the tube 90° towards the target bronchus and advance. {e}"], ["Advancing against resistance", "Resistance means the tube is too large or the tip is against the tracheal wall or carina.", "Stop. Withdraw slightly, rotate, re-advance, or change size. Do not push through. {e}"], ["Expecting the videolaryngoscope to make DLT insertion easy", "The view is better, but the DLT curve does not match an angulated blade. The tip strikes the anterior tracheal wall; external laryngeal manipulation is needed in up to one-third.", "Use a stylet shaped for the device or a dedicated DLT stylet. Expect a longer intubation time. {g}"], ["Assuming videolaryngoscopy reduces malposition", "Cohen (2021) reports several trials and a 2018 meta-analysis with _more_ malposition after VL, probably from extra rotation. The 2026 EACTAIC airway review cites newer data suggesting _fewer_ malpositions and advocates VL as standard. VL consistently reduces sore throat and vocal cord trauma.", "Teach both findings. Whatever the laryngoscope, confirm position with a bronchoscope. {o} for malposition; {g} for less airway trauma"], ["Blind depth without a reference", "Depth varies with height.", "Average left DLT depth at the lips is 28–29 cm for a 170 cm adult, ±1 cm per 10 cm of height. Use this as a starting point, not a confirmation. {g}"], ["Overfilling the bronchial cuff to cure a leak", "A leak with a large cuff volume usually means the cuff sits in the trachea or the tube is too small. Overinflation herniates the cuff over the carina and obstructs the other lung.", "A well-sized tube in the bronchus seals with a small volume, usually about 1–3 mL. A larger requirement is a signal to re-check position. {d}"]]}]}, {"id": "a4", "title": "A4. Fibreoptic confirmation", "blocks": [{"t": "p", "x": "Fibreoptic bronchoscopy confirms what auscultation only suggests. Chest ultrasound is more sensitive than auscultation and is an option when no bronchoscope is available. {g}"}, {"t": "box", "items": ["**Orientation.** Anterior tracheal wall shows cartilage rings. Posterior membranous wall shows longitudinal muscle bands. {e}", "**The landmark that proves the right side.** The right upper lobe bronchus is the only lobar bronchus that arises almost immediately from a main bronchus and divides into three segmental orifices. If three orifices are seen, the scope is in the right bronchial tree. {e}", "**Left DLT, through the tracheal lumen.** The carina is seen. The upper edge of the (usually blue) bronchial cuff sits just below the carina in the left main bronchus, without herniation. **Through the bronchial lumen.** The left upper and lower lobe bifurcation is seen, with a patent lumen. {e}", "**Right DLT, through the bronchial lumen.** The ventilation slot faces the right upper lobe orifice. {e}"], "cap": "Figure A4. The four views to name aloud at every fibreoptic check. Naming the view proves the tube has been located; \"looks fine\" does not."}, {"t": "table", "head": ["Pitfall", "Why it happens", "Prevention"], "rows": [["Checking once, supine, and never again", "Turning to lateral decubitus, neck flexion and surgical traction move the tube, often outward.", "Confirm supine, confirm again after positioning, and re-check whenever pressure, volume or saturation changes. {d}"], ["Misreading the left upper lobe bifurcation as the carina", "Both are bifurcations. The scope has been advanced through the bronchial lumen, not the tracheal lumen.", "Know which lumen the scope entered. Find the tracheal rings first, then follow them to the true carina. {e}"], ["Losing orientation after rotating the scope", "The image rotates with the hand.", "Re-establish anterior rings and posterior membrane before judging left and right. {e}"], ["Assuming no bronchoscope means no confirmation", "Clamp-and-listen is imprecise.", "Use lung ultrasound for lung sliding; consider a video DLT with an integrated camera, which removes the need for a scope in about 95% of cases and monitors position continuously. {g}"]]}]}, {"id": "a5", "title": "A5. Bronchial blocker placement", "blocks": [{"t": "p", "x": "A bronchial blocker is a balloon-tipped catheter passed through a single-lumen tube into one main bronchus. Inflating the balloon isolates that lung."}, {"t": "p", "x": "A meta-analysis of 25 studies (1,636 patients) compared the DLT with the blocker. {g}"}, {"t": "table", "head": ["Outcome", "DLT", "Blocker", "Effect (OR, 95% CI)"], "rows": [["Excellent lung collapse", "72.4%", "73.4%", "1.20 (0.84–1.72), no difference"], ["Malposition", "25.3%", "31.9%", "0.66 (0.49–0.88), fewer with DLT"], ["Hypoxaemia", "13.5%", "6.0%", "2.27 (1.14–4.49), more with DLT"], ["Bronchus or carina injury", "23.2%", "8.4%", "3.45 (1.43–8.31), more with DLT"], ["Sore throat", "40.3%", "23.3%", "2.30 (1.68–3.14), more with DLT"]]}, {"t": "meta", "x": "Interpretation: the blocker isolates as well, is gentler, and moves more. The authors state that the evidence remains inconclusive. {o} for overall superiority."}, {"t": "table", "head": ["Pitfall", "Why it happens", "Prevention"], "rows": [["Using a blocker for the wrong patient", "The blocker is the device of choice in some patients and a poor choice in others.", "Prefer a blocker for known difficult airway, tracheostomy, nasal intubation, altered anatomy, a tube already in place, planned postoperative ventilation, children under about 140–145 cm, previous contralateral pneumonectomy, and selective lobar blockade. {g}"], ["Dislodgement into the trachea", "Surgical manipulation and head movement push the balloon out. A proximal balloon in the trachea obstructs both lungs.", "Lock the blocker in its adaptor, secure the tube, and keep peak airway pressure below 30 cmH₂O so gas does not bypass the cuff. Sudden loss of isolation plus a tidal volume collapse means blocker in trachea: deflate first. {e}"], ["Slow collapse of the right upper lobe", "A blocker at the right main bronchus lies close to, or across, the upper lobe orifice.", "Use apnoea-disconnection before inflation: disconnect at end-expiration, let the lung empty, then inflate the balloon. {g}"], ["Engorged right upper lobe after dislodgement", "If the cuff moves after the lobar vein is divided but before the artery, the re-expanding lobe fills with blood that cannot drain. The surgeon may have to convert to thoracotomy.", "Re-check position with the scope before hilar division on the right side. Tell the surgeon when isolation is lost. {e}"], ["Blocker stapled into the bronchus intermedius", "For right middle and lower lobectomy, a correctly placed cuff near the carina can still leave its tip in the staple line.", "Withdraw the blocker into the trachea before the bronchus intermedius is clamped. State this at the time-out. {e}"], ["EZ-Blocker tips both in one bronchus", "The tube tip sits too close to the carina.", "Keep the single-lumen tube tip at least 4 cm above the carina. {e}"], ["Expecting CPAP or good suction through the blocker", "The internal channel is narrow.", "If hypoxaemia is likely, prefer a DLT. {e}"], ["Tracheal stenosis: forcing a 35 Fr DLT", "External diameter of 35 Fr is 11.7 mm.", "Options: 32 Fr DLT (10.7 mm) with a 2.2 mm scope; 9 Fr blocker through a 7.0 mm tube, passing the blocker before the scope; 7 Fr blocker; laryngeal mask plus blocker. {g}"]]}]}, {"id": "a6", "title": "A6. One-lung ventilation (OLV)", "blocks": [{"t": "p", "x": "During one-lung ventilation, blood still flows through the collapsed lung but takes up no oxygen. This blood is shunt. Hypoxic pulmonary vasoconstriction diverts some of it to the ventilated lung. Shunt fraction is larger when the right lung is collapsed, because the right lung is bigger and receives about 10% more cardiac output. {e}"}, {"t": "table", "head": ["Pitfall", "Why it happens", "Prevention"], "rows": [["Large tidal volumes \"to keep the saturation up\"", "One lung receives the whole minute ventilation. Volutrauma, barotrauma and inflammation follow.", "Tidal volume 4–6 mL/kg ideal body weight. Low tidal volume during OLV is associated with fewer postoperative pulmonary complications without worse oxygenation (Peel meta-analysis, cited). {g}"], ["Fixed PEEP, or no PEEP from fear of shunt", "Textbooks until about 2003 taught that PEEP on the dependent lung diverts blood to the collapsed lung. Clinically, that shunt increase is smaller than feared. Too little PEEP permits atelectasis; too much raises shunt.", "Titrate PEEP to best dynamic compliance or lowest driving pressure (plateau minus PEEP) after recruitment. Watch the pressure–volume loop (EACTAIC recommendation 15, 88%). {g}"], ["Ignoring auto-PEEP in COPD", "Expiration is incomplete. Gas trapping raises intrathoracic pressure, lowers venous return and causes hypotension.", "Lower rate, longer expiratory time. Test by brief disconnection: blood pressure recovers if gas trapping is the cause. {d}"], ["Opening the port of the operative lung \"to help it collapse\"", "After OLV starts and before the pleura opens, negative pressure develops in the isolated lung. An open port entrains room air. Nitrogen returns, absorption slows.", "Keep the operative lumen or blocker channel closed during closed-chest OLV. Median time to collapse: closed 24 min versus open 54 min (difference 30 min, 95% CI 14–46). {g}"], ["Keeping FiO₂ 1.0 for the whole case", "FiO₂ 1.0 before OLV speeds collapse by absorption. Continued high FiO₂ causes absorption atelectasis in the ventilated lung after recruitment.", "Use FiO₂ 1.0 at the start of OLV, then reduce to about 0.4–0.5 if oxygenation allows. {g} (authors' practice)"], ["Same tidal volume after resection", "Less lung remains.", "Reduce tidal volume after resection; a lobectomy removes about 10–15%. {e}"], ["Blaming the volatile for hypoxaemia", "Volatiles attenuate hypoxic vasoconstriction (about 15–20% at 1 MAC isoflurane), but the clinical fall in oxygenation was not borne out in trials.", "Either volatile or TIVA is acceptable. Volatiles attenuate lung inflammation; whether this reduces complications is inconsistent. {o}"]]}]}, {"id": "a7", "title": "A7. Monitoring and lines (EACTAIC 2026 consensus)", "blocks": [{"t": "table", "head": ["Pitfall", "Why it happens", "Prevention (consensus score)"], "rows": [["Not checking the arterial trace after lateral positioning", "The EACTAIC-recommended contralateral radial artery is usually the dependent arm in lateral decubitus. Positioning can compress the axillary artery and dampen the trace. EACTAIC notes no evidence that contralateral cannulation is superior to ipsilateral; some clinicians choose the dependent side deliberately so that compression becomes visible.", "Use the contralateral radial artery unless contraindicated (82%). Re-check the waveform after every position change; a newly dampened trace means check the axillary support before treating \"hypotension\". Invasive pressure is not mandatory for all OLV cases (76%) but is indicated for instability, bleeding risk, limited lung function or extensive surgery (95%). {g}"], ["Central line on the non-operated side", "A pneumothorax on the side that must ventilate alone is a crisis.", "Place central lines on the operative side (93%), internal jugular in preference to subclavian (87%), with ultrasound (82%). Use femoral access when the SVC or innominate vein is involved. {g}"], ["Reading CVP as fluid responsiveness", "Static pressure does not predict fluid responsiveness during ventilation.", "Limit central lines to vasopressors, long-term therapy, pulmonary hypertension and similar indications (89%). {g}"], ["No blood gas until the saturation falls", "Pulse oximetry lags and hides CO₂.", "Draw a blood gas for SpO₂ <88%, EtCO₂ >45 mmHg, OLV >1.5 h, instability, significant bleeding or electrolyte disturbance. {g}"], ["Extubating on clinical signs of reversal", "Residual block impairs cough and airway protection.", "Monitor block quantitatively (91%). Do not extubate at train-of-four ratio <0.9 (87%). Monitor myasthenic patients even without relaxants (87%). {g}"], ["TIVA without depth monitoring", "Awareness and overdose are both invisible.", "Guide TIVA with processed EEG (81%). EtCO₂ is mandatory in intubated and non-intubated cases (99%). {g}"]]}]}, {"id": "a8", "title": "A8. Analgesia and regional blocks", "blocks": [{"t": "table", "head": ["Pitfall", "Why it happens", "Prevention"], "rows": [["Defaulting to thoracic epidural for VATS", "PROSPECT (2021) no longer recommends epidural as first choice for VATS. Paravertebral and erector spinae plane blocks are recommended, within multimodal analgesia.", "Match the block to the incision. Epidural keeps a place in open thoracotomy. {g}"], ["Treating epidural hypotension with fluid", "The cause is sympathectomy, not hypovolaemia. Excess fluid harms the remaining lung.", "If the patient is adequately resuscitated, reduce epidural dosing and give a low-dose vasoconstrictor. {e}"], ["Paravertebral needle too medial or too deep", "Medial leads to epidural or intrathecal spread (a total spinal from a paravertebral catheter is reported). Deep leads to pleural or lung puncture.", "Use ultrasound. Advance the catheter about 2 cm beyond the needle tip. Confirm spread with air-containing saline under ultrasound. {g}"], ["Cumulative local anaesthetic dose", "Multiple continuous blocks add up.", "Calculate the total dose before running more than one infusion. {e}"], ["Expecting the ESP block to match a paravertebral", "Spread is weaker and less predictable.", "ESPB is easier, faster and has fewer complications; add systemic analgesia. Serratus anterior block is second-line and covers only the lateral wall. {g}"], ["Treating acute pain as a short-term problem", "Chronic post-surgical pain affects 25–60% of patients after thoracotomy and VATS. The strongest risk factor is severe acute pain.", "Aggressive early analgesia is prevention. Intrathecal morphine gave analgesia comparable to intercostal levobupivacaine in a 181-patient VATS trial. {g}"]]}]}, {"id": "a9", "title": "A9. Fluids and the pneumonectomy patient", "blocks": [{"t": "table", "head": ["Pitfall", "Why it happens", "Prevention"], "rows": [["Replacing \"third-space\" losses", "The remaining lung has leaky capillaries after resection. Fluid enters the interstitium.", "Targets: positive balance <20 mL/kg in 24 h; crystalloid <3 L in 24 h; no third-space replacement. More than 3 L in 24 h is an independent risk factor for acute lung injury. {g}"], ["Chasing urine output", "Low intraoperative urine output is expected. High urine output is itself a risk marker.", "Do not give fluid to push urine output above 0.5 mL/kg/h. Infusion of 2–3 mL/kg/h is not associated with kidney injury. Use vasopressors for pressure. Exclude bleeding if hypotension persists. {g}"], ["Standard chest drain management after pneumonectomy", "Suction on the empty hemithorax shifts the mediastinum.", "Follow the surgeon's specific instruction for the pneumonectomy drain. Never apply routine suction. {e}"]]}]}], "physIntro": "Physiology explains the pitfalls and the crises. Each topic ends with a key point to apply in theatre.", "physiology": [{"id": "p1", "code": "P1", "title": "From awake to open chest: ventilation and perfusion", "blocks": [{"t": "p", "x": "Oxygenation during thoracic surgery depends on how four events change the match between ventilation (V) and perfusion (Q): induction of anaesthesia, lateral positioning, opening the chest, and one-lung ventilation. Each event is described below in the order it happens. {e}"}, {"t": "table", "head": ["Stage", "Ventilation", "Perfusion", "Consequence"], "rows": [["Awake, lateral", "Dependent lung is better ventilated: its alveoli are more compliant and its hemidiaphragm is pushed higher, so it contracts more efficiently.", "Dependent lung receives more blood by gravity.", "V/Q stays matched. {e}"], ["Anaesthetised, paralysed, lateral", "FRC falls 15–20% after induction. In the lateral position dependent-lung FRC falls about 35% (abdominal contents, mediastinal weight, bean bag). Ventilation shifts to the non-dependent lung.", "Dependent lung still receives more blood (about 60% of pulmonary flow).", "Mismatch: the lung that is ventilated is not the lung that is perfused. {g}"], ["Open chest, one-lung ventilation", "All ventilation goes to the dependent lung.", "The collapsed non-dependent lung is still perfused; HPV and surgical manipulation reduce its flow to about 20%.", "Dependent-lung V/Q improves; a large right-to-left shunt appears through the collapsed lung. {g}"]]}, {"t": "h", "x": "Position changes the shunt", "dont": false}, {"t": "ul", "items": ["Lateral decubitus gives the least shunt of all positions, because gravity sends blood to the ventilated lung. Adding reverse Trendelenburg accentuates this. {e}", "Supine one-lung ventilation (sympathectomy, chest-wall resection) gives more shunt: gravity no longer diverts blood from the collapsed lung. {e}", "Prone one-lung ventilation (some oesophagectomies) improves compliance but gives more shunt than lateral. {e}"]}, {"t": "say", "x": "Anticipate worse oxygenation when one-lung ventilation is done supine or prone, and when the right lung is collapsed."}]}, {"id": "p2", "code": "P2", "title": "Shunt during one-lung ventilation, in numbers", "blocks": [{"t": "p", "x": "Shunt is blood that passes through the lungs without meeting ventilated alveoli. It returns to the left heart with venous oxygen content. Raising FiO₂ does not oxygenate shunted blood, which is why a large shunt resists 100% oxygen. {e}"}, {"t": "h", "x": "The textbook arithmetic", "dont": false}, {"t": "ol", "items": ["In the lateral position the non-dependent lung receives about 40% of cardiac output, of which about 5% is anatomical shunt.", "Lung collapse and hypoxic pulmonary vasoconstriction halve the remaining flow: 35% ÷ 2 = 17.5%.", "Add anatomical shunt from both lungs (5% + 5% = 10%).", "Total shunt ≈ 27.5% of cardiac output, which gives a PaO₂ of about 150 mmHg on FiO₂ 1.0."]}, {"t": "p", "x": "The model is a simplified approximation from the textbook, not a patient-specific prediction. Use it to see which factor moves the shunt most. {e}"}, {"t": "calc", "name": "shunt"}, {"t": "h", "x": "Factors that change the shunt", "dont": false}, {"t": "ul", "items": ["**Side.** The right lung is larger and receives about 10% more cardiac output, so collapsing it produces more shunt. {e}", "**Cardiac output.** Restoring a low output improves oxygenation. A supranormal output raises mixed venous PO₂, weakens HPV and increases shunt. {e}", "**Surgery.** Ligation of pulmonary vessels reduces shunt. Retraction raises vascular resistance in the operative lung, but released vasoactive substances can oppose HPV. {e}", "**Ventilated-lung problems.** High airway pressure, auto-PEEP and low FiO₂ raise vascular resistance in the ventilated lung and push blood into the collapsed lung. {e}"]}]}, {"id": "p3", "code": "P3", "title": "Hypoxic pulmonary vasoconstriction (HPV)", "blocks": [{"t": "p", "x": "Hypoxic pulmonary vasoconstriction is the constriction of small pulmonary arteries supplying poorly oxygenated lung. A low alveolar PO₂ raises intracellular calcium in vascular smooth muscle, which contracts. The reflex diverts blood towards ventilated lung and is the reason one-lung ventilation is tolerated. {e}"}, {"t": "ul", "items": ["The response is proportional to the degree of hypoxia and to the amount of hypoxic lung. It is maximal when 30–70% of the lung is hypoxic. {e}", "It is biphasic: the early phase begins within seconds and peaks 20–30 minutes after OLV starts; the delayed phase peaks over the next 2 hours. {e}", "It reduces flow to the non-ventilated lung by about 40–50%. {g}"]}, {"t": "table", "head": ["Enhance HPV", "Inhibit HPV (worse shunt)"], "rows": [["Hypoxia", "Volatile anaesthetics at high concentration"], ["Acidosis", "Alkalosis"], ["Hypercapnia", "Hypocapnia"], ["Vasoconstrictors (but see cardiac-output effect)", "Vasodilators: nitroprusside, GTN, calcium-channel blockers, β-agonists, dobutamine"], ["—", "Pulmonary infection; very high or very low pulmonary artery pressure; very high or very low mixed venous PO₂"]]}, {"t": "h", "x": "Clinical relevance of anaesthetic drugs", "dont": false}, {"t": "ul", "items": ["Volatile agents attenuate HPV by about 15–20% at 1 MAC (isoflurane). The feared fall in oxygenation was not borne out in clinical trials. {g}", "Volatiles attenuate lung inflammation compared with propofol; whether this reduces postoperative complications is inconsistent. {o}", "Almitrine, inhaled nitric oxide and prostaglandin E₁ have been studied to manipulate HPV; none is established in routine practice. {g}"]}, {"t": "say", "x": "Keep the patient normocapnic, avoid alkalosis, and look for a vasodilator infusion when oxygenation worsens unexpectedly."}]}, {"id": "p4", "code": "P4", "title": "Lung collapse and atelectasis: good, bad and ugly", "blocks": [{"t": "p", "x": "Atelectasis is collapse of alveoli. During thoracic surgery it has three faces: the collapse wanted in the operative lung, the collapse to avoid in the ventilated lung, and the collapse that persists into the postoperative period. {g}"}, {"t": "table", "head": ["Type", "Where", "Mechanism", "What controls it"], "rows": [["Good", "Operative lung, before incision", "Absorption: oxygen is taken up quickly, nitrogen slowly. A lung filled with oxygen empties by absorption. Closed-chest OLV creates negative pressure in the isolated lung.", "FiO₂ 1.0 before isolation; keep the isolated lumen closed until the pleura opens (median 24 vs 54 min to collapse). {g}"], ["Bad", "Ventilated (dependent) lung", "Compression by mediastinum and abdomen; absorption at high FiO₂; surfactant disturbance with large tidal volumes (less important).", "PEEP titration, recruitment, then moderate FiO₂ (about 0.4–0.5 if tolerated). {g}"], ["Ugly", "Both lungs, after surgery", "Persisting atelectasis triggers an inflammatory cascade that leads to postoperative pulmonary complications (7–49%, mortality 2–12%).", "Re-expansion at the end, adequate analgesia, cough, early mobilisation. {g}"]]}, {"t": "p", "x": "Recruitment with FiO₂ 1.0 is followed by rapid reappearance of atelectasis compared with FiO₂ 0.4, because oxygen-filled alveoli collapse again by absorption. The study was in two-lung ventilation; its application to OLV is inferred. {o}"}, {"t": "say", "x": "Oxygen collapses lungs. Use that fact on purpose in the operative lung, and avoid it in the ventilated one."}]}, {"id": "p5", "code": "P5", "title": "Ventilator-induced lung injury during OLV", "blocks": [{"t": "p", "x": "A single ventilated lung receives the whole minute ventilation, so it is exposed to four injury mechanisms at once. Lung injury has been found in up to 33% of patients after major surgery under general anaesthesia. {g}"}, {"t": "table", "head": ["Mechanism", "Cause", "Protection"], "rows": [["Volutrauma", "Large tidal volume overdistends alveoli.", "Tidal volume 4–6 mL/kg ideal body weight during OLV. {g}"], ["Barotrauma", "High airway pressure.", "Limit plateau and driving pressure. {e}"], ["Atelectrauma", "Cyclic opening and closing of alveoli causes shear stress.", "PEEP restores FRC and stabilises alveoli. {e}"], ["Biotrauma", "Inflammatory mediators released by the above; high FiO₂ is implicated.", "Lowest FiO₂ that keeps saturation safe. {g}"]]}, {"t": "h", "x": "Driving pressure", "dont": false}, {"t": "p", "x": "Driving pressure (ΔP) is plateau pressure minus PEEP. It equals tidal volume divided by respiratory-system compliance (ΔP = V<sub>T<\/sub> / C<sub>RS<\/sub>). It expresses tidal volume relative to the lung that is actually open. Titrating PEEP to the lowest driving pressure, or to the best dynamic compliance, is recommended over a fixed value. {g}"}, {"t": "p", "x": "The textbook suggests PEEP 5–10 cmH₂O with low tidal volume during OLV; the atelectasis review recommends individual titration. Both approaches are in use. {o}"}, {"t": "h", "x": "Intrinsic PEEP (auto-PEEP)", "dont": false}, {"t": "p", "x": "Intrinsic PEEP is gas trapped at end-expiration because the lung does not empty before the next breath. It raises plateau pressure, reduces venous return and makes the effect of added PEEP unpredictable. {e}"}, {"t": "ul", "items": ["Airway inflammation and mucus plugs (dynamic obstruction).", "Increased lung compliance, as in emphysema.", "High tidal volume or short expiratory time.", "Resistance of the double-lumen tube."]}, {"t": "h", "x": "The collapsed lung is also injured", "dont": false}, {"t": "p", "x": "The operative lung undergoes ischaemia–reperfusion when it is re-expanded. Glycocalyx degradation increases vascular permeability; sevoflurane may attenuate this in experimental work. {o}"}]}, {"id": "p6", "code": "P6", "title": "The right ventricle and pulmonary circulation", "blocks": [{"t": "p", "x": "The right ventricle (RV) pumps into a low-resistance, high-compliance circuit. Pulmonary vascular resistance (PVR) is about one-tenth to one-eighth of systemic resistance. The RV tolerates volume well and tolerates a sudden rise in afterload poorly. {e}"}, {"t": "p", "x": "By the Hagen–Poiseuille law, R = 8ηL / πr⁴: resistance is **inversely** proportional to the fourth power of vessel radius. Halving the radius of a small pulmonary artery raises its resistance sixteen-fold, so small changes in calibre produce large changes in PVR. Alveolar and pleural pressures are transmitte
