  CHANGELOG
  v1.2 (Nov 2026)
    UI: section tabs (All, Name, Uses, Contra, Dose, ADR) now show only the chosen section on the
    drug page and a one-line preview in the list; drug names always match in every tab. Layout:
    no sideways scrolling on phone, tablet or PC (dose table stacks into cards in narrow panes via
    container queries with a viewport fallback; group filter capped to screen width; long text
    wraps); compact phone header in drug view; short tab labels on phones; PC mode falls back to
    single pane below 640 px; dvh height for mobile browser toolbars; larger touch targets.
  v1.1 (Nov 2026)
    Dosing and preparation: etomidate (child vs elderly; formulation limits); cisatracurium and
    vecuronium paediatric doses; propofol lignocaine admixture and handling limits; IV lignocaine
    infusion (Foo 2021); heparin/enoxaparin neuraxial timing by dose, renal function and catheter;
    dantrolene brand-specific reconstitution and EMHG/MHAUS crisis regimens; D25 (no glucose delay
    for thiamine; equivalent volumes); magnesium dilution; diclofenac buffered infusion; ketamine
    dilution; neuraxial-product warnings (morphine, fentanyl, PF lignocaine); pheniramine (Sanofi
    India PI); Sedaconda isoflurane; metoclopramide and pantoprazole limits; ropivacaine and
    bupivacaine maxima; DAS topical lignocaine; HHS insulin row; 3% saline correction limits;
    remifentanil, milrinone, levosimendan limits; suxamethonium hyperkalaemia timing; nasal and gel
    product separation; Plasma-Lyte, albumin and DDAVP contraindication classes; nitroprusside and
    furosemide monitoring/paediatric sourcing; complete LAST protocol on both lipid cards; paediatric
    licensing notes (desflurane, rocuronium, Gelofusine); nitrous oxide and salbutamol regimens.
    Evidence: SESAR (sevoflurane ICU sedation), BEST-Living (balanced fluids in TBI), BICARICU-2 and
    2026 IPD meta-analysis (bicarbonate), SPICE III qualification (dexmedetomidine), ranitidine
    FDA/CDSCO status, methylprednisolone excipients, RCUK/ERC 2025 vs AHA 2025 resuscitation doses,
    RCUK 2025 KCl arrest regimen.
    App: search matches acronyms and expansions and paediatric synonyms; neutral indication and
    adverse-effect group labels; per-card source link; GPL-3.0 attribution.
  v1.0 (Nov 2026): initial 100-drug compendium (96 master list + 4 reserve).
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anaesthesia & ICU Drug Compendium</title>
<meta name="author" content="Prof. Jyotirmay Kirtania">
<meta name="description" content="Anaesthesia and ICU drug compendium, v1.2 (Nov 2026). Licence: GPL-3.0.">
<link rel="license" href="https://www.gnu.org/licenses/gpl-3.0.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#13222B; --muted:#56666F; --line:#D5DDE2; --soft:#E9EEF0;
  --accent:#0A5E66; --accent-ink:#FFFFFF; --mark:#FFE58A; --warn-bg:#FFF4E0; --warn-ink:#6A4300; --warn-line:#E8B96A;
  --c-ind:#FFE100; --c-bzd:#FF8A1F; --c-opi:#7CCAE8; --c-nmb:#FF5A4E; --c-vas:#C6A6DB; --c-la:#A3AAAF; --c-ach:#A4D07A; --c-ae:#F7AE90; --c-oth:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1417; --surface:#141E22; --ink:#E4ECEF; --muted:#9AABB3; --line:#2A383E; --soft:#1B272C;
    --accent:#5FC2C9; --accent-ink:#06282B; --mark:#6B5A12; --warn-bg:#2E2412; --warn-ink:#F3D9A6; --warn-line:#7A5A22; --c-oth:#E4ECEF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1417; --surface:#141E22; --ink:#E4ECEF; --muted:#9AABB3; --line:#2A383E; --soft:#1B272C;
  --accent:#5FC2C9; --accent-ink:#06282B; --mark:#6B5A12; --warn-bg:#2E2412; --warn-ink:#F3D9A6; --warn-line:#7A5A22; --c-oth:#E4ECEF;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
button,input,select{font:inherit; color:inherit}
dd,td,p,li,.prose,.update,.nm,.sub{overflow-wrap:anywhere; word-break:normal}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}

/* Header */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line)}
.top-in{display:flex; gap:12px; align-items:center; padding:10px 16px; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; min-width:0; margin-right:auto}
.brand h1{font-size:18px; margin:0; line-height:1.2; letter-spacing:0}
.brand span{font-size:13px; color:var(--muted)}
.tools{display:flex; gap:8px; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{border:0; background:transparent; padding:6px 12px; cursor:pointer; font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.iconbtn{border:1px solid var(--line); background:transparent; border-radius:8px; padding:6px 10px; cursor:pointer; font-size:14px}
.searchrow{display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; align-items:center}
.search{flex:1 1 320px; position:relative; min-width:0}
.search input{width:100%; padding:10px 40px 10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg); font-size:16px}
.search input:focus{border-color:var(--accent); outline:none}
.search .clr{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:transparent; cursor:pointer; font-size:18px; color:var(--muted); padding:4px 8px}
.scope{display:flex; gap:6px; flex-wrap:wrap; min-width:0}
.scope-lab{font-size:13px; color:var(--muted); align-self:center; margin-right:2px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 13px; font-size:14px; cursor:pointer; min-height:36px; touch-action:manipulation}
.chip .sh{display:none}
@media (pointer:coarse){ .chip,.seg button,.iconbtn{min-height:40px} }
.chip[aria-pressed="true"]{border-color:var(--accent); background:var(--accent); color:var(--accent-ink)}
.filters{display:flex; gap:8px 14px; align-items:center; flex-wrap:wrap; font-size:14px; color:var(--muted); min-width:0; flex:1 1 260px}
.filters select{padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--surface); max-width:min(100%,420px); min-width:0; flex:1 1 200px; text-overflow:ellipsis}
.filters label{display:inline-flex; gap:6px; align-items:center; cursor:pointer}

/* Layout */
.wrap{display:grid; grid-template-columns:minmax(260px,clamp(260px,30vw,360px)) minmax(0,1fr); gap:0; max-width:1400px; margin:0 auto}
body.mobile .wrap{grid-template-columns:1fr}
.listpane{border-right:1px solid var(--line); background:var(--surface); height:calc(100vh - var(--hdr,150px)); height:calc(100dvh - var(--hdr,150px)); overflow-y:auto; overflow-x:hidden; position:sticky; top:var(--hdr,150px); -webkit-overflow-scrolling:touch; overscroll-behavior:contain}
body.mobile .listpane{height:auto; position:static; border-right:0}
.detail{padding:20px 28px 48px; min-width:0; container-type:inline-size; container-name:detail}
body.mobile .detail{padding:16px 14px 40px}
body.mobile.showdetail .listpane{display:none}
body.mobile:not(.showdetail) .detail{display:none}
.count{font-size:13px; color:var(--muted); padding:8px 16px; border-bottom:1px solid var(--soft)}
.grp{font-size:13px; color:var(--muted); padding:12px 16px 4px; font-weight:700}
.item{display:grid; grid-template-columns:10px 1fr auto; gap:10px; align-items:center; width:100%; text-align:left; border:0; background:transparent; padding:8px 16px 8px 0; cursor:pointer; border-bottom:1px solid var(--soft)}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft); box-shadow:inset 3px 0 0 var(--accent)}
.item .nm{font-size:15px; line-height:1.3}
.item .sub{display:block; font-size:12.5px; color:var(--muted)}
.item .pv{display:block; font-size:13px; color:var(--ink); margin-top:2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.item .pv b{color:var(--muted); font-weight:700}
.secnote{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:14px; color:var(--muted); margin:0 0 12px; max-width:960px}
.secnote button{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:4px 10px; cursor:pointer; color:var(--accent)}
.item .no{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.band{width:10px; align-self:stretch; border-right:1px solid var(--line)}
.empty{padding:24px 16px; color:var(--muted)}

/* ISO 26825 class bands */
.k-ind{background:var(--c-ind)} .k-bzd{background:var(--c-bzd)} .k-opi{background:var(--c-opi)} .k-nmb{background:var(--c-nmb)}
.k-vas{background:var(--c-vas)} .k-la{background:var(--c-la)} .k-ach{background:var(--c-ach)} .k-ae{background:var(--c-ae)} .k-oth{background:var(--c-oth)}
.k-hyp{background:repeating-linear-gradient(-45deg,var(--c-vas) 0 6px,#fff 6px 10px)}
.k-nmbx{background:repeating-linear-gradient(-45deg,var(--c-nmb) 0 6px,#fff 6px 10px)}
.k-opix{background:repeating-linear-gradient(-45deg,var(--c-opi) 0 6px,#fff 6px 10px)}
.k-bzdx{background:repeating-linear-gradient(-45deg,var(--c-bzd) 0 6px,#fff 6px 10px)}

/* Detail: the label strip is the signature element */
.label{display:grid; grid-template-columns:28px 1fr; border:1.5px solid var(--ink); border-radius:10px; overflow:hidden; background:var(--surface); margin-bottom:18px}
.label .band{width:auto; border-right:1.5px solid var(--ink)}
.label .lb{padding:14px 18px}
.label h2{margin:0; font-size:28px; line-height:1.15}
.label .cls{margin:4px 0 0; font-size:16px; color:var(--muted)}
.meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; font-size:13px}
.tag{border:1px solid var(--line); border-radius:6px; padding:2px 8px; color:var(--muted)}
.tag.live{border-color:var(--accent); color:var(--accent)}
.tag.res{border-color:var(--warn-line); color:var(--warn-ink); background:var(--warn-bg)}
.back{display:none; margin-bottom:12px}
body.mobile .back{display:inline-block}
section.blk{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; max-width:960px}
section.blk h3{margin:0 0 10px; font-size:17px; display:flex; gap:10px; align-items:baseline}
section.blk h3 .n{color:var(--muted); font-variant-numeric:tabular-nums; font-size:15px}
.kv{display:grid; grid-template-columns:170px 1fr; gap:6px 16px; margin:0}
.kv dt{color:var(--muted); font-size:14px}
.kv dd{margin:0}
body.mobile .kv{grid-template-columns:1fr; gap:2px}
body.mobile .kv dd{margin-bottom:8px}
.update{background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-line); border-radius:8px; padding:10px 12px; margin-top:12px; font-size:15px}
.prose{max-width:75ch; margin:0}
.dosewrap{max-width:100%}
table.dose{border-collapse:collapse; width:100%; table-layout:fixed; font-size:15px}
table.dose th,table.dose td{border-top:1px solid var(--line); padding:8px 10px; vertical-align:top; text-align:left}
table.dose th{font-size:13px; color:var(--muted); font-weight:700; border-top:0}
table.dose td:first-child,table.dose th:first-child{font-weight:700; width:18%}
/* Narrow pane: dose table becomes stacked cards; label/value lists become one column (no sideways scroll) */
@container detail (max-width: 760px){
  table.dose,table.dose tbody{display:block; width:100%}
  table.dose thead{display:none}
  table.dose tr{display:block; border-top:1px solid var(--line); padding:8px 0}
  table.dose td,table.dose td:first-child{display:block; border:0; padding:3px 0; width:auto}
  table.dose td[data-h]::before{content:attr(data-h); display:block; font-size:12.5px; color:var(--muted); font-weight:400}
}
@container detail (max-width: 560px){
  .kv{grid-template-columns:1fr; gap:2px}
  .kv dd{margin-bottom:8px}
  .label h2{font-size:23px}
}
@supports not (container-type:inline-size){
  @media (max-width:1200px){
    table.dose,table.dose tbody{display:block; width:100%}
    table.dose thead{display:none}
    table.dose tr{display:block; border-top:1px solid var(--line); padding:8px 0}
    table.dose td,table.dose td:first-child{display:block; border:0; padding:3px 0; width:auto}
    table.dose td[data-h]::before{content:attr(data-h); display:block; font-size:12.5px; color:var(--muted); font-weight:400}
  }
  @media (max-width:820px){ .kv{grid-template-columns:1fr; gap:2px} .kv dd{margin-bottom:8px} }
}
.sev-sae dd{font-weight:700}
.note{font-size:13.5px; color:var(--muted); max-width:960px; margin-top:20px}
.welcome{max-width:760px}
.welcome h2{font-size:24px; margin:4px 0 8px}
.legend{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px 14px; margin:12px 0; padding:0; list-style:none; font-size:14px}
.legend li{display:flex; gap:8px; align-items:center}
.legend i{display:inline-block; width:22px; height:14px; border:1px solid var(--line); border-radius:3px}
.srcline{margin:10px 0 0; font-size:14.5px}
.srcline a{color:var(--accent)}
.fn{font-size:13px; color:var(--muted); margin:8px 0 0}
.foot{font-size:13px; color:var(--muted); max-width:960px; margin-top:8px}
.foot a{color:var(--accent)}
.disc{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-top:16px}
@media (max-width:760px){
  .brand span{display:none}
  .top-in{padding:8px 12px; gap:8px}
  .brand h1{font-size:16px}
  .searchrow{padding:0 12px 8px; gap:6px}
  .chip{padding:5px 10px}
  .chip .lg{display:none} .chip .sh{display:inline}
  .scope-lab{display:none}
}
body.mobile.showdetail .top-in, body.mobile.showdetail .filters{display:none}
body.mobile.showdetail .searchrow{padding-top:8px}
body.mobile .label .lb{padding:10px 14px}
body.mobile .label{grid-template-columns:16px 1fr}
@media (max-width:420px){
  .scope{gap:4px; flex-wrap:nowrap; justify-content:space-between; width:100%}
  .chip{padding:5px 7px; font-size:13px; flex:1 1 auto; text-align:center}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
@media print{ .top,.listpane,.back{display:none!important} .wrap{display:block} }
</style>
</head>
<body>
<header class="top" id="hdr">
  <div class="top-in">
    <div class="brand"><h1>Anaesthesia & ICU Drug Compendium</h1><span>v1.2. Prof. Jyotirmay Kirtania, GPL-3.0, Nov 2026</span></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Layout">
        <button type="button" data-mode="auto" aria-pressed="false">Auto</button>
        <button type="button" data-mode="pc" aria-pressed="false">PC</button>
        <button type="button" data-mode="mobile" aria-pressed="false">Mobile</button>
      </div>
      <button type="button" class="iconbtn" id="theme" aria-label="Switch colour theme">Theme</button>
    </div>
  </div>
  <div class="searchrow">
    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search drug name, alias or clinical term ( / )" aria-label="Search drugs">
      <button class="clr" id="clr" type="button" aria-label="Clear search">×</button>
    </div>
    <div class="scope" role="tablist" aria-label="Show section">
      <span class="scope-lab">Show:</span>
      <button class="chip" type="button" role="tab" data-scope="all" aria-pressed="true" aria-selected="true"><span class="lg">Everything</span><span class="sh">All</span></button>
      <button class="chip" type="button" role="tab" data-scope="name" aria-pressed="false" aria-selected="false"><span class="lg">Name & class</span><span class="sh">Name</span></button>
      <button class="chip" type="button" role="tab" data-scope="ind" aria-pressed="false" aria-selected="false"><span class="lg">Indications</span><span class="sh">Uses</span></button>
      <button class="chip" type="button" role="tab" data-scope="ci" aria-pressed="false" aria-selected="false"><span class="lg">Contraindications</span><span class="sh">Contra</span></button>
      <button class="chip" type="button" role="tab" data-scope="dose" aria-pressed="false" aria-selected="false"><span class="lg">Dose</span><span class="sh">Dose</span></button>
      <button class="chip" type="button" role="tab" data-scope="ae" aria-pressed="false" aria-selected="false"><span class="lg">Adverse & interactions</span><span class="sh">ADR</span></button>
    </div>
    <div class="filters">
      <select id="grp" aria-label="Filter by group"><option value="">All groups</option></select>
      <label><input type="checkbox" id="res" checked> Reserve list</label>
    </div>
  </div>
</header>
<div class="wrap">
  <nav class="listpane" id="list" aria-label="Drug list"></nav>
  <main class="detail" id="detail" tabindex="-1"></main>
</div>
<script>
var DB = [{"id":"oxygen","ln":"1","g":"A. Medical gases","k":"oth","n":"Medical oxygen","al":"O2, LMO, liquid medical oxygen, VIE","c":"Medical gas; oxidising agent","f":"Compressed gas cylinders (99.5–100%); liquid medical oxygen via vacuum-insulated evaporator and pipeline; oxygen concentrators (93 ± 3%) where used","s":"UK SmPC (BOC / Air Liquide, EMC)","u":"Target ranges follow BTS emergency oxygen guidance: SpO2 94–98%, or 88–92% where hypercapnic failure is a risk.","m":"Raises alveolar and arterial PO2, which increases haemoglobin saturation and dissolved oxygen content. Corrects hypoxaemic hypoxia only. High FiO2 shortens carboxyhaemoglobin half-life from about 320 min (air) to about 80 min (FiO2 1.0) and about 20–30 min (hyperbaric oxygen).","i":["Hypoxaemia of any cause; pre-oxygenation; carrier gas for anaesthesia; carbon monoxide poisoning","Cluster headache (high-flow 100%); pneumothorax resolution; hyperbaric: decompression sickness, gas embolism, osteoradionecrosis, gas gangrene","Routine oxygen in normoxaemic myocardial infarction or stroke is not recommended"],"x":["None when hypoxaemia is present. Hyperbaric therapy: untreated pneumothorax","Risk of hypercapnic respiratory failure (COPD, obesity hypoventilation, neuromuscular disease): titrate to 88–92%. Bleomycin or paraquat exposure. Preterm neonates (retinopathy). Ignition sources and airway laser surgery (fire)"],"d":[["Acute hypoxaemia","Titrate to SpO2 94–98% (88–92% if hypercapnic risk). Nasal cannula 1–4 L/min; simple mask 5–10 L/min; non-rebreather 15 L/min; HFNO up to 60 L/min","Same targets; neonatal targets per unit protocol","No organ adjustment. Toxicity risk rises with FiO2 > 0.6 for > 24 h"],["Pre-oxygenation","FiO2 1.0 for ≥ 3 min tidal breathing, or until end-tidal O2 ≥ 0.9","Same",""],["Carbon monoxide poisoning","FiO2 1.0 via non-rebreather or tracheal tube until COHb < 3–5% and symptoms resolve; hyperbaric therapy per specialist","Same","Pregnancy: lower threshold for hyperbaric referral"]],"a":["Mucosal drying (humidify above 4 L/min for prolonged use)","Absorption atelectasis at high FiO2; hypercapnia in at-risk patients","Pulmonary oxygen toxicity after prolonged FiO2 > 0.6; CNS toxicity (seizures) during hyperbaric therapy; retinopathy of prematurity","Airway or patient fire; hypercapnic coma from uncontrolled oxygen","Bleomycin, amiodarone, nitrofurantoin and paraquat potentiate pulmonary toxicity"],"src":{"t":"Air Liquide manufacturer SPC portal","u":"https://uk.healthcare.airliquide.com/product-characteristics-medical-oxygen"}},
{"id":"nitrous-oxide","ln":"2","g":"A. Medical gases","k":"oth","n":"Medical nitrous oxide","al":"N2O, laughing gas, Entonox","c":"Inhalational anaesthetic adjunct; NMDA-antagonist analgesic","f":"Cylinders (liquid under pressure, 44 bar at 20 °C) and pipeline; premixed 50% N2O / 50% O2 (Entonox)","s":"UK SmPC (BOC, EMC)","u":"Sustainability pressure: NHS programmes decommission central N2O manifolds because of large leaks. GWP100 about 273.","m":"Antagonises NMDA receptors and releases endogenous opioid peptides in the periaqueductal grey. MAC about 104%. Blood:gas partition coefficient 0.47 gives rapid onset and offset. Produces second-gas and concentration effects. Oxidises vitamin B12 and inactivates methionine synthase.","i":["Carrier and adjunct in general anaesthesia (50–70%); analgesia in labour, procedures and trauma (Entonox)","Dental and paediatric procedural sedation","Treatment-resistant depression (research only)"],"x":["Pneumothorax; air embolism; bowel obstruction or distension; pneumocephalus; recent intraocular gas (SF6, C3F8); middle-ear graft surgery; decompression sickness or recent diving","Vitamin B12 or folate deficiency; MTHFR deficiency; first-trimester pregnancy; raised ICP; pulmonary hypertension; bullous lung disease"],"d":[["General anaesthesia adjunct","50–70% in oxygen (FiO2 ≥ 0.3)","Same",""],["Analgesia (Entonox)","Self-administered 50:50 via demand valve","Children able to self-administer","MHRA: continuous use > 24 h, or more often than every 4 days, needs close supervision and haematological monitoring. A local 6-h trigger is a conservative choice and must be labelled as local. B12-related neurological injury can follow a single exposure in B12-deficient patients"]],"a":["PONV (dose-related), dizziness","Expansion of air-filled spaces; diffusion hypoxia on discontinuation (give 100% O2 for 5–10 min)","Megaloblastic anaemia; subacute combined degeneration of the cord, especially with prolonged or recreational exposure","Myeloneuro {"id":"medical-air","ln":"3","g":"A. Medical gases","k":"oth","n":"Medical compressed air","al":"air, surgical air","c":"Medical gas","f":"Cylinders; compressor plant supplying pipeline at 4 bar (medical air) and 7 bar (surgical air)","s":"UK SmPC (BOC / Air Liquide)","u":"","m":"Supplies 21% O2 and 79% N2. Dilutes FiO2 and avoids N2O. Nitrogen splints alveoli and reduces absorption atelectasis compared with high FiO2.","i":["Diluent for FiO2 titration in anaesthesia and ventilation; nebuliser driving gas in hypercapnic patients","Driving gas for surgical tools (7 bar)","—"],"x":["None as a respiratory gas","Do not use as the sole gas in a hypoxaemic patient"],"d":[["Ventilation","Blend with oxygen to the target FiO2","Same","No adjustment"]],"a":["None specific","Hypoxaemia if used without oxygen enrichment","Contaminated supply (oil, water) from compressor plant","Wrong-gas connection","None"],"src":{"t":"Woikoski manufacturer SmPC, Finnish/Swedish, revised 17 Jan 2022","u":"https://www.woikoskimedical.fi/downloads/laakeilma-valmisteyhteenveto.pdf"}},
{"id":"isoflurane","ln":"4","g":"B. Volatile anaesthetics","k":"oth","n":"Isoflurane","al":"Forane, Sedaconda","c":"Halogenated ether volatile anaesthetic","f":"Liquid, 100 mL and 250 mL bottles; agent-specific vaporiser; isoflurane for the AnaConDa / Sedaconda anaesthetic conserving device (ICU)","s":"UK SmPC (EMC)","u":"Sedaconda (isoflurane for ICU sedation, AEMPS SmPC): indicated for mechanically ventilated adults and children ≥ 3 y via the Sedaconda anaesthetic conserving device. Licensing is jurisdiction-specific; Indian authorisation not verified.","m":"Potentiates GABA-A and glycine receptors; inhibits NMDA receptors; activates two-pore potassium channels. MAC 1.15% at age 40. Blood:gas 1.4. Dose-dependent vasodilatation and respiratory depression.","i":["Maintenance of general anaesthesia","ICU sedation via Sedaconda device (licensed in some European jurisdictions for ventilated patients ≥ 3 y); refractory status asthmaticus","Refractory status epilepticus"],"x":["Known or suspected malignant hyperthermia susceptibility; hypersensitivity; previous hepatitis after a halogenated agent","Raised ICP (keep ≤ 1 MAC with hyperventilation); severe hypovolaemia; myasthenia"],"d":[["Maintenance","0.5–2% inspired (about 1–1.3 MAC end-tidal); 0.5–0.75% with N2O","MAC is higher in infants (about 1.6–1.9%)","MAC falls about 6% per decade after 40 y; pregnancy reduces MAC"],["ICU sedation (Sedaconda device)","Start pump at 3 mL/h liquid; titrate to ventilation, measured end-tidal concentration and sedation target","3–17 y: start 2 mL/h; device placement and dead space differ in children (follow device instructions)","Active scavenging required. Limited experience beyond 48 h. Jurisdiction-specific licence"]],"a":["Hypotension; respiratory depression; airway irritation (cough, laryngospasm at gas induction); PONV; shivering","Tachycardia; arrhythmia; emergence agitation","Hepatitis; hyperkalaemia in myopathies","Malignant hyperthermia; carbon monoxide formation with desicc {"id":"sevoflurane","ln":"5","g":"B. Volatile anaesthetics","k":"oth","n":"Sevoflurane","al":"Sevorane, Ultane","c":"Halogenated ether volatile anaesthetic","f":"Liquid, 250 mL bottles; agent-specific vaporiser","s":"UK SmPC (EMC)","u":"SESAR (JAMA 2025; 687 patients): prolonged sevoflurane sedation in early moderate–severe ARDS gave fewer ventilator-free days and lower 90-day survival than propofol (47.1% vs 55.7%). Avoid routine ICU sedation with sevoflurane in this population; the result does not extrapolate to short intraoperative anaesthesia or to all isoflurane use. SmPC also carries QT-prolongation and peri-operative hyperkalaemia (myopathy) warnings.","m":"Same receptor actions as isoflurane. MAC 2.05% at age 40. Blood:gas 0.65. Non-pungent, so it suits inhalational induction. Degraded by CO2 absorbents to Compound A.","i":["Inhalational induction and maintenance of general anaesthesia","Difficult airway management with spontaneous ventilation. ICU sedation (device-based) is off-label for this product; avoid routine use in early moderate–severe ARDS (SESAR 2025: harm vs propofol)","Status asthmaticus"],"x":["Malignant hyperthermia susceptibility; hypersensitivity","Renal impairment with low fresh gas flow; congenital long QT; raised ICP"],"d":[["Induction","Up to 8% inspired in O2 ± N2O","Up to 8%. MAC: neonates 3.3%, infants 3.2%, children about 2.5%","Elderly MAC about 1.4–1.7%"],["Maintenance","0.5–3% inspired","Same range titrated","Linked SmPC: at fresh gas flow 1 to < 2 L/min, exposure should not exceed 2 MAC-hours; flow < 1 L/min is not recommended. A more conservative local low-flow policy must be labelled as local"]],"a":["Hypotension; PONV; cough; emergence agitation or delirium in children; bradycardia","Laryngospasm; agitation; hiccup","Seizure-like EEG activity (children, high concentration, hypocapnia); hepatitis; QT prolongation","Malignant hyperthermia; exothermic reaction with desiccated absorbent","As isoflurane; potentiates NMBAs"],"src":{ {"id":"desflurane","ln":"6","g":"B. Volatile anaesthetics","k":"oth","n":"Desflurane","al":"Suprane","c":"Halogenated ether volatile anaesthetic","f":"Liquid, 240 mL bottles; heated, pressurised vaporiser (Tec 6 type)","s":"UK SmPC (Suprane, EMC). Regulatory status checked live","u":"EU F-gas Regulation (EU) 2024/573 prohibits routine use from 1 January 2026, except where it is strictly required on medical grounds. NHS England has decommissioned routine use. GWP100 about 2,500.","m":"MAC 6% at age 40. Blood:gas 0.42, the fastest washout of the volatile agents. Pungent: irritates the airway. Rapid increases in concentration cause sympathetic stimulation.","i":["Maintenance of general anaesthesia in adults; maintenance in children after IV induction","Long or bariatric cases where rapid emergence is the priority","—"],"x":["Mask induction in children (laryngospasm, cough, breath-holding); malignant hyperthermia susceptibility; hypersensitivity","Coronary artery disease (tachycardia with rapid increases); raised ICP"],"d":[["Maintenance","2.5–8.5% with or without N2O","Labelled paediatric use: maintenance only, in intubated children after induction with another agent; non-intubated maintenance is not equivalent","Increase in steps of ≤ 1% to avoid tachycardia and hypertension"]],"a":["Airway irritation, cough, breath-holding, laryngospasm; PONV; tachycardia and hypertension with rapid increases","Emergence agitation","Hepatitis","Malignant hyperthermia; carbon monoxide with desiccated absorbent (highest of the volatile agents)","As isoflurane"],"src":{"t":"Suprane US PI","u":"https://dailymed.nlm.nih.gov/dailymed/fda/fdaDrugXsl.cfm?setid=a3e4c8e5-bff0-4a8f-8401-e9866c846ee2&type=display"}},

{"id":"ketamine","ln":"9","g":"C. IV induction agents","k":"ind","n":"Ketamine","al":"Ketalar, Ketmin","c":"Phencyclidine derivative; NMDA-antagonist dissociative anaesthetic","f":"10 mg/mL, 50 mg/mL and 100 mg/mL racemic solution","s":"UK SmPC (Ketalar, EMC)","u":"Current SmPC carries misuse, dependence and urological toxicity (ketamine cystitis) warnings.","m":"Non-competitive NMDA-receptor antagonism. Inhibits catecholamine reuptake, producing sympathomimetic effects. Breathing and airway reflexes are often relatively maintained, but apnoea, laryngospasm, vomiting and aspiration can occur: ketamine does not secure or reliably protect the airway. Bronchodilator.","i":["Induction in haemodynamic instability or shock; procedural sedation and analgesia; sub-anaesthetic analgesia","Status asthmaticus; burns dressings; refractory status epilepticus","Opioid-sparing infusion; treatment-resistant depression; neuropathic pain"],"x":["Patients in whom a rise in blood pressure is a serious hazard (severe hypertension, aneurysm); eclampsia or pre-eclampsia (SmPC); hypersensitivity","Ischaemic heart disease; psychosis; porphyria; hyperthyroidism; alcohol intoxication. The SmPC lists cerebral trauma; current evidence does not support avoidance in ventilated TBI patients"],"d":[["Induction IV","1–2 mg/kg (shock: 0.5–1 mg/kg)","1–2 mg/kg","Dilute Ketalar 100 mg/mL before IV use (product-specific); give induction slowly (over about 60 s). Elderly: lower doses. Hepatic impairment: reduce infusions"],["Induction IM","6.5–13 mg/kg (SmPC); 4–10 mg/kg in practice","4–5 mg/kg for sedation",""],["Analgesia","0.1–0.3 mg/kg IV bolus; 0.1–0.2 mg/kg/h infusion","0.1–0.2 mg/kg/h",""],["Procedural sedation","0.5–1 mg/kg IV","1–1.5 mg/kg IV; 4 mg/kg IM",""]],"a":["Emergence phenomena (hallucinations, vivid dreams; reduced by a benzodiazepine); hypertension; tachycardia; hypersalivation; nystagmus","Laryngospasm; increased muscle tone; nausea","Anaphylaxis; respiratory depression after rapid bo {"id":"etomidate","ln":"10","g":"C. IV induction agents","k":"ind","n":"Etomidate","al":"Etomidate-Lipuro, Hypnomidate","c":"Imidazole IV hypnotic","f":"2 mg/mL, 10 mL ampoules: lipid emulsion (Etomidate-Lipuro; contains soya oil) or solution in propylene glycol (Hypnomidate). Age limits and excipients differ by formulation","s":"UK SmPC (EMC)","u":"","m":"Positive allosteric modulator of GABA-A receptors (β2/β3 subunits). Minimal cardiovascular depression. Inhibits 11β-hydroxylase, suppressing adrenocortical synthesis for 6–24 h after a single dose.","i":["Induction in cardiovascular instability","Rapid sequence induction in shock (alternative to ketamine)","Control of hypercortisolism by low-dose infusion (specialist)"],"x":["Hypersensitivity; maintenance by infusion (adrenal suppression). Lipid emulsion: soya or peanut hypersensitivity. Formulation-specific age restriction: check whether the stocked product excludes infants ≤ 6 months","Sepsis or adrenal insufficiency (consider hydrocortisone); porphyria; epilepsy (myoclonus)"],"d":[["Induction","0.3 mg/kg IV over 30–60 s (usual reference), titrated to response","Children < 15 y: 0.3 mg/kg; a supplementary dose of up to 30% of the normal adult dose may be needed (SmPC)","Elderly: 0.15–0.2 mg/kg. Cirrhosis: reduce dose"]],"a":["Myoclonus (reduced by opioid or midazolam pre-treatment); injection pain (less with lipid formulation); PONV","Hiccup; cough; apnoea","Anaphylaxis","Adrenocortical suppression (6–24 h after a single dose; link to mortality in sepsis remains debated)","Additive CNS depression; verapamil potentiates"],"src":{"t":"EMC SmPC","u":"https://www.medicines.org.uk/emc/product/15214/smpc"}},

{"id":"dexmedetomidine","ln":"12","g":"D. Sedatives","k":"oth","n":"Dexmedetomidine","al":"Dexdor, Precedex, dexmed","c":"Selective α2-adrenoceptor agonist","f":"100 mcg/mL concentrate (2, 4, 10 mL); 4 mcg/mL ready-to-use","s":"EU/UK SmPC (Dexdor and generics). Safety update checked live","u":"2022 SmPC warning (SPICE III): increased 90-day mortality in ventilated ICU patients aged ≤ 65 y compared with alternative sedatives (OR 1.26, 95% CrI 1.02–1.56). The effect was most marked in non-postoperative admissions, with higher APACHE II scores and with decreasing age. Mechanism unknown. SmPC qualification: SPICE III showed no overall mortality difference; the signal was most evident with early high-dose use to achieve deep sedation in sicker non-postoperative admissions and was not detectable with light sedation. This does not prove absence of risk in every younger patient.","m":"Central α2A agonism in the locus coeruleus produces arousable sedation resembling natural sleep. Spinal α2 action gives analgesia. Sympatholysis reduces heart rate and blood pressure; a loading dose can raise blood pressure transiently (peripheral α2B).","i":["ICU sedation to RASS 0 to −3 (licensed); sedation of non-intubated adults for procedures (licensed)","Awake fibreoptic intubation; management of agitated delirium","Adjunct to local anaesthetic (perineural, intrathecal); prevention of emergence delirium in children; opioid-sparing intraoperative infusion"],"x":["Advanced heart block (2nd or 3rd degree) unless paced; uncontrolled hypotension; acute cerebrovascular conditions; hypersensitivity","Bradycardia; hypovolaemia; severe hepatic impairment; ventilated ICU patients ≤ 65 y (mortality warning); spinal cord injury; need for deep sedation"],"d":[["ICU sedation","Start 0.7 mcg/kg/h; titrate 0.2–1.4 mcg/kg/h. No loading dose (SmPC)","Not licensed < 18 y (off-label 0.2–1 mcg/kg/h)","Hepatic impairment: reduce. Elderly: lower doses. Renal: no adjustment"],["Procedural sedation","Load 1 mcg/kg over 10 min (0.5 mcg/kg for minor procedures), then 0.6–0.7 mcg/kg/h (range 0.2–1 mcg/kg/h)","Off-label","Awake fibreoptic intubation: 1 mcg/kg over 10 min, then 0.7 mcg/kg/h"]],"a":["Hypotension; bradycardia; hypertension during loading; nausea; dry mouth","Hyperglycaemia or hypoglycaemia; agitation; withdrawal after > 24 h","Sinus arrest; AV block; polyuria; hyperthermia","Profound bradycardia or asystole (vagal stimulation); increased mortality in ICU patients ≤ 65 y","Additive with anaesthetics, opioids and sedatives; beta-blockers and digoxin increase bradycardia"],"src":{"t":"EMC SmPC","u":"https://www.medicines.org.uk/emc/product/13640/smpc"}},

{"id":"sugammadex","ln":"25","g":"H. Reversal agents and anticholinergics","k":"nmbx","n":"Sugammadex","al":"Bridion","c":"Selective relaxant binding agent (modified γ-cyclodextrin)","f":"100 mg/mL; 2 mL (200 mg) and 5 mL (500 mg) vials","s":"UK SmPC (Bridion, EMC, updated May 2025); EU EPAR. Checked live","u":"Paediatric indication extended to routine reversal of rocuronium from birth to 17 y (CHMP December 2024; EC January 2025). Obese patients, including BMI ≥ 40: dose on actual body weight.","m":"Encapsulates rocuronium (highest affinity) and vecuronium 1:1, removing them from the neuromuscular junction. The complex is excreted renally.","i":["Routine reversal of rocuronium or vecuronium block (adults); immediate reversal after rocuronium (adults); routine reversal of rocuronium (birth to 17 y)","Rescue in can't-intubate scenarios after rocuronium RSI","Adjunct in rocuronium anaphylaxis (unproven)"],"x":["Hypersensitivity","Severe renal impairment (CrCl < 30: not recommended); coagulopathy or anticoagulants (transient aPTT/PT prolongation); hormonal contraceptives (equivalent to a missed dose: use extra contraception for 7 days); pregnancy"],"d":[["Routine reversal","2 mg/kg at reappearance of T2; 4 mg/kg at 1–2 post-tetanic counts","Rocuronium, birth to 17 y: 2 mg/kg at T2; 4 mg/kg at 1–2 PTC","Dose on actual body weight. CrCl < 30: not recommended"],["Immediate reversal","16 mg/kg (e.g. 3 min after rocuronium 1.2 mg/kg)","Not investigated",""],["Recurrence of block","Repeat 4 mg/kg","—","Re-blockade after routine reversal: rocuronium 1.2 mg/kg after 5 min; rocuronium 0.6 mg/kg or vecuronium 0.1 mg/kg after 4 h"]],"a":["Cough; airway complications of anaesthesia; procedural hypotension; nausea","Dysgeusia; bradycardia","Anaphylaxis (higher risk at 16 mg/kg); marked bradycardia or cardiac arrest within minutes; laryngospasm; recurrence of block","Anaphylaxis; bradycardia progressing to asystole","Hormonal contraceptives (reduced exposure); toremifene, fusidic ac {"id":"glycopyrrolate","ln":"26","g":"H. Reversal agents and anticholinergics","k":"ach","n":"Glycopyrrolate","al":"glycopyrronium, Robinul, Pyrolate","c":"Quaternary antimuscarinic","f":"0.2 mg/mL ampoules (1 mL, 3 mL)","s":"UK SmPC (EMC)","u":"","m":"Competitive muscarinic antagonist. Quaternary structure: does not cross the blood–brain barrier, so it causes no central effects.","i":["Antisialagogue premedication; bradycardia during anaesthesia; with neostigmine for reversal","Secretions and drooling in palliative care","—"],"x":["Angle-closure glaucoma; myasthenia (except with neostigmine); paralytic ileus; pyloric stenosis; obstructive uropathy; hypersensitivity","Tachyarrhythmia; heart failure; thyrotoxicosis; fever; ulcerative colitis; renal impairment"],"d":[["Antisialagogue","200–400 mcg IV / IM (4–5 mcg/kg, max 400 mcg)","4–8 mcg/kg (max 200 mcg)","Renal impairment: accumulates; reduce dose or extend interval"],["Bradycardia","200–400 mcg IV","4–8 mcg/kg",""],["With neostigmine","10–15 mcg/kg with neostigmine 50 mcg/kg","10 mcg/kg",""]],"a":["Dry mouth; tachycardia; urinary retention; reduced sweating","Arrhythmia; blurred vision","Anaphylaxis; hyperthermia","Tachyarrhythmia","Additive antimuscarinic effects with antihistamines, TCAs and phenothiazines; opposes metoclopramide"],"src":{"t":"EMC SmPC","u":"https://www.medicines.org.uk/emc/product/3389/smpc"}},
{"id":"atropine","ln":"27","g":"H. Reversal agents and anticholinergics","k":"ach","n":"Atropine","al":"atropine sulphate","c":"Tertiary antimuscarinic","f":"0.6 mg/mL ampoules; prefilled syringes 1 mg/10 mL and 3 mg/10 mL","s":"UK SmPC (EMC); RCUK ALS 2021","u":"Resuscitation pathways differ: RCUK/ERC 2025 uses 500 mcg; AHA 2025 uses 1 mg. Both cap the total at 3 mg. Display the locally selected pathway as default and name it.","m":"Competitive muscarinic antagonist. Crosses the blood–brain barrier, so it can cause central anticholinergic effects.","i":["Symptomatic bradycardia; antisialagogue; adjunct to anticholinesterase reversal","Organophosphate or carbamate poisoning; muscarinic mushroom poisoning","—"],"x":["None in emergencies. For elective use: angle-closure glaucoma, myasthenia, paralytic ileus, prostatic obstruction","Tachyarrhythmia; heart failure; thyrotoxicosis; fever in children; elderly (central anticholinergic syndrome); denervated transplanted heart (ineffective)"],"d":[["Bradycardia","RCUK/ERC 2025: 500 mcg IV, repeat every 3–5 min to max 3 mg. AHA 2025: 1 mg IV every 3–5 min to max 3 mg","20 mcg/kg (max single dose 600 mcg)","Adult doses below 0.5 mg can cause paradoxical bradycardia"],["Premedication","300–600 mcg IV / IM","20 mcg/kg",""],["Organophosphate poisoning","1–2 mg IV, doubling every 5 min until secretions dry, HR > 80/min and SBP > 80 mmHg; then infuse 10–20% of the loading dose per hour","20–50 mcg/kg, doubling","Watch for atropine toxicity (delirium, hyperthermia, ileus)"]],"a":["Dry mouth; tachycardia; mydriasis; blurred vision; urinary retention","Confusion; flushing","Ventricular arrhythmia; acute angle-closure glaucoma","Central anticholinergic syndrome (treat with physostigmine where available)","Additive antimuscarinic drugs; delays absorption of oral drugs"],"src":{"t":"AHA 2025 / RCUK 2025; emergency-pathway comparison","u":"https://cpr.heart.org/-/media/CPR-Files/CPR-Guidelines-Files/2025-Accessible/Algorithm-ACLS-Bradycar {"id":"lignocaine-2","ln":"28","g":"I. Local anaesthetics","k":"la","n":"Lignocaine 2% injection","al":"lidocaine, Xylocaine, lignocaine 2%","c":"Amide local anaesthetic; class Ib antiarrhythmic","f":"20 mg/mL: 30 mL multidose vial with preservative (methylparaben, India); 5 mL ampoules; 1% (10 mg/mL) also available","s":"UK SmPC (EMC); Indian PI","u":"","m":"Blocks voltage-gated sodium channels from inside the pore (use-dependent). pKa 7.9 gives fast onset and intermediate duration. Hepatic CYP1A2/3A4 metabolism to active MEGX.","i":["Infiltration; peripheral nerve block; topical use; reducing propofol injection pain","Ventricular arrhythmia (use preservative-free product only)","—"],"x":["Amide hypersensitivity; complete heart block; preserved multidose vials for IV, neuraxial or IV regional use","Hepatic impairment; heart failure; elderly; epilepsy; porphyria; bradycardia; hypovolaemia"],"d":[["Infiltration / nerve block","Plain: max 200 mg (about 3 mg/kg) per UK SmPC","3 mg/kg","Reduce in hepatic failure, heart failure, elderly. Count all lignocaine given by any route"]],"a":["Hypotension; bradycardia","Paraesthesia; dizziness; tinnitus","Methaemoglobinaemia; allergy (often to paraben preservative)","Local anaesthetic systemic toxicity (LAST): perioral numbness and tinnitus progress to seizures, arrhythmia and cardiovascular collapse","Beta-blockers and cimetidine reduce clearance; additive with other local anaesthetics; amiodarone"],"src":{"t":"EMC SmPC","u":"https://www.medicines.org.uk/emc/product/15149/smpc"}},
{"id":"lignocaine-pf","ln":"29","g":"I. Local anaesthetics","k":"la","n":"Lignocaine 2% preservative-free, 50 mL vial","al":"lidocaine infusion, PF lignocaine, IV lidocaine","c":"Amide local anaesthetic; class Ib antiarrhythmic","f":"20 mg/mL preservative-free, 50 mL vial (India). UK equivalent: 2% preservative-free ampoules or prefilled syringes","s":"Indian PI; UK SmPC for preservative-free lignocaine","u":"Analgesic infusion follows the 2021 UK consensus (Foo et al., Anaesthesia 2021). A Chinese perioperative consensus (Bo et al., 3 Nov 2026) permits 1.5–2 mg/kg/h; adopt only by local decision and cite separately. Exact Indian 50 mL product (excipients, single- or multidose, permitted routes) unresolved.","m":"Sodium channel blockade. Systemic infusion is anti-hyperalgesic, anti-inflammatory and speeds return of bowel function. Antiarrhythmic via use-dependent block in ischaemic tissue.","i":["Ventricular tachyarrhythmia (alternative to amiodarone); attenuation of the intubation response (1.5 mg/kg); IV lignocaine infusion for opioid-sparing analgesia (off-label)","IV regional anaesthesia (diluted to 0.5%) and epidural or neuraxial use, only with a product labelled for that route","Chronic neuropathic pain infusion; postoperative ileus reduction"],"x":["Amide hypersensitivity; complete heart block or sinoatrial disease without pacing; Adams–Stokes syndrome; severe myocardial depression","Hepatic impairment (prolonged half-life); heart failure; elderly; epilepsy. Preservative-free status alone does not establish suitability for neuraxial or IV regional use"],"d":[["Ventricular arrhythmia","1–1.5 mg/kg IV; repeat 0.5–0.75 mg/kg (max 3 mg/kg); infusion 1–4 mg/min","1 mg/kg, then 20–50 mcg/kg/min","Heart failure or hepatic disease: halve the infusion"],["Analgesic infusion (off-label; Foo 2021 UK consensus)","Loading ≤ 1.5 mg/kg ideal body weight over 10 min; infusion ≤ 1.5 mg/kg/h (IBW), maximum 120 mg/h; ordinarily ≤ 24 h. Dedicated, monitored infusion line","Specialist","Separate from nerve or fascial-plane blocks by ≥ 4 h; no concurrent regional local anaesthetic. Continuation beyond 24 h only after consultant or pain-team reassessment under the institutional protocol (plasma levels alone are not sufficient). Stop at any sign of LAST"],["IV regional anaesthesia","0.5% solution, 3 mg/kg (max 200 mg)","—","Keep tourniquet inflated ≥ 20 min. Use only a sterile preservative-free formulation suitable for the proposed IV regional route; verify the exact product. Some injection products contain preservatives and their PI prohibits epidural or intrathecal use."]],"a":["Hypotension; bradycardia","Paraesthesia; dizziness; tinnitus","Methaemoglobinaemia; allergy","LAST: seizures, arrhythmia, cardiovascular collapse","Beta-blockers and cimetidine reduce clearance; additive with other local anaesthetics; amiodarone"],"src":{"t":"Foo 2021 / Bo 2026; exact Indian 50 mL vial unresolved","u":"https://associationofanaesthetists-publications.onlinelibrary.wiley.com/doi/10.1111/anae.15270"}},

{"id":"txa","ln":"65","g":"O. Haemostasis, anticoagulation and obstetric","k":"oth","n":"Tranexamic acid","al":"TXA, Cyklokapron, Pause","c":"Antifibrinolytic (lysine analogue)","f":"100 mg/mL ampoules (5 mL, 10 mL)","s":"UK SmPC (EMC); UK DHPC April 2026 (MHRA-agreed). Checked live","u":"EMA review (October 2025) and UK DHPC (April 2026): intrathecal, epidural, intraventricular and intracerebral use is contraindicated. Serious and fatal reactions followed mix-ups with injectable local anaesthetics. Label syringes 'IV only' and store separately from local anaesthetics. The FDA added a boxed warning (2025).","m":"Blocks lysine-binding sites on plasminogen, preventing its binding to fibrin and inhibiting fibrinolysis.","i":["Trauma haemorrhage within 3 h of injury (CRASH-2); postpartum haemorrhage (WOMAN); reduction of surgical blood loss (orthopaedic, cardiac, obstetric)","Menorrhagia; hereditary angioedema; dental extraction in haemophilia","Traumatic brain injury (CRASH-3: mild–moderate TBI within 3 h); topical use"],"x":["Intrathecal, epidural, intraventricular or intracerebral routes; active arterial or venous thromboembolism; history of convulsions; DIC with predominant activation of coagulation; severe renal impairment; hypersensitivity","Renal impairment; haematuria (ureteric clot); previous VTE; oral contraceptives; colour vision disturbance"],"d":[["Trauma","1 g IV over 10 min within 3 h, then 1 g over 8 h","15 mg/kg (max 1 g), then 2 mg/kg/h for 8 h",""],["Postpartum haemorrhage","1 g IV over 10 min; second 1 g if bleeding continues after 30 min or restarts within 24 h","—",""],["Surgery","10–15 mg/kg IV (e.g. 1 g) at the start ± repeat or infusion; cardiac regimens use higher totals","10–15 mg/kg","Max IV rate 100 mg/min. Mild–moderate renal impairment, by serum creatinine (μmol/L): 120–249: 10 mg/kg every 12 h; 250–500: 10 mg/kg every 24 h; > 500: 5 mg/kg every 24 h. This table does not override the severe-renal-impairment contraindication"]],"a":["Nausea <script>
"use strict";
var GROUPS = {
 paed:["paediatric","child","children","infant","neonat","pediatric"]
};
var SYN = {
 "epinephrine":["adrenaline"],"norepinephrine":["noradrenaline"],"lidocaine":["lignocaine"],"xylocaine":["lignocaine"],"succinylcholine":["suxamethonium"],"scoline":["suxamethonium"],
 "thiopental":["thiopentone"],"acetaminophen":["paracetamol"],"meperidine":["pethidine"],"glycopyrronium":["glycopyrrolate"],"albuterol":["salbutamol"],"frusemide":["furosemide"],
 "nitroglycerin":["glyceryl trinitrate"],"ntg":["glyceryl trinitrate"],"gtn":["glyceryl trinitrate"],"txa":["tranexamic"],"lmwh":["enoxaparin","low-molecular-weight heparin"],"ufh":["unfractionated"],"ddavp":["desmopressin"],
 "nacl":["sodium chloride"],"kcl":["potassium chloride"],"mgso4":["magnesium"],"nahco3":["bicarbonate"],"bicarb":["bicarbonate"],"snp":["nitroprusside"],"avp":["vasopressin"],"argipressin":["vasopressin"],
 "dexmed":["dexmedetomidine"],"h2":["h2-receptor","ranitidine"],"ppi":["proton pump"],"hartmann":["ringer"],"hartmanns":["ringer"],"rl":["ringer"],
 "ns":["normal saline"],"d5":["dextrose 5"],"d25":["dextrose 25"],"dns":["dextrose normal saline"],
 "last":["local anaesthetic systemic toxicity","lipid rescue"],"mh":["malignant hyperthermia"],"pph":["postpartum haemorrhage"],"hhs":["hyperosmolar"],"dka":["ketoacidosis"],"tbi":["traumatic brain injury"],"ards":["respiratory distress"],
 "anesthesia":["anaesthesia"],"anesthetic":["anaesthetic"],"edema":["oedema"],"hemorrhage":["haemorrhage"],"kidney":["renal"],"liver":["hepatic"],"pregnancy":["pregnan"],"pregnant":["pregnan"],"old":["elderly"],
 "pediatric":GROUPS.paed,"pediatrics":GROUPS.paed,"paediatric":GROUPS.paed,"paediatrics":GROUPS.paed,"children":GROUPS.paed,"child":GROUPS.paed,"kids":GROUPS.paed,"infant":GROUPS.paed,"infants":GROUPS.paed,"neonate":GROUPS.paed,"neonates":GROUPS.paed
};
var ACR = {"last":1,"mh":1,"txa":1,"gtn":1,"lmwh":1,"ufh":1,"snp":1,"avp":1,"ppi":1,"ddavp":1,"rl":1,"ns":1,"dns":1,"hhs":1,"dka":1,"tbi":1,"ards":1,"pph":1,"ponv":1,"icu":1,"qt":1,"aki":1,"hit":1,"ecg":1,"cpr":1,"als":1};
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"").replace(/[^a-z0-9%.+\-\s]/g," ").replace(/\s+/g," ").trim();}
/* Each query word becomes a group of alternatives: the word itself plus its synonyms/expansions.
   Acronyms are matched as whole upper-case words in the source text, so "LAST" never matches "lasts". */
function tokens(q){
  return norm(q).split(" ").filter(Boolean).map(function(w){
    var alts=[{v:w,acr:!!ACR[w]}];
    (SYN[w]||[]).forEach(function(x){var n=norm(x); if(n!==w) alts.push({v:n,acr:false});});
    if(SYN[w]===GROUPS.paed) alts.push({v:"__paed",acr:false});
    return alts;
  });
}
function flat(a){return Array.isArray(a)?a.map(flat).join(" "):String(a||"");}
function acrSet(raw){var o={};(String(raw).match(/\b[A-Z][A-Z0-9]{1,6}\b/g)||[]).forEach(function(x){o[x.toLowerCase()]=1;});return o;}
var RESTR=/not licensed|not recommended|not established|no recommended|contraindicated|off-label|specialist|not investigated|^—$|^$/i;
function buildIndex(db){
  db.forEach(function(d){
    var raw={_name:d.n+" "+d.al,_cls:d.c+" "+d.g+" "+d.f,_ind:flat(d.i)+" "+d.m,_ci:flat(d.x),_dose:flat(d.d),_ae:flat(d.a),_src:d.s+" "+d.u+" "+(d.src?d.src.t:"")};
    d._nm=norm(d.n); d._acr={};
    Object.keys(raw).forEach(function(k){ d[k]=norm(raw[k]); d._acr[k]=acrSet(raw[k]); });
    var usable=d.d.some(function(r){return !RESTR.test(String(r[2]||"").trim());});
    var any=d.d.some(function(r){return String(r[2]||"").trim() && String(r[2]).trim()!=="—";});
    d._paed=usable?2:(any?1:0);
  });
}
function fieldsFor(scope){
  return {all:["_name","_cls","_ind","_ci","_dose","_ae","_src"],name:["_name","_cls"],ind:["_name","_ind"],ci:["_name","_ci"],dose:["_name","_dose"],ae:["_name","_ae"]}[scope]||["_name"];
}
var FW={_name:60,_cls:30,_ind:20,_dose:12,_ci:8,_ae:6,_src:5};
function altHit(d,f,a){
  if(a.v==="__paed") return f==="_dose" && d._paed>0;
  if(a.acr) return !!d._acr[f][a.v] || (a.v.length>3 && d[f].indexOf(a.v)>-1 && f==="_name");
  return d[f].indexOf(a.v)>-1;
}
function score(d,toks,scope){
  if(!toks.length) return 1;
  var f=fieldsFor(scope), total=0;
  for(var i=0;i<toks.length;i++){
    var g=toks[i], best=0;
    {
      for(var q=0;q<g.length;q++){
        var a=g[q]; if(a.acr||a.v==="__paed") continue;
        var b=(d._nm.indexOf(a.v)===0)?100:((" "+d._nm).indexOf(" "+a.v)>-1)?80:(d._name.indexOf(a.v)>-1)?60:0;
        if(q>0&&b) b-=5; if(b>best) best=b;
      }
    }
    for(var j=0;j<f.length;j++){
      for(var k=0;k<g.length;k++){
        if(altHit(d,f[j],g[k])){
          var w=FW[f[j]]||10;
          if(g[k].v==="__paed") w=(d._paed===2)?15:4;
          if(w>best) best=w;
        }
      }
    }
    if(!best) return 0;
    total+=best;
  }
  if(toks.length>1){ var ph=toks.map(function(g){return g[0].v;}).join(" "); for(var m=0;m<f.length;m++){ if(d[f[m]].indexOf(ph)>-1){ total+=FW[f[m]]||10; break; } } }
  return total;
}
function search(db,q,scope,opts){
  opts=opts||{}; var toks=tokens(q);
  var res=db.filter(function(d){return (opts.reserve!==false||!d.res)&&(!opts.group||d.g===opts.group);})
    .map(function(d){return {d:d,s:score(d,toks,scope)};}).filter(function(r){return r.s>0;});
  if(toks.length) res.sort(function(a,b){return b.s-a.s||order(a.d)-order(b.d);}); else res.sort(function(a,b){return order(a.d)-order(b.d);});
  return res.map(function(r){return r.d;});
}
function order(d){return d.res?1000+parseInt(d.ln.slice(1),10):parseInt(d.ln,10);}
if(typeof module!=="undefined"){module.exports={search:search,buildIndex:buildIndex,tokens:tokens,norm:norm};}

  function renderWelcome(){
    var legend=Object.keys(KLAB).map(function(k){return '<li><i class="k-'+k+'"></i>'+esc(KLAB[k])+'</li>';}).join("");
    $("detail").innerHTML='<div class="welcome"><h2>Select a drug or search</h2><p class="prose">The list holds the 96-drug harmonised master list and the 4-drug reserve list. Each entry follows six headings: name and formulations; mechanism; indications; contraindications; dose with age and organ modifiers; adverse effects and interactions.</p><p class="prose">Search accepts British and US names (lignocaine or lidocaine), abbreviations, which match both the acronym and its expansion (LAST, MH, TXA, HHS, TBI), and clinical words (renal, pregnancy, QT). Searching <em>children</em>, <em>child</em>, <em>paediatric</em> or <em>pediatric</em> returns the same cards; cards with a usable paediatric dose rank above cards where paediatric use is restricted or not established. Choose the Dose scope and type <em>renal</em> to see every renal dose modifier.</p><h3 style="font-size:16px;margin:18px 0 4px">Label colours (ISO 26825 syringe-label classes)</h3><ul class="legend">'+legend+'</ul>'
    +'<div class="disc"><strong>Sources.</strong> Each card names its product source (UK SmPC via EMC/MHRA, EU EPAR, or Indian PI) and links the source document where available; practice-guideline regimens are named where they differ from the label. Confirm against the PI of the vial in hand and the local protocol before use.</div>'
    +'<div class="disc"><strong>Author and licence.</strong> © Nov 2026 Prof. Jyotirmay Kirtania, Department of Anaesthesiology, Critical Care & Pain, MPMMCC & HBCH, Varanasi (Tata Memorial Centre). Released under the <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener">GNU General Public License v3.0</a>. You may redistribute and modify this program under GPL-3.0; it is provided without any warranty, including fitness for clinical use. It is a reference for trained clinicians and does not replace the product PI, local protocols or clinical judgement.</div></div>';
  }

  function applyMode(){
    var m=state.mode, W=window.innerWidth, mob=(m==="mobile")||(m==="auto"&&W<820)||(m==="pc"&&W<640);
    document.body.classList.toggle("mobile",mob);
    if(!mob) document.body.classList.remove("showdetail"); else if(state.sel&&!state.listview) document.body.classList.add("showdetail");
    Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-mode")===m));});
    document.documentElement.style.setProperty("--hdr",$("hdr").offsetHeight+"px");
  }

  function select(id,push){
    state.sel=id; state.listview=false; renderList(); renderDetail();
    if(document.body.classList.contains("mobile")) document.body.classList.add("showdetail");
    if(push!==false){ if(location.hash!=="#"+id) history.replaceState(null,"","#"+id); }
  }

  $("list").addEventListener("click",function(e){var b=e.target.closest(".item");if(b) select(b.getAttribute("data-id"));});
  var tmr; $("q").addEventListener("input",function(){clearTimeout(tmr);tmr=setTimeout(function(){
    state.q=$("q").value;
    if(document.body.classList.contains("mobile")&&document.body.classList.contains("showdetail")){document.body.classList.remove("showdetail");state.listview=true;}
    renderList(); if(state.sel) renderDetail(); applyMode();
  },90);});
  $("q").addEventListener("keydown",function(e){
    if(e.key==="Enter"){var f=document.querySelector(".item");if(f) select(f.getAttribute("data-id"));}
    if(e.key==="Escape"){$("q").value="";state.q="";renderList();if(state.sel)renderDetail();}
  });
  $("clr").addEventListener("click",function(){$("q").value="";state.q="";renderList();if(state.sel)renderDetail();$("q").focus();});
  function setScope(sc){
    state.scope=sc;
    Array.prototype.forEach.call(document.querySelectorAll("[data-scope]"),function(x){var on=x.getAttribute("data-scope")===sc;x.setAttribute("aria-pressed",String(on));x.setAttribute("aria-selected",String(on));});
    renderList(); if(state.sel) renderDetail();
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-scope]"),function(b){b.addEventListener("click",function(){setScope(b.getAttribute("data-scope"));});});
  $("grp").addEventListener("change",function(){state.group=this.value;renderList();});
  $("res").addEventListener("change",function(){state.reserve=this.checked;renderList();});
  Array.prototype.forEach.call(document.querySelectorAll("[data-mode]"),function(b){b.addEventListener("click",function(){state.mode=b.getAttribute("data-mode");store.set("ddb-mode",state.mode);applyMode();renderDetail();});});
  $("theme").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next=dark?"light":"dark"; document.documentElement.setAttribute("data-theme",next); store.set("ddb-theme",next);
  });
  document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus();}});
  var rz; window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(applyMode,80);});
  window.addEventListener("orientationchange",function(){setTimeout(applyMode,150);});
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(applyMode);
  window.addEventListener("hashchange",function(){var id=location.hash.slice(1);if(id&&id!==state.sel&&DB.some(function(d){return d.id===id;}))select(id,false);});

  var t=store.get("ddb-theme"); if(t==="dark"||t==="light") document.documentElement.setAttribute("data-theme",t);
  var m=store.get("ddb-mode"); if(m==="pc"||m==="mobile"||m==="auto") state.mode=m;
  applyMode(); renderList();
  var h0=location.hash.slice(1); if(h0&&DB.some(function(d){return d.id===h0;})) select(h0,false); else renderWelcome();
})();
</script>
